{t:"Construire avec l'IA et publier",s:"Bien demander, tester, versionner, mettre en ligne, faire vivre.",
f:[
["Travailler avec une IA","<ul><li>L'IA écrit vite ; <b>tu restes responsable</b> du résultat.</li><li><b>Bonne demande</b> : le contexte, l'objectif, les contraintes, un exemple, le format attendu.</li><li><b>Petites étapes</b> : une fonction à la fois, testée avant la suivante.</li><li>Demande-lui d'<b>expliquer</b> ce qu'elle a écrit : comprendre te permet de corriger.</li><li>Donne-lui le <b>message d'erreur exact</b>, pas « ça ne marche pas ».</li><li>Méfie-toi de ce qu'elle <b>affirme sans preuve</b> : une fonction peut ne pas exister. On vérifie en exécutant.</li><li>Ne lui confie pas tes <b>clés secrètes</b>.</li></ul>"],
["Tester et déboguer","<ul><li><b>Tester</b> après chaque changement : le parcours principal, puis les cas limites (champ vide, réseau coupé, double clic).</li><li><b>Reproduire</b> le bug avant de le corriger : quelles étapes, quel appareil ?</li><li><b>Lire</b> le message d'erreur et la ligne indiquée.</li><li><b>Isoler</b> : qu'est-ce qui a changé depuis que ça marchait ?</li><li><b>Un changement à la fois</b>, puis on reteste.</li><li>Tester sur un <b>vrai téléphone</b>, pas seulement sur l'ordinateur.</li><li>Un bug corrigé mérite un test pour qu'il ne revienne pas.</li></ul>"],
["Versionner avec Git et GitHub","<ul><li><b>Git</b> garde l'historique du projet. <b>GitHub</b> héberge le dépôt en ligne.</li><li><b>Commit</b> : un point de sauvegarde avec un message clair.</li><li><b>Branche</b> : une copie de travail pour essayer sans casser la version qui marche.</li><li><b>Revenir en arrière</b> est toujours possible : c'est ta ceinture de sécurité.</li><li><b>GitHub Pages</b> : met en ligne gratuitement un site statique depuis le dépôt.</li><li><b>GitHub Actions</b> : automatise des tâches, par exemple construire un fichier APK à chaque mise à jour.</li><li>Un fichier <code>.gitignore</code> exclut ce qui ne doit pas être publié.</li></ul>"],
["Publier et faire vivre","<ul><li><b>Avant de publier</b> : test complet, icônes, nom, page de confidentialité, numéro de version.</li><li><b>Distribuer</b> : lien web installable (PWA), fichier APK, ou boutique d'applications (compte développeur payant, règles à respecter).</li><li><b>Mettre à jour</b> : numéro de version, notes de version courtes, bouton de mise à jour.</li><li><b>Écouter</b> : un moyen simple de signaler un problème.</li><li><b>Mesurer</b> : combien de personnes reviennent ? C'est le vrai signe d'utilité.</li><li><b>Gagner de l'argent</b> : vente, abonnement, commission, service aux professionnels. Vérifie d'abord que quelqu'un est prêt à payer.</li><li>Une application sans maintenance vieillit vite.</li></ul>"]],

{t:"GitHub en pratique",s:"Dépôt, commits, branches, mise en ligne, automatisation, versions publiées.",
f:[
["Le dépôt et les commits","<ul><li>Un <b>dépôt</b> (repository) contient les fichiers du projet et tout leur <b>historique</b>.</li><li><b>Public</b> : tout le monde peut le lire. <b>Privé</b> : seulement toi et les personnes invitées.</li><li><b>Commit</b> : une sauvegarde datée avec un message. Bon message : ce qui change et pourquoi (« Corrige le calcul du total »).</li><li><b>Depuis le téléphone ou le navigateur</b> : on peut ajouter et modifier des fichiers directement sur github.com (Add file, puis Commit changes).</li><li><b>README.md</b> : la page d'accueil du dépôt ; elle explique à quoi sert le projet et comment l'utiliser.</li><li><b>.gitignore</b> : la liste des fichiers à ne jamais publier.</li><li>L'historique permet de <b>revenir</b> à n'importe quelle version.</li></ul>"],
["Branches, demandes de fusion, tickets","<ul><li><b>main</b> : la branche principale, celle qui est en ligne.</li><li><b>Branche</b> : une copie pour travailler sans toucher à main.</li><li><b>Pull request</b> : la demande de fusion d'une branche vers main ; on y relit les changements avant de fusionner.</li><li><b>Issues</b> : les tickets, pour noter bugs et idées. Une issue = un sujet.</li><li><b>Conflit</b> : deux modifications de la même ligne ; il faut choisir laquelle garder.</li><li>Seul, une branche reste utile pour tout changement risqué : si ça casse, main est intact.</li></ul>"],
["GitHub Pages et GitHub Actions","<ul><li><b>GitHub Pages</b> : héberge un site statique. Settings → Pages → branche <b>main</b>, dossier racine. Adresse : <code>compte.github.io/depot</code>.</li><li>La page d'entrée doit s'appeler <b>index.html</b>. La mise en ligne prend une à deux minutes après chaque commit.</li><li><b>GitHub Actions</b> : des tâches automatiques décrites dans un fichier <code>.github/workflows/nom.yml</code>.</li><li>Un <b>workflow</b> se déclenche sur un événement (un commit, un clic sur « Run workflow ») et exécute des étapes : installer, construire, publier.</li><li>Exemple : construire un <b>APK</b> Android à chaque mise à jour.</li><li>L'onglet <b>Actions</b> montre chaque exécution et ses erreurs, étape par étape.</li></ul>"],
["Versions publiées et secrets","<ul><li><b>Release</b> : une version publiée, avec un numéro (étiquette) et des fichiers à télécharger, par exemple l'APK.</li><li>L'adresse <code>/releases/latest</code> pointe toujours vers la dernière version : pratique pour un bouton « Télécharger ».</li><li><b>Secrets</b> (Settings → Secrets and variables → Actions) : l'endroit où ranger les mots de passe et les clés dont un workflow a besoin. Ils ne s'affichent jamais dans les journaux.</li><li>On n'écrit <b>jamais</b> une clé secrète dans un fichier du dépôt, même privé.</li><li><b>Signature d'un APK</b> : Android n'accepte une mise à jour que si elle est signée avec la <b>même clé</b> que la version installée. On garde donc cette clé précieusement.</li><li>Active la <b>double authentification</b> sur ton compte.</li></ul>"]],

{t:"Firebase",s:"Projet, authentification, base Firestore, règles de sécurité, coûts.",
f:[
["Ce que fournit Firebase","<ul><li><b>Firebase</b> (Google) regroupe des services prêts à l'emploi pour une application.</li><li><b>Authentication</b> : comptes utilisateurs (courriel, Google, téléphone).</li><li><b>Cloud Firestore</b> : base de données en temps réel.</li><li><b>Hosting</b> : hébergement du site. <b>Cloud Storage</b> : fichiers (photos). <b>Cloud Functions</b> : code exécuté côté serveur.</li><li><b>Console Firebase</b> : on y crée le <b>projet</b>, puis on y ajoute une <b>application web</b> ; la console donne un bloc de <b>configuration</b> à coller dans le code.</li><li>Cette configuration (dont <code>apiKey</code>) <b>n'est pas un secret</b> : elle identifie le projet. La protection vient des <b>règles de sécurité</b>.</li></ul>"],
["Firestore : collections et documents","<ul><li>Firestore est une base <b>NoSQL</b> : pas de tables, mais des <b>collections</b> qui contiennent des <b>documents</b>.</li><li>Un document est un ensemble de <b>champs</b> (nom, prix, date) avec un <b>identifiant</b>.</li><li>Chemin : <code>produits/abc123</code>. Un document peut contenir des <b>sous-collections</b>.</li><li><b>Lire</b> : un document, ou une <b>requête</b> sur une collection (filtrer, trier, limiter).</li><li><b>Écoute en temps réel</b> : l'écran se met à jour dès que la donnée change.</li><li><b>Coût</b> : on paie au nombre de <b>lectures</b> et d'<b>écritures</b> de documents. Lire 500 documents pour en afficher 10 coûte 500 lectures : on <b>limite</b> et on <b>filtre</b> côté base.</li><li>On structure les données selon les <b>écrans</b> à afficher.</li></ul>"],
["Les règles de sécurité","<ul><li>Elles décident <b>qui peut lire et écrire quoi</b>. Elles s'écrivent dans la console (onglet Règles).</li><li><b>Mode test</b> : tout est ouvert pendant un temps limité. À ne jamais laisser en production.</li><li><code>request.auth</code> : l'utilisateur connecté ; <code>request.auth.uid</code> : son identifiant.</li><li>Règle type : un utilisateur ne lit et n'écrit que <b>son</b> document : <code>allow read, write: if request.auth != null &amp;&amp; request.auth.uid == userId;</code></li><li>Lecture publique, écriture réservée : <code>allow read: if true; allow write: if request.auth != null;</code></li><li>Le <b>simulateur de règles</b> de la console permet de tester avant de publier.</li><li>Sans règle correcte, cacher un bouton dans l'interface ne protège rien.</li></ul>"],
["Formules et limites","<ul><li><b>Spark</b> : formule gratuite, sans carte bancaire, avec des quotas. Firestore : environ <b>50 000 lectures</b> et <b>20 000 écritures par jour</b>, 1 Go de données.</li><li>Quota dépassé en Spark : les opérations sont <b>refusées</b> jusqu'au lendemain.</li><li><b>Blaze</b> : paiement à l'usage au-delà des mêmes quotas gratuits. Certains services (stockage de fichiers, fonctions) demandent Blaze.</li><li>En Blaze, il n'y a <b>pas de plafond automatique</b> : on règle des <b>alertes de budget</b>.</li><li>Les quotas et les prix changent : vérifie la page officielle des tarifs avant de te lancer.</li><li>Pour limiter les lectures : pagination, cache local, pas d'écoute inutile.</li></ul>"]],
q:[
["Quel service Firebase gère les comptes utilisateurs ?",["Authentication","Hosting","Firestore","Analytics"],"Courriel, Google, téléphone."],
["Firestore range les données en…",["collections de documents","tables et lignes","feuilles de calcul","fichiers texte"],"C'est une base NoSQL."],
["La configuration Firebase collée dans le code (apiKey…) est…",["un identifiant de projet, pas un secret","un mot de passe administrateur","à cacher absolument","inutile"],"La protection vient des règles."],
["Qu'est-ce qui protège réellement les données Firestore ?",["Les règles de sécurité","Le fait de cacher les boutons","Le nom du projet","Le mode sombre"],"Elles s'appliquent côté serveur."],
["Le « mode test » de Firestore…",["laisse la base ouverte temporairement","est recommandé en production","chiffre les données","supprime les comptes"],"À remplacer avant la mise en ligne."],
["Dans une règle, request.auth.uid désigne…",["l'identifiant de l'utilisateur connecté","le nom du projet","la date","l'adresse du site"],"On le compare à l'identifiant du document."],
["Quelle règle réserve l'écriture aux utilisateurs connectés ?",["allow write: if request.auth != null;","allow write: if true;","allow write;","deny all;"],"request.auth vaut null sans connexion."],
["Firestore se paie surtout…",["au nombre de lectures et d'écritures","au nombre de lignes de code","à la couleur du site","au nombre de développeurs"],"D'où l'intérêt de filtrer et limiter."],
["Afficher 10 produits en lisant toute la collection de 500 coûte…",["500 lectures","10 lectures","1 lecture","0 lecture"],"On utilise une limite dans la requête."],
["La formule gratuite de Firebase s'appelle…",["Spark","Blaze","Flame","Free+"],"Sans carte bancaire."],

{t:"Supabase",s:"Base Postgres, tables, sécurité au niveau des lignes, clés, authentification.",
f:[
["Ce que fournit Supabase","<ul><li><b>Supabase</b> repose sur <b>PostgreSQL</b>, une base de données <b>relationnelle</b> (SQL).</li><li><b>Database</b> : tables, colonnes, relations. <b>Auth</b> : comptes utilisateurs. <b>Storage</b> : fichiers. <b>Edge Functions</b> : code côté serveur. <b>Realtime</b> : mises à jour en direct.</li><li>Chaque table est automatiquement accessible par une <b>API</b> : pas de serveur à écrire.</li><li>Le <b>tableau de bord</b> offre un éditeur de tables et un <b>éditeur SQL</b>.</li><li><b>Firebase ou Supabase ?</b> Firestore : documents, très simple pour démarrer. Supabase : tables liées entre elles, requêtes puissantes, SQL standard.</li><li>Vérifie les limites de la formule gratuite (par exemple la mise en pause d'un projet inactif) sur le site officiel.</li></ul>"],
["Tables, clés et requêtes","<ul><li>Une <b>table</b> a des <b>colonnes</b> typées (texte, nombre, date, booléen) et des <b>lignes</b>.</li><li><b>Clé primaire</b> : l'identifiant unique d'une ligne (souvent <code>id</code>).</li><li><b>Clé étrangère</b> : une colonne qui pointe vers une autre table (<code>commande.client_id</code> → <code>clients.id</code>).</li><li><b>SQL</b> : <code>select * from produits where prix &lt; 1000 order by nom limit 20;</code></li><li><code>insert</code> ajoute, <code>update</code> modifie, <code>delete</code> supprime. Un <code>update</code> ou un <code>delete</code> <b>sans where</b> touche toutes les lignes.</li><li><b>Jointure</b> : réunir les lignes de deux tables liées.</li><li><b>Migration</b> : un changement de structure enregistré, pour pouvoir le rejouer.</li></ul>"],
["La sécurité au niveau des lignes (RLS)","<ul><li><b>RLS</b> (Row Level Security) : des <b>politiques</b> décident, ligne par ligne, qui peut lire, ajouter, modifier, supprimer.</li><li>Elle s'<b>active table par table</b> : <code>alter table commandes enable row level security;</code></li><li>RLS activée <b>sans politique</b> : personne n'accède à rien. RLS <b>désactivée</b> : toute personne ayant la clé publique accède à tout.</li><li>Politique type : <code>create policy &quot;mes commandes&quot; on commandes for select using (auth.uid() = client_id);</code></li><li><code>auth.uid()</code> : l'identifiant de l'utilisateur connecté.</li><li>Le tableau de bord signale les tables <b>sans RLS</b> : traite ces alertes avant toute mise en ligne.</li><li>Teste avec deux comptes : le second ne doit rien voir du premier.</li></ul>"],
["Les clés et l'authentification","<ul><li><b>Clé publique</b> (<code>sb_publishable_…</code>, anciennement <b>anon</b>) : elle va dans l'application. Elle est sans danger <b>si la RLS est en place</b>.</li><li><b>Clé secrète</b> (<code>sb_secret_…</code>, anciennement <b>service_role</b>) : elle <b>contourne la RLS</b>. Jamais dans le navigateur, jamais sur GitHub ; seulement côté serveur.</li><li>Les anciennes clés <b>anon</b> et <b>service_role</b> sont en cours de remplacement : pour un nouveau projet, utilise les nouvelles.</li><li>Clé secrète exposée : on la <b>révoque</b> et on en crée une autre.</li><li><b>Auth</b> : inscription par courriel, lien magique, fournisseurs (Google). Une fois connecté, les requêtes portent l'identité de l'utilisateur, que les politiques utilisent.</li><li>Les <b>rôles</b> (client, vendeur, administrateur) se stockent dans une table et se vérifient dans les politiques.</li></ul>"]],
q:[
["Sur quelle base de données repose Supabase ?",["PostgreSQL","MongoDB","Excel","Firestore"],"Une base relationnelle, en SQL."],
["Dans une base relationnelle, les données sont rangées en…",["tables, lignes et colonnes","collections de documents","fichiers audio","dossiers"],"Avec des relations entre tables."],
["La clé primaire est…",["l'identifiant unique d'une ligne","le mot de passe de la base","la première colonne visible","une clé de chiffrement"],"Souvent une colonne id."],
["Une clé étrangère sert à…",["relier une ligne à une autre table","chiffrer une colonne","traduire les données","supprimer une table"],"Par exemple commande.client_id."],
["Que fait : select * from produits where prix &lt; 1000 limit 20; ?",["Elle renvoie au plus 20 produits de moins de 1 000","Elle supprime des produits","Elle crée une table","Elle modifie les prix"],"Filtrer puis limiter."],
["Un delete sans where…",["supprime toutes les lignes de la table","ne fait rien","supprime une ligne au hasard","demande une confirmation"],"Toujours relire avant d'exécuter."],
["RLS signifie…",["sécurité au niveau des lignes","réseau local sécurisé","requête lente simplifiée","rôle libre standard"],"Row Level Security."],
["RLS désactivée sur une table, avec la clé publique dans l'application : qui peut lire la table ?",["Tout le monde","Personne","Seulement l'administrateur","Seulement les utilisateurs connectés"],"C'est la faille la plus fréquente."],
["RLS activée mais sans aucune politique : qui accède aux lignes ?",["Personne (hors clé secrète)","Tout le monde","Les utilisateurs connectés","Les visiteurs"],"Il faut écrire les politiques."],
["Dans une politique, auth.uid() renvoie…",["l'identifiant de l'utilisateur connecté","le nom de la table","l'heure","la clé secrète"],"On le compare à la colonne propriétaire."],
["Quelle clé peut figurer dans le code de l'application ?",["La clé publique (publishable, anciennement anon)","La clé secrète","La clé service_role","Aucune"],"À condition que la RLS soit en place."],
["La clé secrète (anciennement service_role)…",["contourne la RLS et ne doit jamais être côté client","est sans danger","se met dans le manifeste","sert à l'inscription des utilisateurs"],"Elle donne tous les droits."]],

function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};
      if(tmax)count(tmax,document.getElementById("tmr"),()=>fin(0,`Temps écoulé. La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`))}
    else{const pool=shuf(Q.it.map((t,k)=>[t,k]));let pick=[];
      const draw=()=>{z.innerHTML=`<p class="mut">Touche les étapes dans l'ordre. Touche une étape déjà placée pour l'enlever.</p><div id="chosen">${pick.map((p,n)=>`<button class="opt" data-p="${n}" style="border-color:var(--lag)"><b>${n+1}.</b> ${p[0]}</button>`).join("")}</div>${pick.length<pool.length?`<p class="mut" style="margin-top:10px">À placer :</p>`:""}<div>${pool.filter(p=>!pick.includes(p)).map(p=>`<button class="opt" data-k="${p[1]}">${p[0]}</button>`).join("")}</div>${pick.length===pool.length?`<button class="btn" id="val">Valider l'ordre</button>`:""}`;
        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});
        z.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
        const v=document.getElementById("val");if(v)v.onclick=()=>{const good=pick.filter((p,n)=>p[1]===n).length,sc=good/pool.length;
          z.innerHTML=`<p class="mut">Ordre correct :</p>`+Q.it.map((t,n)=>`<div class="opt ${pick[n][1]===n?"good":"bad"}"><b>${n+1}.</b> ${t}</div>`).join("");fin(sc===1?1:Math.round(sc*100)/100,sc===1?"Exact.":`${good} étape(s) bien placée(s) sur ${pool.length}.`)}};
      draw();if(tmax)count(tmax*1.5,document.getElementById("tmr"),()=>{z.innerHTML=Q.it.map((t,n)=>`<div class="opt"><b>${n+1}.</b> ${t}</div>`).join("");fin(0,"Temps écoulé.")})}})()}

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function mix(n,l){ // révision : erreurs d'abord, puis tirage dans les niveaux déjà vus
  const pool=[];for(let i=0;i<=l;i++)L[i].q.forEach((_,k)=>pool.push(i+"."+k));
  const w=shuf(S.w.filter(k=>pool.includes(k))),rest=shuf(pool.filter(k=>!w.includes(k)));
  return w.concat(rest).slice(0,n).map(k=>k.split(".").map(Number));}
function plan(l,d){const Q=a=>a.map(k=>[l,k]),m=SIMMAP[l],sn=m==="dil"?"Dilemmes de concepteur":"Atelier : "+AT[+m.slice(2)].t;
  return [
  [{k:"lire",f:[0,1],m:12},{k:"quiz",q:()=>Q(rng(0,6)),m:10},{k:"sim",m:15,n:sn}],
  [{k:"lire",f:[2,3],m:12},{k:"quiz",q:()=>Q(rng(6,12)),m:10},{k:"cas",c:[0],m:8}],
  [{k:"oral",o:[0],m:10},{k:"cas",c:[1],m:8},{k:"quiz",q:()=>mix(8,l),m:10,n:"Révision"}],
  [{k:"oral",o:[1],m:10},{k:"lire",f:[0,1,2,3],m:12,n:"Relecture des fiches"},{k:"quiz",q:()=>mix(10,l),m:12,n:"Révision ciblée"}],

function rank(){let r=RANKS[0],nx=null;for(const x of RANKS){if(S.xp>=x[0])r=x;else{nx=x;break}}return{r,nx}}
function gain(key,score){const first=!(key in S.s);const xp=first?10+Math.round(score/5):5;
  if(key)S.s[key]=Math.max(S.s[key]||0,score);S.xp+=xp;if(!S.days.includes(today()))S.days.push(today());save();return xp}
const TTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
let AU=null,AUSRC=null,AUBLOB={};
function hush(){try{if(TTS)speechSynthesis.cancel()}catch(e){}try{if(AU){AU.pause();AU=null}}catch(e){}}
function prefetch(src){AUSRC=src;if(!src||AUBLOB[src])return;try{fetch(src).then(r=>r.ok?r.blob():null).then(b=>{if(b)AUBLOB[src]=URL.createObjectURL(b)}).catch(()=>{})}catch(e){}}
function toast(t){let d=document.getElementById("tst");if(!d){d=document.createElement("div");d.id="tst";d.style.cssText="position:fixed;left:12px;right:12px;bottom:80px;background:#14323a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14.5px;z-index:9";document.body.appendChild(d)}d.textContent=t;d.style.display="block";clearTimeout(d._t);d._t=setTimeout(()=>d.style.display="none",6000)}

function readOut(btn){
  if(AU||(TTS&&speechSynthesis.speaking)){hush();btn.textContent="🔊 Écouter";return}
  if(!TTS)return toast("La lecture audio utilise la voix du téléphone : ouvre le jeu dans Chrome ou installe l'application (Profil).")

  const parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];let n=0;

    app.innerHTML=hdr("Débriefing")+`<div class="card"><p><b>Exposé : ${fmt(used)}</b> sur ${o.expo}:00, ${msg}.</p><p><b>${asked.length} questions</b> traitées. Ouvre chacune et compare avec ce que tu as réellement dit.</p></div>`+asked.map(q=>`<details class="card"><summary><b>${J[q[0]].n} :</b> ${q[1]}</summary><ul>${q[2].map(k=>`<li>${k}</li>`).join("")}</ul></details>`).join("")+`<div class="card"><h3>Grille du jury</h3><p class="mut">Note-toi comme un jury le ferait : 0 = absent, 2 = moyen, 4 = excellent.</p>${CRIT.map(c=>`<label class="ck"><span style="flex:1">${c}</span><select>${[0,1,2,3,4].map(n=>`<option ${n===2?"selected":""}>${n}</option>`).join("")}</select></label>`).join("")}<button class="btn" id="ok">Calculer ma note</button></div>`;
    bindBack(back);document.getElementById("ok").onclick=()=>{let n=0;app.querySelectorAll("select").forEach(x=>n+=+x.value);note20(o.t,n,back)}}}
function examQCM(){AUSRC=null;const back=()=>go("exam"),pool=[];L.forEach((x,l)=>x.q.forEach((_,k)=>pool.push([l,k])));const items=shuf(pool).slice(0,30),res=[];let i=0,over=false;

const DIFF=["Normal","Difficile","Expert"];
const dif=()=>S.diff||0;
function simu(done,back){const st=Object.assign({},SIMCFG.st),fl={},log=[],D=dif(),mult=D===2?1.5:D===1?1.25:1,tmax=D===2?40:D===1?75:0;let i=0;
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const bars=()=>D===2?`<p class="mut">Mode expert : indicateurs masqués jusqu'au bilan.</p>`:Object.keys(IND).map(k=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="flex:0 0 150px">${IND[k]}</span><div class="bar" style="flex:1;margin:3px 0"><i style="width:${st[k]}%;background:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}"></i></div></div>`).join("");
  app.innerHTML=hdr(SIMCFG.title)+`<div class="card fiche"><h2 style="margin-top:0">${SIMCFG.head}</h2><p>${SIMCFG.intro} <b>Chaque décision change la suite</b> : certaines situations n'arrivent que parce que tu as choisi quelque chose avant.</p><ul><li>Six indicateurs : ${Object.values(IND).join(", ").toLowerCase()}.</li><li>Niveau : <b>${DIFF[D]}</b>${tmax?` · ${tmax} secondes par décision, sinon la situation décide pour toi`:""}${D>=1?" · explications seulement au bilan":""}.</li><li>Change le niveau dans Profil.</li></ul><button class="btn" id="go">${SIMCFG.start}</button></div>`;
  bindBack(back);document.getElementById("go").onclick=next;
  function next(){halt();while(i<EV.length&&EV[i].when&&!EV[i].when(fl))i++;if(i>=EV.length)return bilan();const E=EV[i],o=shuf(E.o.map((x,k)=>[x,k]));window.scrollTo(0,0);
    app.innerHTML=hdr(E.j)+`<div class="card">${bars()}</div><div class="card"><h2 style="margin-top:0">${E.t}</h2><p>${E.s}</p>${tmax?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0][0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const opt=j<0?["Aucune décision prise à temps.",SIMCFG.none,[],"Ne pas décider est une décision : la situation s'est dégradée sans toi."]:o[j][0];
      Object.entries(opt[1]).forEach(([k,v])=>st[k]=clamp(st[k]+(v<0?v*mult:v)));opt[2].forEach(f=>fl[f]=1);
      const best=Math.max(...E.o.map(x=>Object.values(x[1]).reduce((s,v)=>s+v,0)));const mine=Object.values(opt[1]).reduce((s,v)=>s+v,0);
      log.push({j:E.j,t:E.t,c:opt[0],fb:opt[3],ok:mine>=best});i++;
      if(D===0){app.querySelectorAll(".opt").forEach(b=>b.disabled=true);if(j>=0)app.querySelectorAll(".opt")[j].classList.add(mine>=best?"good":"bad");document.getElementById("fb").innerHTML=`<div class="fb">${opt[3]}</div><button class="btn" id="nx">Continuer</button>`;document.getElementById("nx").onclick=next}else next()};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));
    if(tmax)count(tmax,document.getElementById("tmr"),()=>pick(-1))}
  function bilan(){window.scrollTo(0,0);const w=SIMCFG.w,tot=Object.keys(w).reduce((s,k)=>s+st[k]*w[k],0)/Object.values(w).reduce((s,v)=>s+v,0);
    let sc=Math.round(tot);if(SIMCFG.crit.some(k=>st[k]<45)||SIMCFG.cap(fl))sc=Math.min(sc,45);
    const nb=log.filter(x=>x.ok).length,grade=SIMCFG.grades[sc>=85?0:sc>=70?1:sc>=55?2:3];
    const chains=CHAINS.filter(c=>c[0](fl)).map(c=>c[1]);
    app.innerHTML=hdr("Bilan du mois")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2><p><b>${grade}</b> · ${nb} meilleures décisions sur ${log.length}</p></div><div class="card">${Object.keys(IND).map(k=>`<p style="display:flex;justify-content:space-between;margin:4px 0"><span>${IND[k]}</span><b style="color:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}">${st[k]}</b></p>`).join("")}</div>${chains.length?`<div class="card warn"><h3>L'effet domino</h3><ul class="mut" style="padding-left:18px">${chains.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}<h2>Tes décisions</h2>${log.map(x=>`<details class="card"><summary>${x.ok?"✓":"✗"} <b>${x.j}</b> · ${x.t}</summary><p><b>Ton choix :</b> ${x.c}</p><div class="fb">${x.fb}</div></details>`).join("")}<button class="btn" id="ok">Terminer</button>`;
    bindBack(back);document.getElementById("ok").onclick=()=>{S.ex.unshift([today(),"Un mois aux RH · "+DIFF[D],Math.round(sc/5*10)/10]);S.ex=S.ex.slice(0,30);done(sc)}}}

function dilem(done,back){let i=0,pts=0;const items=shuf(DIL).slice(0,dif()>=1?10:6),hard=dif()>=1;const recap=[];
  (function show(){const C=items[i],o=shuf(C.o);window.scrollTo(0,0);
    app.innerHTML=hdr(`Dilemme ${i+1}/${items.length}`)+`<div class="card"><h2 style="margin-top:0">${C.t}</h2><p>${C.s}</p>${dif()>=2?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const x=j<0?["(pas de décision)",0,"La situation évolue sans toi.","Le problème s'aggrave."]:o[j];pts+=x[1];recap.push([C.t,x]);
      if(hard){i++;return i<items.length?show():fin()}
      app.querySelectorAll(".opt").forEach((b,m)=>{b.disabled=true;{const c=o[m][1]===2?"good":o[m][1]===0?"bad":"";if(c)b.classList.add(c)}});
      document.getElementById("fb").innerHTML=`<div class="fb"><b>À court terme :</b> ${x[2]}<br><b>À long terme :</b> ${x[3]}</div>${x[1]<2?`<div class="fb" style="border-color:var(--ok)"><b>Meilleure option :</b> ${C.o.find(y=>y[1]===2)[0]}</div>`:""}<button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<items.length?show():fin()}};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));if(dif()>=2)count(45,document.getElementById("tmr"),()=>pick(-1))})();
  function fin(){const sc=Math.round(pts/(items.length*2)*100);if(!hard)return done(sc);window.scrollTo(0,0);
    app.innerHTML=hdr("Bilan des dilemmes")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2></div>`+recap.map(([t,x])=>`<details class="card"><summary>${x[1]===2?"✓":x[1]===1?"≈":"✗"} <b>${t}</b></summary><p><b>Ton choix :</b> ${x[0]}</p><div class="fb"><b>Court terme :</b> ${x[2]}<br><b>Long terme :</b> ${x[3]}</div></details>`).join("")+`<button class="btn" id="ok">Terminer</button>`;
    bindBack(back);document.getElementById("ok").onclick=()=>done(sc)}}

  <div class="card warn"><h3>Et après ?</h3><ul class="mut" style="padding-left:18px;margin:6px 0"><li>Choisis <b>un</b> problème réel et publie une version minimale.</li><li>Fais-la tester par 5 personnes et corrige.</li><li>Vérifie les <b>règles d'accès</b> de ta base avant toute mise en ligne.</li><li>Tiens un journal des versions.</li></ul></div>
  <div class="card"><h3>Sauvegarde</h3><p class="mut">Ta progression reste dans ce navigateur. Pour changer d'appareil, copie ce code et colle-le sur l'autre.</p><textarea id="ex" style="min-height:70px" readonly></textarea><button class="btn sec" id="cp">Copier mon code</button><textarea id="im" style="min-height:70px;margin-top:10px" placeholder="Colle ici un code de sauvegarde…"></textarea><button class="btn sec" id="imb">Restaurer</button><p id="msg" class="mut"></p></div>

  <div class="card"><button class="btn sec" id="rs" style="border-color:var(--ko);color:var(--ko);margin:0">Tout remettre à zéro</button><div id="rc"></div></div>`;

  document.getElementById("fr").onchange=e=>{S.free=e.target.checked;save()};document.querySelectorAll("#dfx button").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;save();go("profil")});document.getElementById("pinst").onclick=installApp;document.getElementById("pupd").onclick=updateApp;

  document.getElementById("imb").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("im").value.trim()))));if(typeof o.xp!=="number")throw 0;S=Object.assign({s:{},xp:0,w:[],days:[],free:false,txt:{},ex:[]},o);save();msg("Progression restaurée.");go("profil")}catch(e){msg("Code invalide.")}};

["Les conditions","<ul><li><code>=SI(test;valeur_si_vrai;valeur_si_faux)</code>. Exemple : <code>=SI(B2&gt;=10;&quot;Admis&quot;;&quot;Refusé&quot;)</code>.</li><li><b>Opérateurs</b> : = , &lt;&gt; (différent), &gt; , &lt; , &gt;= , &lt;=.</li><li><code>ET(...)</code> : toutes les conditions vraies. <code>OU(...)</code> : au moins une.</li><li><b>Plusieurs cas</b> : <code>SI</code> imbriqués, ou <code>SI.CONDITIONS</code> dans les versions récentes.</li><li>Le texte s'écrit entre <b>guillemets</b> ; les nombres sans.</li><li>Au-delà de trois niveaux d'imbrication, une table de correspondance et une recherche sont plus lisibles.</li></ul>"],
["Compter et additionner sous condition","<ul><li><code>=NB.SI(plage;critère)</code> : combien de cellules répondent au critère. <code>=NB.SI(C2:C100;&quot;Moorea&quot;)</code>.</li><li><code>=SOMME.SI(plage_critère;critère;plage_somme)</code> : total des montants pour un critère.</li><li><code>=SOMME.SI.ENS(plage_somme;plage1;critère1;plage2;critère2)</code> : plusieurs critères. Attention : la plage à additionner vient <b>en premier</b>.</li><li><code>=MOYENNE.SI(...)</code> sur le même modèle.</li><li>Critères avec opérateur : <code>&quot;&gt;1000&quot;</code>.</li><li>Pour beaucoup de croisements, le <b>tableau croisé dynamique</b> est plus rapide.</li></ul>"],
["Rechercher une valeur","<ul><li><code>=RECHERCHEV(valeur;table;numéro_colonne;FAUX)</code> : cherche la valeur dans la <b>première colonne</b> de la table et renvoie celle de la colonne indiquée.</li><li>Le dernier argument <b>FAUX</b> demande une correspondance <b>exacte</b>. Sans lui, les résultats peuvent être faux.</li><li><b>Limites</b> : elle ne cherche que vers la droite ; elle casse si on insère une colonne.</li><li><code>=RECHERCHEX(valeur;plage_recherche;plage_résultat)</code> : plus simple et plus souple, dans les versions récentes.</li><li><code>=INDEX(plage;EQUIV(valeur;plage;0))</code> : l'équivalent dans toutes les versions.</li><li><b>#N/A</b> : valeur introuvable ; souvent une espace en trop ou un nombre stocké en texte.</li><li>Fixe la table avec des <b>$</b> avant de recopier.</li></ul>"],
["Texte et dates","<ul><li><b>Assembler</b> : <code>=A2&amp;&quot; &quot;&amp;B2</code> ou <code>CONCAT</code>.</li><li><b>Découper</b> : <code>GAUCHE(texte;n)</code>, <code>DROITE(texte;n)</code>, <code>STXT(texte;début;n)</code>.</li><li><b>Nettoyer</b> : <code>SUPPRESPACE</code>, <code>MAJUSCULE</code>, <code>NOMPROPRE</code>.</li><li><b>Dates</b> : <code>AUJOURDHUI()</code>, <code>ANNEE</code>, <code>MOIS</code>, <code>JOUR</code>.</li><li><b>Écart</b> : <code>=B2-A2</code> donne un nombre de jours ; <code>DATEDIF(début;fin;&quot;y&quot;)</code> donne des années entières (ancienneté, âge).</li><li><code>NB.JOURS.OUVRES(début;fin)</code> : jours travaillés entre deux dates.</li><li><code>FIN.MOIS(date;0)</code> : dernier jour du mois.</li></ul>"]],

f:[
["Le tableau croisé dynamique","<ul><li>Il <b>résume</b> des milliers de lignes en quelques secondes, sans formule.</li><li><b>Insertion</b> → Tableau croisé dynamique, à partir d'un tableau propre.</li><li><b>Quatre zones</b> : <b>Lignes</b> (par quoi on regroupe), <b>Colonnes</b>, <b>Valeurs</b> (ce qu'on calcule : somme, nombre, moyenne), <b>Filtres</b>.</li><li>Exemple : île en lignes, mois en colonnes, montant en valeurs.</li><li><b>Actualiser</b> après toute modification des données : il ne se met pas à jour seul.</li><li><b>Double-clic</b> sur un chiffre : le détail des lignes qui le composent.</li><li>Les dates peuvent être <b>groupées</b> par mois, trimestre, année.</li></ul>"],
["Choisir le bon graphique","<ul><li><b>Courbe</b> : une évolution dans le temps.</li><li><b>Barres ou colonnes</b> : comparer des catégories.</li><li><b>Secteurs</b> : les parts d'un tout, avec peu de catégories.</li><li><b>Nuage de points</b> : la relation entre deux nombres.</li><li><b>Un message par graphique</b> : le titre dit ce qu'il faut voir.</li><li>Axe qui commence à <b>zéro</b> pour des barres ; unités indiquées ; pas d'effets 3D.</li><li>Trie les barres par taille : la lecture est immédiate.</li></ul>"],
["Mettre en évidence et contrôler la saisie","<ul><li><b>Mise en forme conditionnelle</b> : colorer automatiquement selon une règle (valeurs sous un seuil, doublons, dates dépassées).</li><li><b>Validation des données</b> : limiter ce qu'on peut saisir : liste déroulante, nombre entre deux bornes, date.</li><li><b>Message d'erreur</b> personnalisé pour guider la personne.</li><li><b>Protéger</b> la feuille : verrouiller les cellules de formules, laisser libres les cellules de saisie.</li><li>Une <b>couleur de fond</b> identique pour toutes les cellules à remplir aide les utilisateurs.</li><li>Mieux vaut empêcher une erreur de saisie que la chercher ensuite.</li></ul>"],
["Imprimer et partager","<ul><li><b>Aperçu avant impression</b> toujours.</li><li><b>Zone d'impression</b> : ce qui sera imprimé. <b>Mise à l'échelle</b> : ajuster à une page en largeur.</li><li><b>Titres répétés</b> sur chaque page ; numéro de page en pied.</li><li><b>Orientation</b> paysage pour les tableaux larges.</li><li><b>PDF</b> pour envoyer un document qui ne doit pas être modifié.</li><li>Avant de partager : retirer les feuilles de brouillon, vérifier les données personnelles, donner un nom clair au fichier.</li><li>Garde l'<b>original</b> : on partage une copie.</li></ul>"]],

function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;

function simu(done,back){const st=Object.assign({},SIMCFG.st),fl={},log=[],D=dif(),mult=D===2?1.5:D===1?1.25:1,tmax=D===2?40:D===1?75:0;let i=0;

  bindBack(back);document.getElementById("go").onclick=next;
  function next(){halt();while(i<EV.length&&EV[i].when&&!EV[i].when(fl))i++;if(i>=EV.length)return bilan();const E=EV[i],o=shuf(E.o.map((x,k)=>[x,k]));window.scrollTo(0,0);
    app.innerHTML=hdr(E.j)+`<div class="card">${bars()}</div><div class="card"><h2 style="margin-top:0">${E.t}</h2><p>${E.s}</p>${tmax?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0][0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const opt=j<0?["Aucune décision prise à temps.",SIMCFG.none,[],"Ne pas décider est une décision : la situation s'est dégradée sans toi."]:o[j][0];
      Object.entries(opt[1]).forEach(([k,v])=>st[k]=clamp(st[k]+(v<0?v*mult:v)));opt[2].forEach(f=>fl[f]=1);
      const best=Math.max(...E.o.map(x=>Object.values(x[1]).reduce((s,v)=>s+v,0)));const mine=Object.values(opt[1]).reduce((s,v)=>s+v,0);

function profil(){const done=Object.keys(S.s).length,{r}=rank();
  app.innerHTML=`<h1>Profil</h1><div class="card"><b>${r[1]}</b> · ${S.xp} points · ${done} étapes validées · ${S.days.length} jours d'entraînement<p style="margin:10px 0 4px"><b>Niveau de difficulté</b></p><div class="row" id="dfx">${DIFF.map((d,i)=>`<button class="btn ${dif()===i?"":"sec"}" data-d="${i}" style="margin:0;padding:10px 4px">${d}</button>`).join("")}</div><p class="mut" style="font-size:13px">Difficile : chrono sur les quiz (45 s) et les ateliers, corrections de simulation à la fin. Expert : 25 s par question, indicateurs masqués, chrono sur chaque décision, pénalités renforcées.</p><label class="ck" style="border:0;margin-top:8px"><input type="checkbox" id="fr" ${S.free?"checked":""}><span>Mode libre : débloquer toutes les séances</span></label></div>
  <div class="card"><h3>Application</h3><p class="mut">Version ${APP_V}${standalone()?" · installée":""}</p><button class="btn" id="pinst">📲 Installer sur le téléphone</button><button class="btn sec" id="pupd">🔄 Mettre à jour</button><details style="margin-top:10px"><summary class="mut">Installer sur Android, pas à pas</summary><ol class="mut" style="padding-left:18px"><li>Ouvre l'adresse GitHub Pages du jeu dans <b>Chrome</b> (pas dans l'appli Claude).</li><li>Touche « Installer sur le téléphone », ou menu ⋮ → « Installer l'application » / « Ajouter à l'écran d'accueil ».</li><li>L'icône Cadre Fenua apparaît : le jeu s'ouvre en plein écran, fonctionne hors connexion et garde ta progression.</li><li>Pour une vraie application Android (.apk), colle l'adresse GitHub Pages sur pwabuilder.com, choisis « Android » et télécharge le paquet.</li></ol></details></div>
  <div class="card warn"><h3>Et après ?</h3><ul class="mut" style="padding-left:18px;margin:6px 0"><li>Refais chaque atelier dans un vrai classeur.</li><li>Construis un fichier utile : budget, planning, suivi de stock.</li><li>Apprends un raccourci par jour.</li><li>Quand le fichier devient trop gros ou trop partagé, passe à une base de données.</li></ul></div>
  <div class="card"><h3>Sauvegarde</h3><p class="mut">Ta progression reste dans ce navigateur. Pour changer d'appareil, copie ce code et colle-le sur l'autre.</p><textarea id="ex" style="min-height:70px" readonly></textarea><button class="btn sec" id="cp">Copier mon code</button><textarea id="im" style="min-height:70px;margin-top:10px" placeholder="Colle ici un code de sauvegarde…"></textarea><button class="btn sec" id="imb">Restaurer</button><p id="msg" class="mut"></p></div>
  <div class="card"><h3>Pour aller plus loin</h3><ul class="mut" style="padding-left:18px;margin:6px 0"><li>Aide en ligne de Microsoft Excel</li><li>Formations bureautiques de la CCISM et du SEFI</li><li>Exercices : refais tes propres tableaux de travail</li></ul></div>
  <div class="card"><button class="btn sec" id="rs" style="border-color:var(--ko);color:var(--ko);margin:0">Tout remettre à zéro</button><div id="rc"></div></div>`;
  const enc=()=>{try{return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){return""}};
  document.getElementById("ex").value=enc();const msg=t=>document.getElementById("msg").textContent=t;
  document.getElementById("fr").onchange=e=>{S.free=e.target.checked;save()};document.querySelectorAll("#dfx button").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;save();go("profil")});document.getElementById("pinst").onclick=installApp;document.getElementById("pupd").onclick=updateApp;
  document.getElementById("cp").onclick=()=>{const t=document.getElementById("ex");t.select();try{navigator.clipboard.writeText(t.value).then(()=>msg("Code copié."),()=>msg("Sélectionne le code et copie-le à la main."))}catch(e){msg("Sélectionne le code et copie-le à la main.")}};
  document.getElementById("imb").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("im").value.trim()))));if(typeof o.xp!=="number")throw 0;S=Object.assign({s:{},xp:0,w:[],days:[],free:false,txt:{},ex:[]},o);save();msg("Progression restaurée.");go("profil")}catch(e){msg("Code invalide.")}};
  document.getElementById("rs").onclick=()=>{document.getElementById("rc").innerHTML=`<p class="mut">Toute la progression sera effacée.</p><button class="btn" id="rsy">Oui, effacer</button>`;document.getElementById("rsy").onclick=()=>{S={s:{},xp:0,w:[],days:[],free:false,txt:{},ex:[]};save();go("home")}}}

/* ===================== ÉCRAN D'ENTRÉE : CHOIX DE LA VOIE ===================== */
(function(){
"use strict";
const V="2026.11.14",app=document.getElementById("app");
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const js=k=>{try{return JSON.parse(ls(k)||"null")}catch(e){return null}};
function toast(t){let d=document.getElementById("tst");if(!d){d=document.createElement("div");d.id="tst";d.style.cssText="position:fixed;left:12px;right:12px;bottom:24px;background:#14323a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14.5px;z-index:9";document.body.appendChild(d)}d.textContent=t;d.style.display="block";clearTimeout(d._t);d._t=setTimeout(()=>d.style.display="none",4200)}
let INST=null,SWR=null;
const inApk=/CadreFenuaApp/.test(navigator.userAgent);
const standalone=()=>{try{return inApk||matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
const hosted=location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.host);
try{window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();INST=e})}catch(e){}
try{if("serviceWorker" in navigator&&hosted)navigator.serviceWorker.register("sw.js").then(r=>{SWR=r}).catch(()=>{})}catch(e){}
function installApp(){if(INST){INST.prompt();INST.userChoice.finally(()=>{INST=null});return}
  if(standalone())return toast("L'application est déjà installée.");
  toast(/iphone|ipad/i.test(navigator.userAgent)?"Sur iPhone : ouvre l'adresse dans Safari, touche Partager puis « Sur l'écran d'accueil ».":"Ouvre l'adresse GitHub Pages dans Chrome, puis menu ⋮ → « Installer l'application ». Ou télécharge l'APK.")}
function updateApp(){if(!hosted)return toast("La mise à jour fonctionne dans la version en ligne (GitHub Pages) et dans l'APK.");
  const bar=document.getElementById("upbar"),fill=bar&&bar.firstChild;if(bar)bar.style.display="block";let p=5;const tk=setInterval(()=>{p=Math.min(90,p+9);if(fill)fill.style.width=p+"%"},180);
  const reload=()=>{const go=()=>{clearInterval(tk);if(fill)fill.style.width="100%";setTimeout(()=>location.reload(),250)};try{caches.keys().then(k=>Promise.all(k.map(c=>caches.delete(c)))).then(go,go)}catch(e){go()}};
  if(!SWR)return reload();
  SWR.update().then(()=>{if(SWR.waiting){navigator.serviceWorker.addEventListener("controllerchange",()=>location.reload());SWR.waiting.postMessage("skip")}else reload()}).catch(reload)}
function apkUrl(){const m=location.hostname.match(/^([^.]+)\.github\.io$/),r=location.pathname.split("/").filter(Boolean)[0];return m&&r?`https://github.com/${m[1]}/${r}/releases/latest/download/cadre-fenua.apk`:null}
function start(t){try{localStorage.setItem("cf-voie",t.id)}catch(e){}
  const c=t.col,st=document.createElement("style");
  st.textContent=`:root{--lag:${c[0]};--lag2:${c[1]}}.btn.wh{color:${c[0]}}@media(prefers-color-scheme:dark){:root{--lag:${c[2]};--lag2:${c[3]}}.hero{background:${c[0]}}}`;document.head.appendChild(st);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",c[0]);
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
  document.addEventListener("click",e=>{if(e.target&&e.target.closest&&e.target.closest("#chg")){try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}location.reload()}});
  const tst=document.getElementById("tst");if(tst)tst.remove();
  app.innerHTML="";window.scrollTo(0,0);t.run()}
function hub(){const last=ls("cf-voie"),lt=TRACKS.find(t=>t.id===last),apk=apkUrl();
  app.innerHTML=`<div class="band"></div><h1>Cadre Fenua</h1><p class="mut">Formations santé et gestion au fenua · choisis ta voie</p>`+
  (lt?`<div class="card hero"><small>Reprendre</small><h2 style="margin:4px 0 0;color:#fff">${lt.ic} ${lt.name}</h2><button class="btn wh" id="resume" style="color:${lt.col[0]}">Continuer</button></div>`:"")+
  `<h2>Les voies</h2>`+TRACKS.map(t=>{const S=js(t.key),n=S&&S.s?Object.keys(S.s).length:0,xp=S&&S.xp||0;
    return `<button class="step voie" data-t="${t.id}"><span class="ic" style="background:${t.col[1]};color:${t.col[0]}">${t.ic}</span><span style="flex:1"><b>${t.name}</b><br><small>${t.sub}</small><br><small style="color:${n?"var(--ok)":"var(--mut)"}">${n?n+" étapes validées · "+xp+" points":"Pas encore commencé"}</small></span><span aria-hidden="true">›</span></button>`}).join("")+
  `<div class="card" id="appcard"><h3>Application</h3><p class="mut" id="ver">Version ${V}${standalone()?" · installée":""}</p><div id="upbar" style="display:none;height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px 0"><i style="display:block;height:100%;width:5%;background:var(--ok);transition:width .2s"></i></div>
   <button class="btn" id="upd">🔄 Mettre à jour</button>${inApk?"":`<button class="btn sec" id="ins">📲 Installer sur le téléphone</button>`}${apk&&!inApk?`<a class="btn sec" id="apk" href="${apk}" style="text-decoration:none">⬇️ Télécharger l'APK Android</a>`:""}
   <p class="mut" style="margin-top:10px">Ta progression est enregistrée sur cet appareil, séparément pour chaque voie.</p></div>
  <div class="card warn"><h3>À savoir</h3><p class="mut">Outil d'entraînement : il ne délivre aucun diplôme. Pour les soins, la formation pratique et les protocoles de ton service font foi ; pour le droit, les textes officiels.</p></div>`;
  document.getElementById("nav").innerHTML="";
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>start(TRACKS.find(t=>t.id===b.dataset.t)));
  const r=document.getElementById("resume");if(r)r.onclick=()=>start(lt);
  document.getElementById("upd").onclick=updateApp;const i=document.getElementById("ins");if(i)i.onclick=installApp;
  if(hosted)try{fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(x=>x.json()).then(j=>{if(j&&j.v&&j.v!==V){document.getElementById("ver").innerHTML=`Version ${V} · <b style="color:var(--cor)">nouvelle version ${j.v} disponible</b>`;document.getElementById("appcard").style.borderColor="var(--cor)"}}).catch(()=>{})}catch(e){}}
hub();
})();

</script>
