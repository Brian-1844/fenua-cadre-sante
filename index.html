/* ---------- 3. Droit ---------- */
{f:[
["Les quatre responsabilités","<ul><li><b>Administrative (ou civile)</b> : réparer un dommage. À l'hôpital public, pour une <b>faute de service</b>, c'est l'établissement qui indemnise, devant le juge administratif.</li><li><b>Pénale</b> : sanctionner une infraction. Elle est <b>personnelle</b> : blessures ou homicide involontaires, mise en danger d'autrui, non-assistance à personne en danger, violation du secret.</li><li><b>Disciplinaire</b> : sanction par l'employeur pour manquement aux obligations professionnelles.</li><li><b>Ordinale</b> : pour les professions dotées d'un ordre, devant ses instances.</li><li>Une même faute peut engager plusieurs responsabilités à la fois.</li><li>Pour le cadre : une <b>faute d'organisation</b> (effectif insuffisant non signalé, matériel défaillant connu) peut engager la responsabilité de l'établissement, et parfois la sienne.</li><li><b>Glissement de tâches</b> : faire réaliser un acte par un professionnel qui n'en a pas la compétence légale est interdit, même « pour dépanner ».</li><li>Ce qui protège : signaler par écrit, tracer, respecter les compétences de chacun.</li></ul>"],
["Secret professionnel et partage d'informations","<ul><li>La violation du secret est un délit (article <b>226-13 du code pénal</b>, applicable au fenua).</li><li>Il couvre tout ce qui est appris, vu, entendu, compris dans l'exercice.</li><li><b>Secret partagé</b> : les membres de l'équipe de soins échangent ce qui est <b>nécessaire</b> à la prise en charge, pas davantage.</li><li><b>Famille</b> : on n'informe qu'avec l'accord du patient, sauf exceptions prévues par les textes. La personne de confiance a un rôle particulier.</li><li><b>Téléphone</b> : aucune information médicale à un interlocuteur non identifié.</li><li><b>Réseaux sociaux, photos</b> : interdits dès qu'un patient peut être reconnu, même indirectement.</li><li><b>Exceptions</b> prévues par la loi : signalement de maltraitance d'un mineur ou d'une personne vulnérable, déclarations obligatoires, certificats.</li><li>Le cadre garantit l'organisation : écrans verrouillés, dossiers rangés, transmissions hors des couloirs.</li></ul>"],
["Contester une décision : recours et délais","<ul><li><b>Recours administratif</b> : <b>gracieux</b> (auprès de l'auteur de la décision) ou <b>hiérarchique</b> (auprès de son supérieur).</li><li><b>Recours contentieux</b> : devant le <b>tribunal administratif de la Polynésie française</b>, en règle générale dans un délai de <b>2 mois</b> à compter de la notification.</li><li>Le délai ne court que si la décision mentionne les <b>voies et délais de recours</b>.</li><li>Un recours administratif formé dans le délai le prolonge.</li><li><b>Référé</b> : procédure d'urgence pour suspendre une décision.</li><li>Appel des jugements du tribunal administratif : la <b>cour administrative d'appel de Paris</b>. Contrôle des lois du pays : le <b>Conseil d'État</b>.</li><li>Pour le cadre : une décision bien <b>motivée</b>, fondée sur des faits et notifiée régulièrement résiste au recours. Un rapport factuel est la meilleure protection de tous.</li></ul>"]],
q:[
["Pour une faute de service à l'hôpital public, qui indemnise la victime ?",["L'établissement","Le soignant personnellement","Le cadre","La famille"],"Devant le juge administratif."],
["La responsabilité pénale est…",["personnelle","collective","toujours celle de l'établissement","réservée aux médecins"],"On ne peut pas être condamné pénalement à la place d'un autre."],
["Une même faute peut-elle engager plusieurs responsabilités ?",["Oui : pénale, disciplinaire et administrative à la fois","Non, une seule","Seulement si le patient décède","Seulement pour les médecins"],"Les procédures sont indépendantes."],
["Un effectif insuffisant connu et non signalé peut constituer…",["une faute d'organisation","un simple aléa","une faute du patient","rien de juridique"],"D'où l'importance du signalement écrit."],
["Le glissement de tâches, c'est…",["faire réaliser un acte par quelqu'un qui n'en a pas la compétence légale","déléguer une tâche autorisée","changer d'horaire","faire une formation"],"Interdit, même pour dépanner."],
["Quel article du code pénal réprime la violation du secret professionnel ?",["226-13","40","121-3","L. 4311-1"],"Applicable en Polynésie française."],
["Le secret partagé permet d'échanger…",["ce qui est nécessaire à la prise en charge, au sein de l'équipe de soins","tout le dossier à tous les agents","les informations avec les voisins","les informations avec l'employeur du patient"],"Nécessaire et pas davantage."],
["Un appel : « Je suis son cousin, comment va-t-il ? » Vous…",["ne donnez aucune information médicale sans accord du patient","donnez le diagnostic","donnez le numéro de chambre et le diagnostic","raccrochez sans rien dire"],"On peut proposer de transmettre le message au patient."],
["Une photo de l'équipe où un patient est reconnaissable, publiée sur Facebook :",["une violation du secret et de l'image du patient","une bonne communication","autorisée si le visage est flou","autorisée si l'équipe est d'accord"],"Même une identification indirecte suffit."],
["Le secret peut être levé par la loi notamment pour…",["signaler une maltraitance sur mineur ou personne vulnérable","répondre à un journaliste","informer l'employeur du patient","satisfaire la curiosité d'un collègue"],"Exceptions limitées et prévues par les textes."],
["Le recours gracieux s'adresse…",["à l'auteur de la décision","au supérieur de l'auteur","au tribunal","au syndicat"],"Le recours hiérarchique va au supérieur."],
["Délai de recours contentieux en règle générale :",["2 mois","15 jours","1 an","5 ans"],"À compter de la notification."],
["Le délai de recours ne court que si la décision mentionne…",["les voies et délais de recours","le nom du cadre","l'heure de signature","le numéro de téléphone"],"Sinon, le délai ne peut être opposé."],
["Quelle juridiction juge en appel les décisions du tribunal administratif de la Polynésie française ?",["La cour administrative d'appel de Paris","La cour d'appel de Papeete","Le Conseil constitutionnel","La Cour de cassation"],"Le Conseil d'État contrôle les lois du pays."],
["Le référé sert à…",["obtenir une décision rapide en cas d'urgence","faire appel","sanctionner un agent","annuler un concours après 5 ans"],"Par exemple suspendre une décision."]]},

/* ---------- 4. Manager ---------- */
{f:[
["Animer une réunion d'équipe","<ul><li><b>Avant</b> : un objectif clair, un ordre du jour envoyé à l'avance, une durée fixée, un horaire compatible avec les soins (souvent au chevauchement des équipes).</li><li><b>Pendant</b> : rappeler l'objectif, distribuer la parole, recadrer les digressions, faire respecter le temps, reformuler les décisions.</li><li>Distinguer : réunion d'<b>information</b> (descendante), de <b>consultation</b> (on recueille les avis), de <b>décision</b> (on tranche ensemble), de <b>résolution de problème</b>.</li><li>Rôles possibles : animateur, secrétaire, gardien du temps.</li><li><b>Après</b> : compte rendu court sous 48 h (décisions, qui fait quoi, échéance), affiché ou envoyé à ceux qui étaient absents, en particulier l'équipe de nuit.</li><li>Une réunion sans décision ni suite démotive. Une réunion courte et utile se respecte.</li></ul>"],
["Les entretiens du cadre","<ul><li><b>Recrutement</b> : fiche de poste en main, questions identiques pour tous les candidats, exemples concrets demandés.</li><li><b>Accueil</b> : le premier jour, par le cadre lui-même.</li><li><b>Annuel</b> : bilan, objectifs, formation, projet.</li><li><b>Recadrage</b> : rapide après les faits, en privé, factuel (méthode DESC), avec un engagement et un suivi.</li><li><b>Retour d'absence</b> : accueil et information, pas un interrogatoire.</li><li><b>Fin de stage ou de période d'essai</b> : bilan argumenté, objectifs atteints ou non.</li><li>Structure commune : <b>préparer</b> (faits, documents, objectif), <b>accueillir</b> (lieu calme, temps protégé), annoncer l'<b>objet</b>, <b>écouter</b>, <b>conclure</b> (ce qu'on retient, ce qui suit), <b>tracer</b>.</li><li>Un témoin ou un tiers peut être proposé dans un entretien difficile.</li></ul>"],
["Feedback et communication non violente","<ul><li><b>Feedback positif</b> : précis, sincère, rapide. « Ta transmission sur le patient de la 12 a permis d'éviter une erreur » vaut mieux que « Bon travail ».</li><li><b>Feedback correctif</b> : sur un comportement observable, jamais sur la personne. Il se fait en privé et propose une piste.</li><li><b>Communication non violente</b> (Marshall Rosenberg), méthode <b>OSBD</b> : <b>O</b>bservation des faits sans jugement, <b>S</b>entiment, <b>B</b>esoin, <b>D</b>emande concrète et réalisable.</li><li>Exemple : « Trois fois cette semaine, la relève a commencé à 7 h 15 (O). Je suis inquiet (S) car j'ai besoin que l'équipe de nuit puisse partir à l'heure et que les informations passent (B). Peux-tu arriver à 6 h 55 à partir de demain ? (D) »</li><li>Écouter les émotions sans s'y noyer ; distinguer le fait de l'interprétation.</li><li>Le « sandwich » (positif, négatif, positif) brouille souvent le message : mieux vaut être clair et respectueux.</li></ul>"]],
q:[
["Premier élément de préparation d'une réunion :",["un objectif clair","le café","la liste des absents","un diaporama"],"Puis ordre du jour, durée, horaire."],
["Le meilleur moment pour une réunion d'équipe soignante est souvent…",["au chevauchement des équipes","en pleine distribution des repas","à 3 heures du matin","pendant les visites"],"Pour toucher le plus de monde sans gêner les soins."],
["Une réunion de consultation sert à…",["recueillir les avis avant une décision","annoncer une décision déjà prise","sanctionner","faire un cours"],"La réunion d'information est descendante."],
["Le compte rendu de réunion doit contenir…",["les décisions, les responsables et les échéances","toutes les paroles de chacun","seulement la date","les noms des retardataires"],"Court et utile."],
["À qui faut-il absolument transmettre le compte rendu ?",["aux absents, notamment l'équipe de nuit","à la presse","aux patients","à personne"],"Sinon, deux équipes, deux vérités."],
["En entretien de recrutement, une bonne pratique :",["poser les mêmes questions à tous les candidats","improviser selon la sympathie","parler surtout de soi","éviter la fiche de poste"],"Équité et comparaison possible."],
["L'entretien de retour après absence n'est pas…",["un interrogatoire sur la santé de l'agent","un accueil","une information sur les changements","un moment d'écoute"],"Le diagnostic reste secret."],
["Dernière étape de tout entretien :",["tracer ce qui a été dit et décidé","oublier","en parler à l'équipe","envoyer un SMS"],"La trace protège l'agent et le cadre."],
["Dans un entretien difficile, le cadre peut…",["proposer la présence d'un tiers","enregistrer à l'insu de l'agent","faire venir toute l'équipe","refuser d'écouter"],"Par exemple le cadre supérieur."],
["Un feedback positif efficace est…",["précis, sincère et rapide","général et rare","public et ironique","réservé à l'entretien annuel"],"Il dit exactement ce qui a été bien fait."],
["Un feedback correctif porte sur…",["un comportement observable","la personnalité de l'agent","sa vie privée","son origine"],"Jamais sur la personne."],
["Qui a créé la communication non violente ?",["Marshall Rosenberg","Abraham Maslow","Kurt Lewin","Henry Mintzberg"],"Méthode OSBD."],
["OSBD signifie…",["Observation, Sentiment, Besoin, Demande","Objectif, Stratégie, Budget, Délai","Organisation, Sécurité, Bilan, Décision","Ordre, Sanction, Blâme, Dialogue"],"Quatre étapes."],
["« Tu es toujours en retard » est…",["un jugement, pas une observation","une observation neutre","une demande","un besoin"],"L'observation serait : « trois retards cette semaine »."],
["La méthode du « sandwich » a pour risque…",["de brouiller le message principal","d'être trop claire","d'humilier","d'être illégale"],"Le message négatif se perd entre deux compliments."]]},

/* ---------- 5. Organisation ---------- */
{f:[
["Calculer les indicateurs de l'unité","<ul><li><b>Taux d'occupation</b> = journées réalisées ÷ journées possibles (lits × jours) × 100. Exemple : 30 lits en novembre (30 jours), 810 journées réalisées : 810 ÷ 900 = <b>90 %</b>.</li><li><b>Durée moyenne de séjour (DMS)</b> = journées réalisées ÷ nombre de séjours. Exemple : 810 ÷ 135 séjours = <b>6 jours</b>.</li><li><b>Taux d'absentéisme</b> = heures d'absence ÷ heures théoriques × 100. Exemple : 20 agents × 169 h par mois (39 h × 52 ÷ 12) = 3 380 h ; 270 h d'absence : 270 ÷ 3 380 ≈ <b>8 %</b>.</li><li><b>ETP</b> (équivalent temps plein) : un agent à 80 % compte pour 0,8 ETP.</li><li>Un poste tenu 24 h/24 toute l'année demande <b>plusieurs ETP</b> (souvent 5 à 6 selon le temps de travail annuel, les congés et l'absentéisme).</li><li>Comparer un indicateur à lui-même dans le temps, puis à des unités semblables ; chercher la cause avant d'agir.</li></ul>"],
["Organiser le travail des soignants","<ul><li><b>Soins en série</b> (par tâches) : une personne fait les pansements, une autre les toilettes. Rapide en apparence, mais fragmente la prise en charge et dilue la responsabilité.</li><li><b>Sectorisation</b> (soins intégrés) : un binôme infirmier–aide-soignant prend en charge un groupe de patients du début à la fin du poste. Meilleure connaissance du patient, responsabilité claire.</li><li><b>Postes de 12 h</b> : moins de relèves et plus de jours de repos ; mais fatigue, risque d'erreur en fin de poste, difficultés pour les agents avec des enfants.</li><li><b>Postes de 7 h 30 à 8 h</b> : plus de relèves, moins de fatigue par poste.</li><li><b>Roulement</b> fixe (cycle connu à l'avance) ou variable : la prévisibilité est un facteur majeur de satisfaction.</li><li>Tout changement d'organisation du travail se prépare avec l'équipe et passe par les instances compétentes (comité technique).</li></ul>"],
["Stress et risques psychosociaux : les modèles","<ul><li><b>Karasek</b> : trois dimensions : <b>demande psychologique</b>, <b>latitude décisionnelle</b>, <b>soutien social</b>. La situation la plus à risque (« job strain ») : forte demande et faible latitude ; l'isolement aggrave encore.</li><li><b>Siegrist</b> : déséquilibre entre <b>efforts</b> fournis et <b>récompenses</b> reçues (salaire, estime, perspectives).</li><li><b>Burn-out</b> : épuisement émotionnel, dépersonnalisation (distance, cynisme), perte d'accomplissement (Maslach).</li><li>Prévention <b>primaire</b> : agir sur les causes (organisation, charge, effectifs). <b>Secondaire</b> : aider les agents à faire face (formation, groupes de parole). <b>Tertiaire</b> : prendre en charge ceux qui vont mal (médecine du travail, psychologue, reprise accompagnée).</li><li>Leviers du cadre : donner de la marge de manœuvre, être disponible, reconnaître, réguler la charge, signaler quand les moyens manquent.</li></ul>"]],
q:[
["30 lits, 30 jours, 810 journées réalisées. Taux d'occupation ?",["90 %","81 %","100 %","27 %"],"810 ÷ (30 × 30) = 0,9."],
["810 journées pour 135 séjours. DMS ?",["6 jours","5 jours","8 jours","13,5 jours"],"810 ÷ 135 = 6."],
["Heures mensuelles d'un agent à 39 h par semaine :",["169 h","151,67 h","156 h","180 h"],"39 × 52 ÷ 12 = 169."],
["3 380 heures théoriques, 270 heures d'absence. Taux d'absentéisme ?",["environ 8 %","environ 3 %","environ 12 %","environ 27 %"],"270 ÷ 3 380 ≈ 0,08."],
["Un agent à 80 % représente…",["0,8 ETP","1 ETP","0,5 ETP","8 ETP"],"Équivalent temps plein."],
["Un poste tenu 24 h/24 toute l'année demande…",["plusieurs ETP, souvent 5 à 6","1 ETP","2 ETP","20 ETP"],"Congés, repos et absences compris."],
["La sectorisation consiste à…",["confier un groupe de patients à un binôme pour tout le poste","faire tous les pansements à la suite","changer de service chaque jour","supprimer les relèves"],"On parle aussi de soins intégrés."],
["Principal risque des soins en série :",["une prise en charge fragmentée et une responsabilité diluée","trop de temps auprès du patient","trop de relèves","un coût trop élevé"],"Personne n'a la vue d'ensemble du patient."],
["Avantage des postes de 12 h :",["moins de relèves et plus de jours de repos","moins de fatigue","aucun risque d'erreur","plus de réunions"],"Avec un risque de fatigue en fin de poste."],
["Un changement d'organisation du travail passe par…",["l'équipe et les instances compétentes","la seule décision du cadre","un vote des patients","rien de particulier"],"Le comité technique est consulté."],
["Les trois dimensions du modèle de Karasek :",["demande psychologique, latitude décisionnelle, soutien social","salaire, statut, sécurité","efforts, récompenses, estime","dégel, changement, regel"],"Le modèle de Siegrist parle d'efforts et de récompenses."],
["La situation la plus à risque selon Karasek :",["forte demande et faible latitude","faible demande et forte latitude","forte demande et forte latitude","faible demande et faible latitude"],"Le « job strain »."],
["Le modèle de Siegrist décrit un déséquilibre entre…",["efforts et récompenses","demande et latitude","jour et nuit","théorie et pratique"],"Les récompenses incluent l'estime."],
["La prévention primaire des risques psychosociaux agit sur…",["les causes : organisation, charge, effectifs","les agents déjà malades","la seule formation à la gestion du stress","les sanctions"],"Secondaire : aider à faire face ; tertiaire : réparer."],
["Les trois dimensions du burn-out (Maslach) :",["épuisement émotionnel, dépersonnalisation, perte d'accomplissement","fatigue, faim, soif","colère, peur, tristesse","absence, retard, erreur"],"La dépersonnalisation se manifeste par la distance et le cynisme."]]},

/* ---------- 6. Qualité ---------- */
{f:[
["Hygiène : précautions standard et complémentaires","<ul><li><b>Friction hydroalcoolique</b> : la méthode de référence pour l'hygiène des mains, sur des mains sans bijou, ongles courts, avant-bras dégagés.</li><li><b>5 indications de l'OMS</b> : avant le contact patient ; avant un geste aseptique ; après un risque d'exposition à un liquide biologique ; après le contact patient ; après le contact avec l'environnement du patient.</li><li>Précautions standard : gants si risque de contact avec un liquide biologique, tenue protectrice, masque et lunettes si risque de projection, gestion sûre des déchets et des objets piquants.</li><li><b>Accident d'exposition au sang</b> : ne pas faire saigner, laver à l'eau et au savon, rincer, désinfecter (au moins 5 minutes), puis consulter le <b>médecin référent rapidement</b>, idéalement dans les 4 heures.</li><li>Précautions complémentaires <b>contact</b> (bactéries multirésistantes) ; pour <i>Clostridioides difficile</i>, lavage au savon puis friction, car l'alcool n'agit pas sur les spores.</li><li><b>Gouttelettes</b> (grippe) : masque chirurgical. <b>Air</b> (tuberculose, rougeole) : appareil de protection respiratoire FFP2.</li><li>Le cadre s'appuie sur l'équipe opérationnelle d'hygiène et fait auditer les pratiques.</li></ul>"],
["Le circuit du médicament","<ul><li>Quatre étapes : <b>prescription</b> (écrite, datée, signée, patient identifié) → <b>dispensation</b> (pharmacie : analyse, préparation, délivrance) → <b>administration</b> (infirmier : règle des 5 B, traçabilité en temps réel) → <b>surveillance</b> (effets, efficacité).</li><li>Médicaments <b>à haut risque</b> : anticoagulants, insulines, chlorure de potassium injectable, chimiothérapies, morphiniques. Double vérification recommandée.</li><li><b>Stupéfiants</b> : coffre fermé, accès restreint, registre et traçabilité de chaque mouvement.</li><li>Rangement : armoire organisée, contrôle des <b>péremptions</b>, <b>chaîne du froid</b> surveillée.</li><li><b>Interruptions de tâche</b> pendant la préparation : une cause majeure d'erreurs (chasuble ou zone protégée).</li><li>Toute erreur ou presque-erreur se <b>déclare</b> ; le cadre organise son analyse avec la pharmacie.</li></ul>"],
["Douleur, fin de vie et éthique","<ul><li>Évaluer la douleur, c'est la mesurer : <b>EN</b> (échelle numérique de 0 à 10), <b>EVA</b> (échelle visuelle analogique), <b>EVS</b> (échelle verbale simple) ; <b>Algoplus</b> pour la personne âgée qui ne peut pas communiquer.</li><li>Évaluer, traiter, <b>réévaluer</b>, tracer.</li><li><b>Démarche palliative</b> : soulager, accompagner le patient et ses proches, sans acharnement ni abandon.</li><li><b>Directives anticipées</b> et <b>personne de confiance</b> : recueillir la volonté du patient avant qu'il ne puisse plus l'exprimer.</li><li>En France, la loi Claeys-Leonetti (2016) encadre la fin de vie : refus de l'obstination déraisonnable, procédure <b>collégiale</b>. Vérifie les textes applicables au fenua.</li><li>Quatre principes éthiques (Beauchamp et Childress) : <b>autonomie</b>, <b>bienfaisance</b>, <b>non-malfaisance</b>, <b>justice</b>.</li><li>Le cadre organise des temps de parole et de réflexion éthique pour l'équipe après les situations difficiles.</li></ul>"]],
q:[
["La méthode de référence pour l'hygiène des mains :",["la friction hydroalcoolique","le lavage à l'eau seule","le port de gants permanent","l'essuyage"],"Sauf exceptions comme les spores."],
["Combien d'indications d'hygiène des mains selon l'OMS ?",["5","3","7","10"],"Avant et après le contact patient, avant un geste aseptique, après un risque d'exposition, après contact avec l'environnement."],
["Après un accident d'exposition au sang, il ne faut pas…",["faire saigner la plaie","laver à l'eau et au savon","désinfecter","consulter le médecin référent"],"Faire saigner peut aggraver la lésion."],
["Après un AES, la consultation du médecin référent se fait…",["rapidement, idéalement dans les 4 heures","dans la semaine","au prochain entretien annuel","seulement si le patient est connu infecté"],"Un traitement préventif peut être nécessaire."],
["Pour Clostridioides difficile, on se lave les mains…",["au savon puis friction, car l'alcool n'agit pas sur les spores","avec la seule friction","à l'eau seule","on ne se lave pas"],"Précautions complémentaires contact."],
["La tuberculose pulmonaire relève des précautions…",["air, avec un masque FFP2","gouttelettes, avec un masque chirurgical","contact uniquement","standard uniquement"],"La rougeole aussi."],
["Ordre du circuit du médicament :",["prescription, dispensation, administration, surveillance","administration, prescription, dispensation, surveillance","dispensation, prescription, surveillance, administration","surveillance, administration, prescription, dispensation"],"Chaque étape a ses risques."],
["La dispensation est réalisée par…",["la pharmacie","l'infirmier","le médecin","le cadre"],"Analyse, préparation, délivrance."],
["Exemple de médicament à haut risque :",["le chlorure de potassium injectable","le paracétamol oral à dose usuelle","le sérum physiologique pour rincer","une crème hydratante"],"Avec anticoagulants, insulines, chimiothérapies."],
["Les stupéfiants se conservent…",["dans un coffre fermé, avec registre et traçabilité","dans le chariot","dans le vestiaire","dans la chambre du patient"],"Chaque mouvement est tracé."],
["Une cause majeure d'erreur lors de la préparation des médicaments :",["les interruptions de tâche","la lumière naturelle","le port de la blouse","la lecture de l'ordonnance"],"D'où les zones protégées."],
["L'échelle Algoplus sert à évaluer…",["la douleur chez la personne âgée non communicante","la dépendance","la dénutrition","le risque de chute"],"Observation de 5 items."],

["Quand l'équipe ne tient plus","<p>On a longtemps cru que les soignants partaient pour de meilleurs salaires. Les entretiens de départ racontent autre chose. Ceux qui quittent l'hôpital parlent d'abord de plannings modifiés la veille, de congés refusés sans explication, de nuits faites à deux là où il en faudrait trois. Ils parlent ensuite de ce qu'ils ne peuvent plus faire : s'asseoir cinq minutes auprès d'un patient inquiet, transmettre correctement, former l'étudiant qui les suit.</p><p>Le salaire compte, bien sûr. Mais il ne retient personne dans un service où l'on a le sentiment de mal travailler. À l'inverse, certaines unités gardent leurs équipes malgré une charge comparable. On y trouve presque toujours les mêmes ingrédients : un planning prévisible, un encadrement présent, des décisions expliquées, et la possibilité de dire qu'une organisation ne fonctionne pas sans passer pour un râleur.</p><p>Le cadre de proximité ne fixe ni les effectifs ni les grilles de rémunération. Il serait injuste de lui faire porter la fidélisation à lui seul. Il serait tout aussi faux de dire qu'il n'y peut rien : c'est lui qui rend le travail tenable ou non, jour après jour. Entre ce qu'il doit obtenir de sa hiérarchie et ce qu'il doit à son équipe, sa marge est étroite. C'est pourtant là que se joue une grande part de l'attractivité d'un hôpital.</p>"],
["L'hôpital au bout de l'archipel","<p>Dans un territoire d'îles, l'hôpital de référence n'est jamais seulement un hôpital. Il est le dernier recours de patients venus de très loin, qui ont laissé derrière eux leur famille, leur travail, parfois leur langue. Leur séjour ne commence pas aux urgences et ne s'achève pas à la sortie : il commence dans un dispensaire, se poursuit dans un avion, et se termine des semaines plus tard, quand un infirmier isolé reprend le suivi avec les moyens dont il dispose.</p><p>Cette géographie a un coût. Un lit occupé quelques jours de plus faute de vol retour est un lit qui manque à un autre. Une consigne de sortie mal comprise devient une réhospitalisation. Une maladie chronique mal équilibrée, à mille kilomètres de tout spécialiste, finit en évacuation d'urgence.</p><p>On peut y voir une fatalité. On peut aussi y voir une raison d'organiser les soins autrement : préparer la sortie dès l'entrée, parler au soignant de l'île avant le départ du patient, utiliser la télémédecine pour ce qu'elle sait faire, et considérer chaque hospitalisation comme une occasion d'éducation. Aucune de ces idées n'est nouvelle. Ce qui manque le plus souvent n'est pas la technique, mais quelqu'un qui, dans chaque unité, tienne le fil du parcours.</p>"]];

function simu(done,back){const st={sec:70,eq:60,flux:60,hier:60,leg:100,bud:100},fl={},log=[],D=dif(),mult=D===2?1.5:D===1?1.25:1,tmax=D===2?40:D===1?75:0;let i=0;
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const bars=()=>D===2?`<p class="mut">Mode expert : indicateurs masqués jusqu'au bilan.</p>`:Object.keys(IND).map(k=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="flex:0 0 150px">${IND[k]}</span><div class="bar" style="flex:1;margin:3px 0"><i style="width:${st[k]}%;background:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}"></i></div></div>`).join("");
  app.innerHTML=hdr("Une semaine de cadre")+`<div class="card fiche"><h2 style="margin-top:0">Tu prends l'unité lundi matin</h2><p>Médecine, 28 lits, 8 infirmières, 10 aides-soignantes. Tu vas vivre une semaine. <b>Chaque décision change la suite</b> : certaines situations n'arrivent que parce que tu as choisi quelque chose avant.</p><ul><li>Six indicateurs : ${Object.values(IND).join(", ").toLowerCase()}.</li><li>Niveau : <b>${DIFF[D]}</b>${tmax?` · ${tmax} secondes par décision, sinon la situation décide pour toi`:""}${D>=1?" · explications seulement au bilan":""}.</li><li>Change le niveau dans Profil.</li></ul><button class="btn" id="go">Commencer lundi</button></div>`;
  bindBack(back);document.getElementById("go").onclick=next;
  function next(){halt();while(i<EV.length&&EV[i].when&&!EV[i].when(fl))i++;if(i>=EV.length)return bilan();const E=EV[i],o=shuf(E.o.map((x,k)=>[x,k]));window.scrollTo(0,0);
    app.innerHTML=hdr(E.j)+`<div class="card">${bars()}</div><div class="card"><h2 style="margin-top:0">${E.t}</h2><p>${E.s}</p>${tmax?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0][0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const opt=j<0?["Aucune décision prise à temps.",{sec:-10,hier:-10,eq:-5},[],"Ne pas décider est une décision : la situation s'est dégradée sans toi."]:o[j][0];
      Object.entries(opt[1]).forEach(([k,v])=>st[k]=clamp(st[k]+(v<0?v*mult:v)));opt[2].forEach(f=>fl[f]=1);
      const best=Math.max(...E.o.map(x=>Object.values(x[1]).reduce((s,v)=>s+v,0)));const mine=Object.values(opt[1]).reduce((s,v)=>s+v,0);
      log.push({j:E.j,t:E.t,c:opt[0],fb:opt[3],ok:mine>=best});i++;
      if(D===0){app.querySelectorAll(".opt").forEach(b=>b.disabled=true);if(j>=0)app.querySelectorAll(".opt")[j].classList.add(mine>=best?"good":"bad");document.getElementById("fb").innerHTML=`<div class="fb">${opt[3]}</div><button class="btn" id="nx">Continuer</button>`;document.getElementById("nx").onclick=next}else next()};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));
    if(tmax)count(tmax,document.getElementById("tmr"),()=>pick(-1))}
  function bilan(){window.scrollTo(0,0);const w={sec:3,leg:2,eq:2,hier:1.5,flux:1.5,bud:1},tot=Object.keys(w).reduce((s,k)=>s+st[k]*w[k],0)/Object.values(w).reduce((s,v)=>s+v,0);
    let sc=Math.round(tot);if(st.sec<40||st.leg<50)sc=Math.min(sc,45);
    const nb=log.filter(x=>x.ok).length,grade=sc>=85?"Cadre confirmé":sc>=70?"Cadre solide":sc>=55?"Cadre en construction":"Unité en difficulté";
    const chains=[];if(fl.teva||fl.nuit)chains.push("Ta décision de lundi 5 h 40 (fatigue d'une infirmière) a provoqué l'erreur d'insuline de mardi.");if(fl.lits2)chains.push("Les deux lits acceptés sans conditions lundi ont conduit à la chute de mercredi.");if(fl.juillet)chains.push("Les quatre congés accordés lundi ont créé le trou de juillet relevé vendredi.");if(fl.flou)chains.push("La décision repoussée sur les congés a fini en arrêt et en conflit.");if(fl.greveKO||fl.abus)chains.push("La gestion du préavis de mardi a déterminé ta journée de grève.");if(fl.epuise||fl.surcharge)chains.push("Les dépannages répétés ont mené à l'épuisement d'une infirmière vendredi.");if(fl.cache)chains.push("Un événement non déclaré : en réalité, cela engage ta responsabilité.");
    app.innerHTML=hdr("Bilan de la semaine")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2><p><b>${grade}</b> · ${nb} meilleures décisions sur ${log.length}</p></div><div class="card">${Object.keys(IND).map(k=>`<p style="display:flex;justify-content:space-between;margin:4px 0"><span>${IND[k]}</span><b style="color:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}">${st[k]}</b></p>`).join("")}</div>${chains.length?`<div class="card warn"><h3>L'effet domino</h3><ul class="mut" style="padding-left:18px">${chains.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}<h2>Tes décisions</h2>${log.map(x=>`<details class="card"><summary>${x.ok?"✓":"✗"} <b>${x.j}</b> · ${x.t}</summary><p><b>Ton choix :</b> ${x.c}</p><div class="fb">${x.fb}</div></details>`).join("")}<button class="btn" id="ok">Terminer</button>`;

function dilem(done,back){let i=0,pts=0;const items=shuf(DIL).slice(0,dif()>=1?10:6),hard=dif()>=1;const recap=[];
  (function show(){const C=items[i],o=shuf(C.o);window.scrollTo(0,0);
    app.innerHTML=hdr(`Dilemme ${i+1}/${items.length}`)+`<div class="card"><h2 style="margin-top:0">${C.t}</h2><p>${C.s}</p>${dif()>=2?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const x=j<0?["(pas de décision)",0,"La situation évolue sans toi.","Le problème s'aggrave."]:o[j];pts+=x[1];recap.push([C.t,x]);
      if(hard){i++;return i<items.length?show():fin()}
      app.querySelectorAll(".opt").forEach((b,m)=>{b.disabled=true;{const c=o[m][1]===2?"good":o[m][1]===0?"bad":"";if(c)b.classList.add(c)}});
      document.getElementById("fb").innerHTML=`<div class="fb"><b>À court terme :</b> ${x[2]}<br><b>À long terme :</b> ${x[3]}</div>${x[1]<2?`<div class="fb" style="border-color:var(--ok)"><b>Meilleure option :</b> ${C.o.find(y=>y[1]===2)[0]}</div>`:""}<button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<items.length?show():fin()}};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));if(dif()>=2)count(45,document.getElementById("tmr"),()=>pick(-1))})();
  function fin(){const sc=Math.round(pts/(items.length*2)*100);if(!hard)return done(sc);window.scrollTo(0,0);
    app.innerHTML=hdr("Bilan des dilemmes")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2></div>`+recap.map(([t,x])=>`<details class="card"><summary>${x[1]===2?"✓":x[1]===1?"≈":"✗"} <b>${t}</b></summary><p><b>Ton choix :</b> ${x[0]}</p><div class="fb"><b>Court terme :</b> ${x[2]}<br><b>Long terme :</b> ${x[3]}</div></details>`).join("")+`<button class="btn" id="ok">Terminer</button>`;
    bindBack(back);document.getElementById("ok").onclick=()=>done(sc)}}

  document.getElementById("ex").value=enc();const msg=t=>document.getElementById("msg").textContent=t;
  document.getElementById("fr").onchange=e=>{S.free=e.target.checked;save()};document.querySelectorAll("#dfx button").forEach(b=>b.onclick=()=>{S.diff=+b.dataset.d;save();go("profil")});document.getElementById("pinst").onclick=installApp;document.getElementById("pupd").onclick=updateApp;
  document.getElementById("cp").onclick=()=>{const t=document.getElementById("ex");t.select();try{navigator.clipboard.writeText(t.value).then(()=>msg("Code copié."),()=>msg("Sélectionne le code et copie-le à la main."))}catch(e){msg("Sélectionne le code et copie-le à la main.")}};
  document.getElementById("imb").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById("im").value.trim()))));if(typeof o.xp!=="number")throw 0;S=Object.assign({s:{},xp:0,w:[],days:[],free:false,txt:{},ex:[]},o);save();msg("Progression restaurée.");go("profil")}catch(e){msg("Code invalide.")}};
  document.getElementById("rs").onclick=()=>{document.getElementById("rc").innerHTML=`<p class="mut">Toute la progression sera effacée.</p><button class="btn" id="rsy">Oui, effacer</button>`;document.getElementById("rsy").onclick=()=>{S={s:{},xp:0,w:[],days:[],free:false,txt:{},ex:[]};save();go("home")}}}

load();
const h0=(location.hash||"").slice(1);go(["home","parcours","fiches","conseil","profil","exam"].includes(h0)?h0:"home");
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["home","parcours","fiches","conseil","profil","exam"].includes(h)&&!document.querySelector(`nav button.on[data-v="${h}"]`))go(h)});
</script>
