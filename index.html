const GRILLE=["Introduction : contexte + problématique posée clairement","Plan annoncé et réellement suivi (2 ou 3 parties)","Au moins 3 notions du niveau mobilisées et expliquées","Positionnement de cadre explicite (« je ferais… parce que… »)","Lien concret avec le contexte polynésien","Conclusion qui répond à la problématique et ouvre","Relecture : orthographe, phrases courtes, lisibilité"];

/* ===================== CONTENU : 8 NIVEAUX =====================

const L=[
{t:"Le métier de cadre de santé",s:"Missions, posture, place dans l'hôpital",
f:[
["Qui est le cadre de santé ?","<ul><li>Un professionnel <b>paramédical</b> (filière infirmière, rééducation ou médico-technique) qui a obtenu le <b>diplôme de cadre de santé</b> après une formation en IFCS.</li><li>Il encadre une unité de soins ou un secteur d'activité : c'est le <b>manager de proximité</b>.</li><li>Il est à l'interface entre la direction, les médecins, l'équipe, les patients et les familles.</li><li>Le « <b>faisant fonction</b> » exerce ces missions sans avoir encore le diplôme.</li><li>Attention : la sage-femme est une profession <b>médicale</b>. Elle n'entre pas dans la liste des professions ouvrant à l'IFCS ; son encadrement suit une filière propre (coordination en maïeutique).</li></ul>"],
["Les grandes missions","<ul><li><b>Manager l'équipe</b> : animer, évaluer, accompagner, recadrer, fédérer.</li><li><b>Organiser les soins et l'activité</b> : planning, répartition des tâches, continuité, gestion des lits.</li><li><b>Garantir la qualité et la sécurité</b> des soins : procédures, signalement, amélioration continue.</li><li><b>Gérer les ressources</b> : effectifs, matériel, commandes, suivi d'indicateurs.</li><li><b>Former</b> : accueil des nouveaux, encadrement des étudiants, développement des compétences.</li><li><b>Conduire des projets</b> et relayer le projet d'établissement.</li></ul>"],
["Changer de posture","<ul><li>Passer du <b>« faire »</b> au <b>« faire faire »</b> et au « faire avec » : le cadre ne soigne plus, il rend le soin possible.</li><li><b>Double loyauté</b> : porter les décisions de l'institution ET faire remonter la parole de l'équipe.</li><li><b>Équité</b> : même règle pour tous, y compris les anciens collègues.</li><li><b>Juste distance</b> : proche, disponible, mais pas « copain ».</li><li><b>Exemplarité</b> : ponctualité, respect des règles, confidentialité.</li><li>Savoir <b>décider</b>, expliquer sa décision, et l'assumer.</li></ul>"],
["Où se situe le cadre ?","<ul><li><b>Ligne hiérarchique soignante</b> : directeur·rice des soins → cadre supérieur de santé (pôle) → cadre de santé (unité) → équipe.</li><li><b>Lien avec les médecins</b> : il est <b>fonctionnel</b>, pas hiérarchique. Le cadre et le chef de service forment un <b>binôme</b>.</li><li>Le chef de service décide du projet médical ; le cadre organise les moyens soignants pour le réaliser.</li><li>En cas de désaccord durable : on en parle au cadre supérieur, on ne règle pas ses comptes devant l'équipe.</li></ul>"],
["Les voies du métier","<ul><li><b>Cadre d'unité</b> (soins, médico-technique, rééducation).</li><li><b>Cadre formateur</b> en institut de formation.</li><li><b>Missions transversales</b> : qualité, hygiène, gestion des lits, projets.</li><li>Évolutions : cadre supérieur de santé, puis direction des soins (concours spécifique).</li><li>Ce que les jurys cherchent : un <b>projet réfléchi</b>, de la lucidité sur soi, la capacité à prendre du recul.</li></ul>"]],
q:[
["Le cadre de santé de proximité est avant tout…",["le manager d'une équipe et le garant de l'organisation des soins","le soignant le plus expérimenté du service","l'adjoint administratif du médecin","le représentant du personnel"],"Il manage, organise et garantit la qualité : il ne se définit plus par le soin direct."],
["Où prépare-t-on le diplôme de cadre de santé ?",["En IFCS (institut de formation des cadres de santé)","En IFSI","À l'université uniquement","Dans le service, par ancienneté"],"IFCS : institut de formation des cadres de santé."],
["Quelle durée d'exercice faut-il pour se présenter au concours d'entrée en IFCS ?",["4 ans en équivalent temps plein","1 an","2 ans","10 ans"],"Quatre ans d'exercice à temps plein (ou équivalent) dans sa profession."],
["Un « faisant fonction » de cadre, c'est…",["un professionnel qui exerce les missions de cadre sans avoir le diplôme","un cadre à la retraite","un cadre supérieur par intérim","un étudiant cadre en stage"],"Souvent une étape avant le concours : on teste la fonction."],
["Qui est le supérieur hiérarchique direct du cadre d'unité ?",["Le cadre supérieur de santé","Le chef de service","Le président de la CME","Le pharmacien"],"La ligne hiérarchique est soignante : cadre supérieur puis direction des soins."],
["Le lien entre le cadre et le médecin chef de service est…",["fonctionnel : une collaboration en binôme","hiérarchique : le médecin note le cadre","inexistant","syndical"],"Ils travaillent ensemble mais le médecin n'est pas le supérieur hiérarchique du cadre."],
["Devenir cadre, c'est d'abord passer…",["du « faire » au « faire faire »","du jour à la nuit","du public au privé","du soin à la comptabilité"],"Le changement de posture est la question centrale des jurys."],
["La sage-femme peut-elle entrer en IFCS avec son seul diplôme ?",["Non : c'est une profession médicale, hors de la liste des professions ouvrant à l'IFCS","Oui, sans condition","Oui, après 2 ans","Oui, si elle a travaillé en maternité"],"L'IFCS est réservé aux professions paramédicales listées par le décret de 1995."],
["Combien de modules compte la formation en IFCS ?",["6","3","10","12"],"Six modules, dont la fonction d'encadrement, la santé publique et l'initiation à la recherche."],
["Combien de temps dure la formation de cadre de santé ?",["42 semaines (environ 10 mois)","6 semaines","3 ans","18 mois"],"42 semaines en alternance cours / stages."],
["Laquelle de ces tâches n'est PAS une mission du cadre ?",["Prescrire un traitement","Élaborer le planning","Conduire les entretiens annuels","Analyser un événement indésirable"],"La prescription relève du médecin (et de la sage-femme dans son champ)."],
["Quel texte a créé le diplôme de cadre de santé ?",["Le décret n° 95-926 du 18 août 1995","La loi du 4 mars 2002","La loi HPST de 2009","Le statut d'autonomie de 2004"],"Décret du 18 août 1995, complété par un arrêté du même jour."],
["Où exerce un cadre formateur ?",["Dans un institut de formation","Au bloc opératoire","À la direction des finances","Au SAMU"],"Il forme les futurs professionnels de santé."],
["« Double loyauté » du cadre signifie…",["porter les décisions de l'institution et faire remonter la parole de l'équipe","obéir au médecin et à la famille","travailler dans deux services","avoir deux employeurs"],"Le cadre est un trait d'union, pas un écran."],
["Un ancien collègue devenu votre agent demande une faveur de planning. Le principe à tenir :",["l'équité : la même règle pour tous","l'amitié avant tout","refuser systématiquement tout","lui déléguer le planning"],"L'équité protège le cadre et l'équipe."]],
c:[
{t:"L'ancienne collègue",s:"Tu viens d'être nommé cadre dans le service où tu étais soignant. Une collègue proche te demande, « comme avant », de lui arranger ses week-ends sans passer par la procédure.",o:[
["Tu lui expliques en tête-à-tête que la règle est la même pour tous et tu l'invites à faire sa demande par la voie normale.",2,"Équité + explication en privé : tu poses le cadre sans humilier."],
["Tu acceptes cette fois pour ne pas abîmer la relation.",0,"Tu crées un précédent et une injustice que l'équipe verra très vite."],
["Tu refuses sèchement devant les autres pour montrer que tu as changé.",0,"L'autorité ne se prouve pas par l'humiliation publique."],
["Tu dis que tu vas voir, et tu laisses traîner.",1,"Tu évites le conflit mais tu ne poses rien : le problème reviendra."]]},
{t:"La demande du chef de service",s:"Le chef de service te demande de changer l'horaire des transmissions dès demain, sans avoir consulté l'équipe.",o:[
["Tu échanges avec lui sur l'objectif, tu proposes un délai court pour préparer l'équipe et tester, puis tu informes ton cadre supérieur.",2,"Binôme respecté, objectif médical entendu, équipe associée, hiérarchie informée."],
["Tu appliques dès demain sans discuter : c'est le chef.",1,"Le lien est fonctionnel, pas hiérarchique. Appliquer sans préparer risque l'échec."],
["Tu refuses : l'organisation soignante ne le regarde pas.",0,"Le projet médical guide l'organisation : refuser de collaborer casse le binôme."],
["Tu te plains du médecin à l'équipe.",0,"Déloyal et clivant."]]},
{t:"Le retard du premier jour",s:"Premier jour comme cadre. Un agent arrive avec 20 minutes de retard pendant les transmissions, devant toute l'équipe.",o:[
["Tu laisses finir les transmissions puis tu le reçois seul le jour même : faits, raison, rappel de la règle.",2,"Réaction rapide, en privé, centrée sur les faits."],
["Tu fais une remarque ironique devant tout le monde.",0,"Humiliation publique : tu perds la confiance de l'équipe."],
["Tu ne dis rien, c'est ton premier jour.",0,"Ce que tu tolères le premier jour devient la norme."],
["Tu envoies un mail général sur la ponctualité.",1,"Rappel utile mais qui évite la personne concernée."]]}],
o:[
["DS","Pourquoi voulez-vous devenir cadre de santé ?",["Un déclencheur concret tiré de mon parcours","Des expériences de coordination, de tutorat ou de projet","Ma conception du rôle : rendre le soin possible pour l'équipe","Ce que je veux apporter à l'établissement et aux patients","Pas de fuite du soin : je le dis clairement"]],
["CSS","Quelle différence entre un bon soignant et un bon cadre ?",["Le soignant agit auprès du patient, le cadre agit sur l'organisation et l'équipe","Passage du faire au faire faire","Vision collective, équité, décision","La compétence clinique aide à la légitimité mais ne suffit pas","Un exemple concret"]],
["MED","Qu'attendez-vous de la collaboration avec le chef de service ?",["Un binôme : lien fonctionnel et non hiérarchique","Des points réguliers, des objectifs partagés","Des désaccords traités en privé","Chacun dans son champ : projet médical / organisation soignante","Le patient comme boussole commune"]],
["DRH","Présentez votre parcours en trois minutes.",["Structure chronologique ou par compétences, annoncée","Trois temps forts, pas une liste de postes","Les compétences transférables vers l'encadrement","Le lien avec le poste visé","Une conclusion tournée vers le projet"]],
["DS","Quelles sont vos limites ?",["Une vraie limite, pas une fausse qualité","Un exemple où elle m'a gêné","Ce que je fais concrètement pour progresser","Lucidité sans autodénigrement"]]],
e:["« Le cadre de santé : entre proximité et distance. » Discutez à partir de votre expérience.",["Proximité : connaître le terrain, être disponible, légitimité","Distance : équité, décision, loyauté institutionnelle","La juste distance se construit, exemples à l'appui"]]},

{t:"Le fenua et son système de santé",s:"Institutions, géographie, acteurs, financement",
f:[
["Un Pays autonome","<ul><li>La Polynésie française est une collectivité d'outre-mer dotée de l'<b>autonomie</b> (loi organique du 27 février 2004).</li><li>Le <b>Pays</b> est compétent pour la <b>santé</b>, la protection sociale et sa propre fonction publique. L'État garde le régalien (justice, sécurité, défense…).</li><li>Institutions : Président de la Polynésie française, gouvernement, <b>Assemblée de la Polynésie française</b> (APF), CESEC.</li><li>Textes locaux : <b>lois du pays</b>, délibérations, arrêtés en conseil des ministres (CM). On les consulte sur <b>Lexpol</b>.</li><li>Conséquence : un texte de métropole ne s'applique pas automatiquement. Réflexe du cadre : <b>vérifier le texte local</b>.</li></ul>"],
["Géographie = organisation","<ul><li><b>5 archipels</b> : Société, Tuamotu, Gambier, Marquises, Australes ; 118 îles sur une surface grande comme l'Europe.</li><li>Environ 279 000 habitants, dont près des trois quarts à Tahiti et Moorea.</li><li>L'<b>insularité</b> pèse sur tout : délais, transport, isolement des patients et des familles.</li><li><b>Evasan</b> = évacuation sanitaire, entre les îles vers Tahiti, ou hors du territoire pour les soins non disponibles.</li><li>La <b>télémédecine</b> se développe pour limiter les déplacements.</li></ul>"],
["Les acteurs","<ul><li><b>Ministère de la santé</b> du Pays : la politique de santé.</li><li><b>Direction de la santé</b> : prévention, santé publique et structures de proximité (centres médicaux, dispensaires, infirmeries, postes de secours) + les hôpitaux de <b>Taravao</b>, <b>Moorea (Afareaitu)</b>, <b>Uturoa (Raiatea)</b> et <b>Taiohae (Nuku Hiva)</b>.</li><li><b>ARASS</b> (Agence de régulation de l'action sanitaire et sociale, créée en 2017) : régulation, autorisations.</li><li><b>CHPF</b> : l'hôpital de référence, au Taaone (Pirae).</li><li>Secteur privé : cliniques à Papeete, professionnels libéraux.</li></ul>"],
["CPS et PSG : qui paie ?","<ul><li>La <b>CPS</b> (Caisse de prévoyance sociale) gère la protection sociale.</li><li>La <b>PSG</b> (protection sociale généralisée) existe depuis 1995, avec trois régimes : <b>salariés</b> (RGS), <b>non-salariés</b> (RNS) et <b>solidarité</b> (RSPF).</li><li>L'hôpital public est financé principalement par une <b>dotation globale</b>.</li><li>Pour le cadre : chaque journée d'hospitalisation évitable, chaque examen doublé, a un coût collectif.</li></ul>"],
["Planifier l'offre de soins","<ul><li>Le <b>schéma d'organisation sanitaire</b> (SOS) répartit l'offre de soins sur le territoire.</li><li>La <b>loi du pays n° 2020-4 du 16 janvier 2020</b> encadre l'organisation sanitaire (autorisations d'activité, etc.).</li><li>Idée directrice des plans récents : renforcer les <b>soins de santé primaires</b> et la prévention, recentrer le CHPF sur le recours.</li><li>À l'oral : savoir situer son unité dans ce paysage (d'où viennent mes patients, où vont-ils après ?).</li></ul>"]],

f:[
["Carte d'identité du CHPF","<ul><li><b>Établissement public administratif</b> du Pays, créé par une délibération du 4 novembre 1983.</li><li>Installé au <b>Taaone, à Pirae</b>, depuis fin 2010 (auparavant à Mamao, Papeete).</li><li>Hôpital de <b>référence et de dernier recours</b> : urgences, SAMU, réanimation, maternité, cancérologie, psychiatrie…</li><li>Fin 2024 : <b>439 lits</b> de médecine-chirurgie-obstétrique et <b>66 lits</b> de psychiatrie, plus des places d'hôpital de jour et de pédopsychiatrie.</li><li>C'est le seul hôpital public du Pays doté de la personnalité morale.</li></ul>"],
["Gouvernance","<ul><li>Conseil d'administration, direction générale, directions fonctionnelles dont la <b>direction des soins</b>.</li><li><b>CME</b> : commission médicale d'établissement, la voix des médecins.</li><li><b>Pôles</b> d'activité : regroupements de services ; leur généralisation est en cours.</li><li><b>Projet d'établissement</b> : projet médical, projet de soins, projet social, gestion, logistique, système d'information.</li><li>Le cadre décline ces orientations dans un <b>projet d'unité</b>.</li></ul>"],
["Les enjeux actuels","<ul><li>Rapport 2025 de la Chambre territoriale des comptes : statut jugé inadapté, financement dépendant des subventions, comptes et facturation à fiabiliser.</li><li>Pistes citées : <b>unité de gériatrie</b>, <b>service post-urgences</b>, préparation d'une <b>certification qualité</b>.</li><li><b>Recrutement et turn-over</b> : postes vacants, nombreux contractuels.</li><li><b>Tension sur les lits</b> : au-delà d'environ 85 % d'occupation, l'hôpital est en surtension ; une cellule de gestion des lits suit la situation.</li><li>À l'oral : citer ces enjeux sans critiquer, et dire ce qu'un cadre peut faire à son niveau.</li></ul>"],
["La fonction publique du Pays","<ul><li>Statut général : <b>délibération n° 95-215 AT du 14 décembre 1995</b>.</li><li><b>4 catégories</b> : A, B, C, D. Des <b>cadres d'emplois</b> régis par des statuts particuliers.</li><li>Les <b>cadres de santé</b> forment un cadre d'emplois de <b>catégorie A</b> de la filière santé.</li><li>Les concours sont organisés par la <b>DTI</b> (Direction des talents et de l'innovation, ex-DGRH).</li><li>À côté des fonctionnaires : des agents non titulaires (contrats).</li><li>Obligations : obéissance hiérarchique, secret et discrétion professionnels, neutralité, probité. Droits : rémunération après service fait, formation, protection, droit syndical.</li></ul>"],
["Le concours de cadre de santé du Pays","<ul><li>Session 2025 : <b>concours externe sur titres</b>.</li><li>Conditions affichées : <b>nationalité française</b>, avoir entre <b>18 et 62 ans</b> au 1er janvier de l'année.</li><li>Titres : le <b>diplôme de cadre de santé</b>, avec un diplôme d'infirmier, de rééducation ou médico-technique.</li><li>Sélection sur dossier et <b>entretien avec un jury</b>.</li><li>Les lauréats sont inscrits sur une liste d'aptitude, puis nommés stagiaires avant titularisation.</li><li><b>Vérifie toujours l'arrêté d'ouverture</b> de la session visée sur le site de la DTI : les conditions peuvent changer.</li></ul>"]],

{t:"Droit et statut : ce qu'un cadre doit savoir",s:"Normes, service public, statut, discipline, code du travail",
f:[
["Qui décide quoi : les textes au fenua","<ul><li>Au sommet : la <b>Constitution</b> (article 74) et la <b>loi organique du 27 février 2004</b> qui répartit les compétences entre l'État et le Pays.</li><li>Les lois et décrets de l'État ne s'appliquent ici que dans les matières de l'État, ou s'ils le prévoient.</li><li><b>Lois du pays</b> : votées par l'Assemblée dans le domaine de la loi. Ce sont juridiquement des <b>actes administratifs</b>, contrôlés par le <b>Conseil d'État</b>.</li><li><b>Délibérations</b> de l'Assemblée (ex. le statut de la fonction publique), puis <b>arrêtés pris en conseil des ministres</b> (CM), arrêtés du Président et des ministres.</li><li>Dans l'établissement : règlement intérieur, notes de service, procédures.</li><li>Tout est publié au <b>JOPF</b> et consultable sur <b>Lexpol</b>. Le juge de l'administration est le <b>tribunal administratif de la Polynésie française</b>.</li><li>Réflexe : une note de service ne peut pas contredire une délibération ; un cadre cite le bon niveau de texte.</li></ul>"],
["Service public et décision administrative","<ul><li>Trois principes du service public : <b>continuité</b> (le service ne s'arrête pas), <b>égalité</b> (mêmes droits pour tous les usagers), <b>adaptabilité</b> (le service évolue). S'y ajoute la <b>neutralité</b>.</li><li>Traduction dans une unité : planning sans trou, pas de passe-droit, organisation qui change quand les besoins changent.</li><li>Une <b>décision défavorable</b> à un agent (refus, sanction) doit être écrite, <b>motivée</b>, notifiée, avec les voies de recours.</li><li><b>Faute de service</b> : commise dans l'exercice des fonctions, c'est l'administration qui répond. <b>Faute personnelle</b> : détachable du service, l'agent en répond.</li><li><b>Protection fonctionnelle</b> : le Pays doit protéger l'agent menacé ou injurié dans ses fonctions.</li><li>Tout agent public qui a connaissance d'un crime ou d'un délit dans ses fonctions doit le signaler au procureur (article 40 du code de procédure pénale).</li></ul>"],
["Le statut général, article par article","<ul><li>Délibération n° 95-215 AT du 14 décembre 1995. <b>Art. 4</b> : nationalité française, droits civiques, casier compatible, aptitude physique.</li><li><b>Art. 11</b> : se consacrer à ses fonctions, pas d'activité privée lucrative (sauf exceptions prévues).</li><li><b>Art. 12-13</b> : secret professionnel et discrétion professionnelle.</li><li><b>Art. 14</b> : obéir aux instructions du supérieur, <b>sauf ordre manifestement illégal et de nature à compromettre gravement un intérêt public</b>.</li><li><b>Art. 7-9</b> : droit syndical ; droit de grève, avec service minimum possible pour la continuité.</li><li><b>Art. 10</b> : protection par le Pays. <b>Art. 26</b> : rémunération après service fait. <b>Art. 27</b> : congés. <b>Art. 30-31</b> : formation, hygiène et sécurité.</li><li><b>Art. 64 bis</b> : <b>39 heures</b> par semaine.</li><li><b>Art. 60</b> : stage d'un an en principe avant titularisation. Positions : activité, détachement, disponibilité, congé parental.</li><li>Instances : <b>CAP</b> (commission administrative paritaire, par cadre d'emplois) pour les situations individuelles ; <b>CTP</b> (comité technique paritaire) pour l'organisation et les conditions de travail.</li></ul>"],
["La discipline","<ul><li><b>4 groupes</b> de sanctions (art. 85). <b>1er</b> : avertissement, blâme (seul le blâme est au dossier, effacé après 3 ans sans nouvelle sanction). <b>2e</b> : radiation du tableau d'avancement, abaissement d'échelon, exclusion temporaire de 15 jours au plus, déplacement d'office. <b>3e</b> : rétrogradation, exclusion de 6 mois à 2 ans. <b>4e</b> : révocation.</li><li>Le pouvoir disciplinaire appartient au <b>Président de la Polynésie française</b> ; les chefs de service et directeurs d'établissement ont délégation pour le 1er groupe. Au-delà : avis de la CAP en conseil de discipline.</li><li><b>Suspension</b> : mesure conservatoire en cas de faute grave, 4 mois au plus, traitement maintenu. Ce n'est pas une sanction.</li><li><b>Droits de la défense</b> : griefs écrits, accès au dossier, assistance d'un défenseur, délai pour se préparer.</li><li>Rôle du cadre : constater les <b>faits</b>, entendre l'agent rapidement, réunir des preuves licites, rédiger un <b>rapport circonstancié</b>, proposer une mesure <b>proportionnée</b>. Il ne sanctionne pas lui-même.</li><li>Interdits : la <b>sanction déguisée</b> (retirer des week-ends, changer de poste pour punir), deux sanctions pour une même faute.</li><li>Insuffisance professionnelle et abandon de poste ne sont pas des fautes disciplinaires : procédures distinctes.</li></ul>"],
["Trois statuts dans une équipe, et le code du travail","<ul><li><b>Fonctionnaires</b> : statut général + statut particulier de leur cadre d'emplois.</li><li><b>ANT</b> (agents non titulaires) : contrat de <b>droit public</b>, délibération n° 2004-15 APF du 22 janvier 2004, durées limitées.</li><li><b>ANFA</b> (agents non fonctionnaires de l'administration) : <b>droit privé</b>, convention collective, donc <b>code du travail</b>.</li><li>Le <b>code du travail polynésien</b> (loi du pays n° 2011-15 du 4 mai 2011) s'applique aux salariés de droit privé : cliniques, prestataires, ANFA.</li><li>Ses repères : <b>39 h</b> par semaine ; <b>10 h</b> par jour et <b>48 h</b> par semaine au maximum ; repos de <b>11 h</b> consécutives par jour et <b>24 h</b> par semaine ; heures supplémentaires majorées ; <b>2,5 jours ouvrables</b> de congés payés par mois.</li><li>Pour un ANT ou un ANFA, l'<b>entretien préalable</b> est obligatoire avant toute sanction ; le licenciement d'un salarié protégé exige l'autorisation de l'<b>inspecteur du travail</b>.</li><li>Avant toute décision sur le temps de travail, un congé ou une faute : <b>vérifier le statut de l'agent</b> et appeler les ressources humaines. Les cycles hospitaliers (nuits, gardes) relèvent en plus des règles de l'établissement.</li></ul>"]],

{t:"Manager une équipe",s:"Styles, motivation, communication, conflits, changement",
f:[
["Les styles de management","<ul><li><b>Lewin</b> : autoritaire, démocratique, laisser-faire.</li><li><b>Hersey et Blanchard</b> (management situationnel) : on adapte son style à l'autonomie de la personne (compétence + motivation) : <b>directif</b>, <b>persuasif</b>, <b>participatif</b>, <b>délégatif</b>.</li><li>Il n'y a pas de bon style unique : une nouvelle diplômée et une infirmière de 20 ans de métier ne se managent pas pareil.</li><li><b>Mintzberg</b> : le manager joue 10 rôles, regroupés en rôles interpersonnels, informationnels et décisionnels.</li></ul>"],
["La motivation","<ul><li><b>Maslow</b> : besoins physiologiques, sécurité, appartenance, estime, accomplissement.</li><li><b>Herzberg</b> : les <b>facteurs d'hygiène</b> (salaire, conditions, planning) évitent l'insatisfaction ; les <b>facteurs moteurs</b> (reconnaissance, responsabilité, intérêt du travail) créent la motivation.</li><li>Leviers du cadre : donner du <b>sens</b>, reconnaître le travail bien fait, confier des missions, former, être juste.</li><li>La reconnaissance est gratuite et quotidienne : précise, sincère, individuelle.</li></ul>"],
["Communiquer","<ul><li><b>Écoute active</b> : reformuler, questionner, ne pas interrompre.</li><li><b>Assertivité</b> : dire les choses clairement, sans agressivité ni fuite.</li><li>Méthode <b>DESC</b> pour un recadrage : <b>D</b>écrire les faits, <b>E</b>xprimer son ressenti, <b>S</b>pécifier ce qu'on attend, <b>C</b>onséquences positives.</li><li>Réunions : ordre du jour, durée tenue, décisions notées, compte rendu.</li><li>On félicite en public, on recadre en privé.</li></ul>"],
["Gérer un conflit","<ul><li>Un conflit non traité s'aggrave toujours.</li><li>Étapes : recevoir chacun <b>séparément</b>, s'en tenir aux <b>faits</b>, réunir pour une <b>médiation</b>, formaliser des <b>engagements</b>, <b>suivre</b>.</li><li>Chercher la cause : personnes, organisation floue, valeurs, charge de travail.</li><li>Le cadre est <b>tiers</b>, pas juge ni copain.</li><li>Si le conflit dépasse l'unité ou touche au harcèlement : alerter la hiérarchie.</li></ul>"],
["Conduire le changement","<ul><li>La <b>résistance</b> est normale : peur de perdre des repères, des compétences, du confort.</li><li><b>Lewin</b> : dégel, changement, regel. <b>Kotter</b> : 8 étapes, dont créer l'urgence, former une équipe pilote, obtenir des victoires rapides, ancrer.</li><li>Recette du cadre : expliquer le <b>pourquoi</b>, associer l'équipe au <b>comment</b>, former, tester, évaluer, ajuster.</li><li><b>Déléguer</b> n'est pas abandonner : objectif clair, moyens, point d'étape, droit à l'erreur.</li></ul>"]],
q:[
["Dans le management situationnel, combien de styles ?",["4","2","3","10"],"Directif, persuasif, participatif, délégatif."],
["Avec une professionnelle très compétente et très motivée, le style adapté est…",["délégatif","directif","autoritaire","persuasif"],"Autonomie élevée : on délègue."],
["Avec un nouvel arrivant peu autonome, on commence par un style…",["directif","délégatif","laisser-faire","participatif"],"On cadre, on explique, on montre."],
["Selon Herzberg, le salaire est…",["un facteur d'hygiène","un facteur moteur","sans effet","un besoin d'accomplissement"],"Il évite l'insatisfaction mais ne motive pas durablement."],
["Selon Herzberg, la reconnaissance est…",["un facteur moteur","un facteur d'hygiène","un besoin physiologique","un style de management"],"Elle crée la motivation."],
["Au sommet de la pyramide de Maslow :",["l'accomplissement de soi","la sécurité","l'appartenance","les besoins physiologiques"],"L'accomplissement vient en dernier."],
["Dans DESC, le « S » signifie…",["Spécifier ce qu'on attend","Sanctionner","Sourire","Synthétiser"],"Décrire, Exprimer, Spécifier, Conséquences."],
["Combien de rôles du manager chez Mintzberg ?",["10","4","6","14"],"Dix rôles en trois familles."],
["Les trois styles de Lewin :",["autoritaire, démocratique, laisser-faire","directif, persuasif, délégatif","dégel, changement, regel","hygiène, moteur, accomplissement"],"À ne pas confondre avec son modèle du changement."],
["Les trois temps du changement selon Lewin :",["dégel, changement, regel","déni, colère, acceptation","planifier, faire, vérifier","diagnostic, action, bilan"],"Dégel – changement – regel."],
["Combien d'étapes dans le modèle de Kotter ?",["8","3","5","12"],"De « créer l'urgence » à « ancrer le changement »."],
["Première étape face à un conflit entre deux agents :",["les recevoir séparément pour établir les faits","les sanctionner tous les deux","attendre que cela passe","changer l'un d'eux de service"],"On écoute chacun avant toute confrontation."],
["On recadre un agent…",["en privé, sur des faits","en public, pour l'exemple","par message","jamais"],"Félicitations en public, recadrage en privé."],
["Déléguer, c'est…",["confier une mission avec un objectif, des moyens et un suivi","se débarrasser d'une tâche","perdre son autorité","transférer sa responsabilité"],"Le cadre reste responsable de ce qu'il délègue."],
["Face à la résistance au changement, le premier levier est…",["expliquer le sens et associer l'équipe","imposer plus vite","ignorer les opposants","promettre une prime"],"Le pourquoi d'abord, le comment ensemble."]],

["Tu dis que c'est la direction qui l'impose et que tu n'y peux rien.",0,"Tu te désolidarises : l'équipe n'a plus de pilote."],

{t:"Organiser et gérer les ressources",s:"Planning, absentéisme, compétences, indicateurs",
f:[
["Le planning","<ul><li>Trois exigences : <b>continuité des soins</b>, <b>respect de la réglementation</b> du temps de travail, <b>équité</b>.</li><li>Un <b>effectif minimum de sécurité</b> par poste, connu de tous.</li><li>Anticiper : congés demandés tôt, règles de priorité écrites et connues (roulement d'une année sur l'autre).</li><li>Tout changement est <b>tracé</b> et validé par le cadre.</li><li>Les règles précises (repos, amplitude, heures supplémentaires) dépendent des textes locaux et du règlement de l'établissement : <b>les connaître avant l'oral</b>.</li></ul>"],
["L'absentéisme","<ul><li><b>Dans l'heure</b> : évaluer la charge, prioriser les soins, réorganiser, chercher un remplacement (équipe de suppléance, heures supplémentaires volontaires), prévenir la hiérarchie. Le rappel sur repos reste le dernier recours.</li><li><b>Dans la durée</b> : suivre l'indicateur, distinguer absences courtes répétées et longues, <b>entretien de retour</b>, analyser les causes (charge, ambiance, troubles musculo-squelettiques).</li><li>Prévenir : conditions de travail, matériel d'aide à la manutention, reconnaissance, planning stable.</li></ul>"],
["Développer les compétences","<ul><li><b>Fiche de poste</b> : qui fait quoi.</li><li><b>Entretien annuel</b> : bilan, objectifs, besoins de formation. Il se prépare des deux côtés.</li><li><b>Plan de formation</b> : relier les demandes individuelles aux besoins de l'unité.</li><li><b>Accueil du nouvel arrivant</b> : livret, tuteur, période d'intégration, points d'étape.</li><li><b>Étudiants</b> : le cadre est garant de la qualité de l'encadrement en stage.</li></ul>"],
["Piloter avec des indicateurs","<ul><li>Tableau de bord simple : <b>taux d'occupation</b>, <b>DMS</b> (durée moyenne de séjour), absentéisme, événements indésirables, satisfaction.</li><li><b>Gestion des lits</b> : la sortie se prépare dès l'entrée (date prévisionnelle, transport, social).</li><li><b>Charge en soins</b> : ajuster la répartition selon la lourdeur des patients.</li><li><b>Matériel et stocks</b> : commandes, péremptions, maintenance.</li><li>Un indicateur sert à décider, pas à surveiller.</li></ul>"],
["Qualité de vie au travail","<ul><li>Risques psychosociaux : charge, manque d'autonomie, conflits de valeurs, manque de reconnaissance, insécurité.</li><li>Signaux d'alerte : irritabilité, erreurs, isolement, absences courtes.</li><li>Leviers : espaces de parole, organisation claire, soutien visible du cadre, médecine du travail, psychologue.</li><li><b>Violence</b> envers un agent : protéger, soigner, signaler, accompagner le dépôt de plainte.</li><li>Le cadre aussi doit se préserver : il ne porte pas tout seul.</li></ul>"]],
q:[
["Les trois exigences d'un planning :",["continuité des soins, réglementation, équité","rapidité, économie, silence","ancienneté, amitié, habitude","souplesse, improvisation, confiance"],"Les trois se tiennent."],
["Que signifie DMS ?",["Durée moyenne de séjour","Direction médicale des soins","Dossier médical sécurisé","Dotation mensuelle de service"],"Indicateur clé de la gestion des lits."],
["Quand prépare-t-on la sortie d'un patient ?",["Dès l'entrée","La veille","Le matin même","Quand le lit est réclamé"],"Anticiper transport, social, ordonnances."],

["L'entretien de retour après une absence sert à…",["accueillir, informer et comprendre","sanctionner","vérifier le certificat médical","annoncer un changement de poste"],"C'est un outil de prévention."],

["Qui est garant de la qualité de l'encadrement des étudiants en stage ?",["Le cadre de santé","L'étudiant","Le directeur général","La famille du patient"],"Avec les tuteurs qu'il désigne."],
["Un bon indicateur sert d'abord à…",["décider et améliorer","surveiller les agents","remplir un classeur","justifier une sanction"],"Mesurer pour agir."],
["Les congés d'été sont tous demandés sur la même période. Le cadre s'appuie sur…",["des règles de priorité écrites et connues de tous","l'ancienneté seulement","le premier qui demande","ses préférences"],"Avec un roulement d'une année sur l'autre."],
["Un agent est agressé par un visiteur. Le cadre doit…",["le protéger, signaler et l'accompagner dans ses démarches","lui dire que c'est le métier","attendre qu'il se plaigne","lui demander de s'excuser"],"Soutien visible et signalement systématique."],
["Signal d'alerte d'épuisement professionnel :",["irritabilité, erreurs et absences courtes répétées","demande de formation","ponctualité","prise de congés annuels"],"À repérer tôt."],
["L'effectif minimum de sécurité est…",["le seuil en dessous duquel les soins ne sont plus sûrs","l'effectif idéal","un objectif budgétaire","fixé chaque matin par l'équipe"],"Il doit être défini et connu."],
["Une modification de planning entre deux agents doit être…",["validée et tracée par le cadre","arrangée entre eux sans rien dire","interdite","décidée par le médecin"],"Responsabilité et traçabilité."]],

{t:"Qualité, risques et droits du patient",s:"Signaler, analyser, protéger",
f:[
["La démarche qualité","<ul><li>Roue de <b>Deming</b> : <b>P</b>lanifier, <b>D</b>évelopper (faire), <b>C</b>ontrôler, <b>A</b>juster (PDCA).</li><li>Outils : procédures, audits, évaluation des pratiques professionnelles (EPP), patient traceur, indicateurs.</li><li>En métropole, les hôpitaux sont certifiés par la HAS. Au CHPF, la Chambre territoriale des comptes invite à <b>préparer une future certification qualité</b>.</li><li>Le cadre fait vivre la qualité au quotidien : une procédure connue et appliquée vaut mieux que dix classeurs.</li></ul>"],
["Gérer les risques","<ul><li><b>Événement indésirable</b> (EI) : tout événement qui a causé ou aurait pu causer un dommage. EIG = grave.</li><li><b>Signaler n'est pas dénoncer</b> : culture juste, non punitive pour l'erreur, ferme pour la faute délibérée.</li><li>Analyser : <b>CREX</b> (comité de retour d'expérience), <b>RMM</b> (revue de morbidité et de mortalité), arbre des causes, diagramme d'<b>Ishikawa</b> (5M).</li><li>Modèle de <b>Reason</b> (les tranches de fromage) : un accident traverse plusieurs barrières défaillantes ; on cherche les causes du système, pas un coupable.</li></ul>"],
["Vigilances du quotidien","<ul><li><b>Identitovigilance</b> : bracelet, vérification de l'identité avant chaque acte.</li><li><b>Médicament</b> : règle des 5 B : bon patient, bon médicament, bonne dose, bonne voie, bon moment.</li><li><b>Hygiène</b> : hygiène des mains, précautions standard, prévention des infections associées aux soins.</li><li>Hémovigilance, matériovigilance, pharmacovigilance.</li><li>Le cadre vérifie que les règles sont <b>connues, possibles et appliquées</b>.</li></ul>"],
["Les droits du patient","<ul><li><b>Information</b> loyale, claire, adaptée ; <b>consentement</b> libre et éclairé.</li><li><b>Personne de confiance</b>, accès au dossier, respect de la dignité et de l'intimité.</li><li><b>Secret professionnel</b> : il couvre tout ce qui est vu, entendu, compris.</li><li>Prise en charge de la <b>douleur</b>, accompagnement de la <b>fin de vie</b>, directives anticipées.</li><li>Références nationales : loi du 4 mars 2002, lois de 2005 et 2016 sur la fin de vie. Vérifie le texte applicable localement.</li></ul>"],
["Bientraitance et responsabilité","<ul><li><b>Bientraitance</b> : une démarche collective, pas seulement l'absence de maltraitance.</li><li>Maltraitance constatée ou suspectée : <b>protéger le patient</b>, établir les faits, <b>signaler à la hiérarchie</b>. Ne jamais couvrir.</li><li><b>Contention</b> : sur prescription médicale, réévaluée, tracée.</li><li>Plainte d'une famille : recevoir, écouter, s'excuser pour le vécu, expliquer, tracer, orienter vers la voie de réclamation.</li><li>Responsabilités du cadre : disciplinaire, administrative, civile, pénale. La <b>traçabilité</b> protège le patient et les professionnels.</li></ul>"]],
q:[
["PDCA signifie…",["Planifier, Développer, Contrôler, Ajuster","Prévoir, Décider, Communiquer, Agir","Patient, Dossier, Consentement, Accord","Procédure, Document, Contrôle, Audit"],"La roue de Deming."],
["Un événement indésirable est…",["un événement qui a causé ou aurait pu causer un dommage","toujours une faute","un conflit d'équipe","une plainte de famille uniquement"],"Les presque-accidents se signalent aussi."],
["Que signifie CREX ?",["Comité de retour d'expérience","Centre de recherche et d'expertise","Cellule de recrutement externe","Contrôle renforcé des examens"],"Analyse collective des événements signalés."],
["Que signifie RMM ?",["Revue de morbidité et de mortalité","Réunion mensuelle de management","Registre des mouvements de malades","Rapport de maintenance du matériel"],"Analyse de cas avec les médecins."],
["Le modèle de Reason est illustré par…",["des tranches de fromage à trous","une pyramide","une roue","une arête de poisson"],"L'accident traverse plusieurs barrières."],
["Les 5M d'Ishikawa :",["Matière, Matériel, Méthode, Main-d'œuvre, Milieu","Malade, Médecin, Médicament, Matériel, Mesure","Motivation, Management, Mission, Moyens, Mesure","Matin, Midi, Mi-journée, Minuit, Matinée"],"Le diagramme en arête de poisson."],
["La règle des 5 B concerne…",["l'administration du médicament","l'accueil des familles","le planning","le bionettoyage"],"Bon patient, bon médicament, bonne dose, bonne voie, bon moment."],
["Avant tout acte, on vérifie d'abord…",["l'identité du patient","le numéro de chambre","le nom du médecin","l'heure du repas"],"Identitovigilance."],
["Une culture de sécurité « juste » veut dire…",["on ne punit pas l'erreur signalée, mais on reste ferme sur la faute délibérée","on ne sanctionne jamais","on sanctionne toute erreur","on ne signale que le grave"],"C'est ce qui permet de signaler."],
["Le consentement du patient doit être…",["libre et éclairé","écrit dans tous les cas","donné par la famille","implicite"],"Après une information loyale et adaptée."],
["La personne de confiance est…",["désignée par le patient pour l'accompagner et témoigner de sa volonté","le médecin traitant","toujours le conjoint","le cadre du service"],"Le patient la choisit librement."],
["Le secret professionnel couvre…",["tout ce qui a été vu, entendu ou compris","seulement le diagnostic","seulement le dossier papier","seulement les patients connus"],"Y compris sur les réseaux sociaux."],
["Une contention physique se met en place…",["sur prescription médicale, réévaluée et tracée","à la demande de la famille","à l'initiative de l'aide-soignant","systématiquement la nuit"],"C'est une restriction de liberté."],
["Vous suspectez une maltraitance par un agent. Vous devez…",["protéger le patient, établir les faits et signaler à la hiérarchie","attendre des preuves pendant des semaines","en parler seulement à l'équipe","changer le patient de chambre et oublier"],"Ne jamais couvrir."],
["Face à une famille en colère, la première chose à faire :",["la recevoir au calme et l'écouter","lui remettre le formulaire de réclamation","appeler la sécurité","lui expliquer qu'elle a tort"],"L'écoute désamorce ; l'explication vient après."]],

["Tu l'accueilles dans ton bureau, tu écoutes, tu dis ce qui est su et fait pour son père, tu proposes un échange avec le médecin, tu traces et tu informes la hiérarchie.",2,"Écoute, transparence, médecin associé, traçabilité, alerte."],

{t:"Le geste brusque",s:"Tu vois un aide-soignant retourner sèchement une patiente âgée en lui disant : « Arrête de gémir. »",o:[
["Tu interviens tout de suite auprès de la patiente, tu reçois l'agent dans l'heure sur les faits, tu informes ton cadre supérieur et tu traces.",2,"Protection immédiate, entretien factuel, signalement."],
["Tu attends l'entretien annuel pour lui en parler.",0,"Tolérer, c'est valider."],
["Tu le reprends vivement devant la patiente.",1,"Tu protèges, mais le recadrage se fait en privé."],
["Tu te dis qu'il est fatigué en ce moment.",0,"La fatigue s'entend, elle n'excuse pas."]]}],

{t:"Projet et santé publique au fenua",s:"Conduire un projet, comprendre les besoins de la population",
f:[
["La méthode projet","<ul><li><b>1. Diagnostic</b> : quel problème, quelles données ?</li><li><b>2. Objectifs SMART</b> : Spécifique, Mesurable, Atteignable, Réaliste, Temporellement défini.</li><li><b>3. Plan d'action</b> : qui fait quoi, quand, avec quoi.</li><li><b>4. Mise en œuvre</b> : groupe de travail, communication, test.</li><li><b>5. Évaluation</b> : indicateurs définis <b>dès le départ</b>.</li><li><b>6. Ajustement</b> et pérennisation.</li></ul>"],
["La boîte à outils","<ul><li><b>QQOQCP</b> : Qui, Quoi, Où, Quand, Comment, Pourquoi.</li><li><b>SWOT</b> : forces, faiblesses, opportunités, menaces.</li><li><b>Ishikawa</b> : chercher les causes.</li><li><b>Pareto</b> : 20 % des causes produisent 80 % des effets.</li><li><b>Gantt</b> : le calendrier du projet.</li><li><b>Fiche action</b> : objectif, pilote, échéance, indicateur.</li></ul>"],
["Santé publique en Polynésie","<ul><li><b>Maladies chroniques</b> : obésité, diabète, hypertension, maladies cardiovasculaires, insuffisance rénale (dialyse), cancers.</li><li><b>Rhumatisme articulaire aigu</b>, encore présent.</li><li><b>Maladies infectieuses</b> : dengue, leptospirose ; intoxications comme la ciguatéra.</li><li><b>Addictions</b> et santé mentale.</li><li><b>Vieillissement</b> de la population.</li><li>À l'hôpital : chaque séjour est une occasion de prévention et d'<b>éducation thérapeutique</b>.</li></ul>"],
["Le parcours du patient","<ul><li>L'hospitalisation n'est qu'une <b>étape</b> : avant (médecin, dispensaire, île d'origine) et après (domicile, structure de proximité).</li><li>La sortie se <b>coordonne</b> : ordonnances, rendez-vous, transport, relais avec les soignants de l'île.</li><li>Le cadre connaît son réseau : service social, structures de la Direction de la santé, libéraux, associations.</li><li>Un parcours bien préparé évite la réhospitalisation.</li></ul>"],
["Culture et soins","<ul><li>La <b>famille élargie</b> est une ressource : l'associer, avec un interlocuteur identifié.</li><li>Les <b>matahiapo</b> (anciens) sont respectés : attention à la manière de s'adresser à eux.</li><li>La <b>spiritualité</b> compte dans la maladie et la fin de vie.</li><li><b>Rā'au tahiti</b> (médecine traditionnelle) : demander sans juger, informer le médecin, veiller à la sécurité.</li><li>Soignants arrivant d'ailleurs : les accompagner dans la découverte de ces repères.</li></ul>"]],
q:[
["Dans SMART, le « M » signifie…",["Mesurable","Motivant","Médical","Mensuel"],"Sans mesure, pas d'évaluation."],
["La première étape d'un projet :",["le diagnostic de la situation","le plan d'action","l'achat du matériel","l'évaluation finale"],"On part des faits."],
["Quand définit-on les indicateurs d'un projet ?",["Dès le départ","À la fin","Quand la direction les demande","Jamais"],"Sinon on ne peut rien comparer."],
["SWOT analyse…",["forces, faiblesses, opportunités, menaces","salaires, travail, organisation, temps","soins, surveillance, ordonnances, transmissions","sécurité, vigilance, ordre, traçabilité"],"Interne (forces/faiblesses) et externe (opportunités/menaces)."],
["La loi de Pareto :",["20 % des causes produisent 80 % des effets","50 % des agents font 50 % du travail","tout projet dure 20 semaines","80 % des projets échouent"],"On s'attaque d'abord aux causes principales."],
["Le diagramme de Gantt sert à…",["planifier les tâches dans le temps","chercher les causes","mesurer la satisfaction","classer les risques"],"Le calendrier du projet."],
["QQOQCP sert à…",["décrire complètement une situation","noter un agent","calculer un effectif","prescrire"],"Qui, Quoi, Où, Quand, Comment, Pourquoi."],
["Parmi ces enjeux, lequel est majeur en Polynésie française ?",["Le diabète et l'obésité","Le paludisme","La maladie de Lyme","La tuberculose bovine"],"Les maladies chroniques pèsent lourd."],
["Le RAA est…",["le rhumatisme articulaire aigu","un régime d'assurance","un réseau d'aide aux aidants","un rapport annuel d'activité"],"Il touche surtout les enfants et les jeunes."],
["La ciguatéra est…",["une intoxication par des poissons de lagon","une maladie transmise par le moustique","une infection urinaire","une carence en vitamines"],"Liée à une toxine d'algue."],
["L'éducation thérapeutique vise à…",["rendre le patient acteur de sa maladie chronique","remplacer le médecin","raccourcir les consultations","faire signer une décharge"],"Compétences d'auto-soin et d'adaptation."],
["Un patient dit utiliser du rā'au tahiti. La bonne attitude :",["l'écouter sans juger et en informer le médecin","lui interdire","l'ignorer","le noter comme non-observant"],"Sécurité (interactions) et alliance."],
["« Matahiapo » désigne…",["les personnes âgées","les nouveau-nés","les soignants","les visiteurs"],"Les anciens."],
["Une sortie bien préparée permet surtout…",["d'éviter la réhospitalisation","de gagner une chambre seule","de réduire le planning","d'éviter le dossier"],"Le parcours continue après l'hôpital."],
["Un projet imposé avec un délai irréaliste : le cadre…",["alerte sa hiérarchie avec des éléments factuels et propose un phasage","accepte sans rien dire","refuse en bloc","laisse l'équipe décider"],"Loyal et lucide à la fois."]],
c:[
{t:"Réduire les chutes",s:"Ta cadre supérieure te confie un projet : réduire les chutes dans ton unité. Par où commences-tu ?",o:[
["Tu analyses les chutes des douze derniers mois (qui, quand, où, comment), puis tu réunis un petit groupe pour fixer un objectif chiffré et des actions.",2,"Diagnostic d'abord, puis objectif SMART avec l'équipe."],
["Tu commandes tout de suite des barrières de lit pour tout le monde.",0,"Solution avant le diagnostic, et les barrières peuvent aggraver les chutes."],

{t:"Quatrième hospitalisation",s:"Un patient diabétique revient pour la quatrième fois de l'année. L'équipe soupire : « Il ne fait aucun effort. » Il dit prendre du rā'au tahiti à la place de son traitement.",o:[
["Tu proposes un temps d'échange avec lui et sa famille pour comprendre, tu associes le médecin, tu organises l'éducation thérapeutique et un relais près de chez lui.",2,"Comprendre, allier, organiser l'après : on traite la cause des retours."],
["Tu lui expliques fermement qu'il met sa vie en danger.",1,"L'information est due, mais la leçon seule a déjà échoué trois fois."],

{t:"Le projet de trop",s:"La direction te demande de lancer en un mois une nouvelle organisation des repas. Ton équipe sort de trois mois de sous-effectif.",o:[
["Tu rencontres ta hiérarchie avec des faits (effectifs, charge), tu proposes un calendrier par étapes et un test sur une partie de l'unité, puis tu présentes le projet à l'équipe avec son sens.",2,"Loyauté + lucidité + méthode."],
["Tu présentes le projet à l'équipe en disant que tu n'es pas d'accord.",0,"Désolidarisation : tu sabotes d'avance."],
["Tu lances tout en un mois sans rien dire.",1,"Loyal, mais tu risques l'échec et l'épuisement."],
["Tu ne fais rien et tu attends une relance.",0,"Ni loyal ni responsable."]]}],

{t:"Le concours et l'entretien",s:"Épreuves, méthode, projet professionnel, oral",
f:[
["Le concours d'entrée en IFCS","<ul><li>Conditions : diplôme d'une profession paramédicale listée + <b>4 ans</b> d'exercice en équivalent temps plein.</li><li><b>Admissibilité</b> : écrit anonyme de <b>4 heures</b>, noté sur 20 : commentaire d'un ou plusieurs documents sur un sujet sanitaire ou social. Il faut au moins 10.</li><li><b>Admission</b> : oral de <b>30 minutes</b> noté sur 20, à partir d'un dossier (parcours, projet professionnel) : exposé puis échange avec le jury.</li><li>Classement sur la somme des deux notes.</li><li>Les candidats d'outre-mer peuvent demander à passer les épreuves sur place.</li><li>Formation : 42 semaines, 6 modules, un mémoire.</li></ul>"],
["Le concours du Pays","<ul><li>Pour devenir <b>fonctionnaire cadre de santé</b> du Pays : concours <b>sur titres</b> avec <b>entretien</b> devant un jury.</li><li>Il faut donc <b>déjà</b> le diplôme de cadre de santé.</li><li>Le jury évalue : motivation, connaissance du statut et du système de santé local, aptitude à encadrer.</li><li>Surveille les avis sur le site de la <b>DTI</b> ; l'hôpital recrute aussi des cadres sous contrat.</li><li>Ordre logique : expérience → IFCS → diplôme → concours du Pays ou contrat.</li></ul>"],
["Méthode de l'écrit","<ul><li><b>30 min</b> : lire, surligner, dégager les idées clés.</li><li><b>30 min</b> : problématique et plan en 2 ou 3 parties.</li><li><b>2 h 30</b> : rédiger. Introduction (accroche, contexte, problématique, annonce du plan), développement argumenté, conclusion.</li><li><b>30 min</b> : relire.</li><li>Ce qu'on attend : comprendre, analyser, <b>se positionner en futur cadre</b>, écrire clairement.</li><li>Pièges : résumer le texte, réciter un cours, oublier le positionnement.</li></ul>"],
["Le projet professionnel","<ul><li><b>D'où je viens</b> : parcours, compétences, expériences marquantes.</li><li><b>Pourquoi cadre</b> : le déclencheur, les expériences de coordination, de tutorat, de projet.</li><li><b>Ma conception de la fonction</b> : mes valeurs, mon style.</li><li><b>Où je vais</b> : projet à 3–5 ans, type d'unité, envies.</li><li><b>Lucidité</b> : ce que je dois encore apprendre.</li><li>Un parcours atypique se présente comme une <b>richesse</b>, à condition d'en tirer des compétences précises.</li></ul>"],
["Réussir l'oral","<ul><li>Exposé <b>structuré et chronométré</b>, sans lire.</li><li>Méthode <b>STAR</b> pour chaque exemple : Situation, Tâche, Action, Résultat.</li><li>Écouter la question jusqu'au bout, prendre deux secondes, répondre en « je ».</li><li>Si on ne sait pas : le dire, et expliquer où l'on chercherait.</li><li>Face à la contradiction : rester calme, argumenter, savoir nuancer.</li><li>Tenue sobre, regard vers tous les membres, conclure en une phrase.</li></ul>"]],

{f:[
["La formation en IFCS en détail","<ul><li><b>42 semaines</b> en alternance : enseignements, stages et travail personnel.</li><li><b>6 modules</b> : 1. initiation à la fonction de cadre ; 2. santé publique ; 3. analyse des pratiques et initiation à la recherche ; 4. fonction d'encadrement ; 5. fonction de formation ; 6. approfondissement des fonctions d'encadrement et de formation.</li><li>Des <b>stages</b> en unité de soins, en institut de formation et parfois hors du monde sanitaire (entreprise, administration).</li><li>Un <b>mémoire</b> : une question professionnelle traitée avec une démarche de recherche.</li><li>Beaucoup d'IFCS s'associent à une université : le diplôme peut s'accompagner d'un <b>master</b>.</li><li>Financement : le plus souvent par l'employeur (promotion professionnelle), parfois à titre personnel.</li><li>Au fenua : renseigne-toi auprès de la direction des soins sur un éventuel dispositif local ou partenariat ; à défaut, la formation se fait dans un IFCS de l'Hexagone.</li></ul>"],
["Une journée de cadre","<ul><li><b>6 h 45 – 7 h 30</b> : relève, point sur la nuit, absences, lits disponibles, patients à risque.</li><li><b>8 h – 9 h</b> : tour de l'unité, présence auprès de l'équipe, vérification des points sensibles.</li><li><b>9 h</b> : point avec le médecin : entrées, sorties, examens, situations complexes.</li><li><b>Fin de matinée</b> : planning, remplacements, réponse à la cellule de gestion des lits.</li><li><b>Début d'après-midi</b> : réunions (pôle, qualité, projets), entretiens individuels.</li><li><b>Fin d'après-midi</b> : commandes, mails, tableau de bord, préparation du lendemain.</li><li>Réalité : la journée est <b>fragmentée</b> et souvent interrompue. Savoir prioriser est la compétence centrale.</li><li>Le cadre n'est pas présent la nuit et le week-end : un <b>cadre de garde</b> assure alors la continuité de l'encadrement.</li></ul>"],
["Les outils du quotidien","<ul><li><b>Fiche de poste</b> : missions, activités, liens hiérarchiques et fonctionnels.</li><li><b>Livret d'accueil</b> : organisation, horaires, contacts, procédures clés, pour les nouveaux arrivants et les étudiants.</li><li><b>Planning</b> et règles de gestion écrites.</li><li><b>Tableau de bord</b> : quelques indicateurs suivis chaque mois.</li><li><b>Compte rendu de réunion</b> : décisions, responsables, échéances.</li><li><b>Procédures et protocoles</b> : accessibles, à jour, connus.</li><li><b>Matrice d'Eisenhower</b> : classer les tâches selon l'<b>urgence</b> et l'<b>importance</b>. Urgent et important : je fais. Important non urgent : je planifie. Urgent non important : je délègue. Ni l'un ni l'autre : j'abandonne.</li><li>Encadrement des étudiants : le cadre, un <b>tuteur</b> désigné et les <b>professionnels de proximité</b>.</li></ul>"]],

{f:[
["Repères chiffrés et géographiques","<ul><li>Environ <b>279 000 habitants</b> au recensement de 2022 (ISPF). Environ 7 sur 10 vivent à Tahiti.</li><li><b>Papeete</b> est le chef-lieu ; l'aéroport international est à <b>Faa'a</b> ; le CHPF est à <b>Pirae</b>.</li><li>Fuseau horaire de Tahiti : <b>UTC−10</b>. Les Marquises sont à UTC−9 h 30, les Gambier à UTC−9.</li><li>Paris est à environ <b>16 000 km</b>, soit une vingtaine d'heures de vol.</li><li>Nuku Hiva (Marquises) est à environ 1 400 km de Tahiti, les Gambier à environ 1 600 km.</li><li>Les Îles de la Société se divisent en <b>Îles du Vent</b> (Tahiti, Moorea) et <b>Îles Sous-le-Vent</b> (Raiatea, Tahaa, Huahine, Bora Bora…).</li><li>Conséquence pour le cadre : un patient des îles peut mettre plusieurs jours pour arriver ou repartir ; la famille est souvent loin.</li></ul>"],
["Les soins dans les îles et les évacuations","<ul><li>La <b>Direction de la santé</b> gère, en plus de 4 hôpitaux, des centres médicaux, dispensaires, infirmeries et postes de soins.</li><li>Sur certains atolls, un <b>infirmier</b> ou un auxiliaire est souvent seul, appuyé à distance par un médecin.</li><li><b>Téléconsultation</b> et télé-expertise réduisent une partie des déplacements.</li><li><b>Evasan inter-îles</b> : par avion, vers Tahiti ou un hôpital de la Direction de la santé, après régulation par le <b>SAMU (15)</b> pour l'urgence.</li><li><b>Evasan hors territoire</b> : surtout vers la <b>métropole</b> ou la <b>Nouvelle-Zélande</b>, pour des soins non réalisés au fenua.</li><li>La CPS organise la prise en charge du transport et de l'hébergement selon les règles du régime.</li><li>Pour le cadre : préparer le retour comme un vrai transfert : ordonnance adaptée à ce qui est disponible sur l'île, transmission écrite, <b>contact direct avec le soignant de l'île</b>, rendez-vous de suivi.</li></ul>"],
["Langues et repères culturels utiles","<ul><li>Le <b>français</b> est la langue officielle. Le <b>reo tahiti</b> est très parlé ; on parle aussi marquisien (<b>ʻeo ʻenata</b>), <b>paumotu</b> (Tuamotu), mangarevien (Gambier) et les langues des Australes.</li><li>Quelques mots : <b>ia ora na</b> (bonjour), <b>māuruuru</b> (merci), <b>taote</b> (médecin), <b>fare</b> (maison), <b>fētiʻi</b> (famille), <b>matahiapo</b> (aîné), <b>tāvana</b> (maire).</li><li><b>Fāʻaʻamu</b> : enfant confié à d'autres membres de la famille ou à des proches. Réflexe à l'hôpital : vérifier qui détient <b>légalement l'autorité parentale</b> pour les décisions et le consentement.</li><li>La famille se mobilise nombreuse : c'est un soutien, à organiser avec un <b>interlocuteur référent</b>.</li><li>Les <b>paroisses</b> et les associations jouent un grand rôle social : de bons relais pour la prévention et l'accompagnement.</li><li>Saluer, prendre le temps, éviter le ton directif avec les anciens : la relation conditionne la confiance.</li></ul>"]],

/* ---------- 2. CHPF et fonction publique ---------- */
{f:[
["La carrière du fonctionnaire","<ul><li><b>Concours</b> → inscription sur une <b>liste d'aptitude</b>, de durée limitée.</li><li><b>Nomination stagiaire</b> → <b>stage</b> d'un an en principe, prolongeable selon le statut particulier.</li><li>À la fin : <b>titularisation</b>, ou prolongation, ou licenciement pour insuffisance professionnelle après avis de la <b>CAP</b>.</li><li><b>Évaluation</b> : chaque année, une note et une appréciation générale (art. 76), communiquées à l'agent.</li><li><b>Avancement</b> d'échelon (ancienneté, valeur professionnelle) et de grade.</li><li><b>Positions</b> : activité ; <b>détachement</b> (on garde ses droits à l'avancement et à la retraite dans son corps d'origine) ; <b>disponibilité</b> (on ne les garde pas) ; congé parental.</li><li><b>Mutation</b> : changement d'affectation, avec avis de la CAP selon les cas.</li><li>Le cadre participe directement à cette carrière : ses évaluations écrites servent aux décisions de titularisation et d'avancement.</li></ul>"],
["Les instances hospitalières","<ul><li><b>Au CHPF</b> : conseil d'administration, direction générale, <b>CME</b>, comité technique paritaire, direction des soins. Vérifie la liste à jour sur le site et dans le règlement intérieur.</li><li><b>En métropole</b> (repère utile pour l'oral IFCS) : <b>conseil de surveillance</b> (orientations, contrôle) ; <b>directoire</b> (pilotage, présidé par le directeur) ; <b>CME</b> (médecins) ; <b>CSIRMT</b> (commission des soins infirmiers, de rééducation et médico-techniques) ; <b>CSE</b> (comité social d'établissement, qui a remplacé le CTE et le CHSCT) ; <b>CDU</b> (commission des usagers : plaintes, droits des patients).</li><li>Le cadre peut être élu ou membre de certaines instances ; il en relaie les décisions à l'équipe.</li><li>À l'oral : ne pas confondre les instances de métropole et celles du Pays. Dire « en métropole… ; au CHPF… ».</li></ul>"],
["Accident, maladie, absence : le rôle du cadre","<ul><li><b>Accident de service</b> (ou accident du travail) : faire soigner l'agent, recueillir les faits et les témoins, faire la déclaration <b>sans délai</b> selon la procédure de l'établissement, rédiger un rapport circonstancié.</li><li><b>Accident d'exposition au sang</b> : appliquer immédiatement le protocole AES et orienter vers le médecin référent.</li><li><b>Arrêt maladie</b> : l'agent transmet son arrêt selon la procédure ; le <b>diagnostic ne regarde pas le cadre</b>, qui ne le demande pas.</li><li>Le contrôle des arrêts relève de l'administration, pas du cadre.</li><li><b>Retour</b> : entretien d'accueil, information sur les changements, lien avec la <b>médecine du travail</b> si besoin (visite, aménagement de poste).</li><li>Absences répétées : on analyse des faits et l'organisation, on ne fait pas d'enquête sur la santé de l'agent.</li></ul>"]],
