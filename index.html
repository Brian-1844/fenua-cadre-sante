/* ---------- 3. Droit ---------- */
{f:[
["Les quatre responsabilités","<ul><li><b>Administrative (ou civile)</b> : réparer un dommage. À l'hôpital public, pour une <b>faute de service</b>, c'est l'établissement qui indemnise, devant le juge administratif.</li><li><b>Pénale</b> : sanctionner une infraction. Elle est <b>personnelle</b> : blessures ou homicide involontaires, mise en danger d'autrui, non-assistance à personne en danger, violation du secret.</li><li><b>Disciplinaire</b> : sanction par l'employeur pour manquement aux obligations professionnelles.</li><li><b>Ordinale</b> : pour les professions dotées d'un ordre, devant ses instances.</li><li>Une même faute peut engager plusieurs responsabilités à la fois.</li><li>Pour le cadre : une <b>faute d'organisation</b> (effectif insuffisant non signalé, matériel défaillant connu) peut engager la responsabilité de l'établissement, et parfois la sienne.</li><li><b>Glissement de tâches</b> : faire réaliser un acte par un professionnel qui n'en a pas la compétence légale est interdit, même « pour dépanner ».</li><li>Ce qui protège : signaler par écrit, tracer, respecter les compétences de chacun.</li></ul>"],
["Secret professionnel et partage d'informations","<ul><li>La violation du secret est un délit (article <b>226-13 du code pénal</b>, applicable au fenua).</li><li>Il couvre tout ce qui est appris, vu, entendu, compris dans l'exercice.</li><li><b>Secret partagé</b> : les membres de l'équipe de soins échangent ce qui est <b>nécessaire</b> à la prise en charge, pas davantage.</li><li><b>Famille</b> : on n'informe qu'avec l'accord du patient, sauf exceptions prévues par les textes. La personne de confiance a un rôle particulier.</li><li><b>Téléphone</b> : aucune information médicale à un interlocuteur non identifié.</li><li><b>Réseaux sociaux, photos</b> : interdits dès qu'un patient peut être reconnu, même indirectement.</li><li><b>Exceptions</b> prévues par la loi : signalement de maltraitance d'un mineur ou d'une personne vulnérable, déclarations obligatoires, certificats.</li><li>Le cadre garantit l'organisation : écrans verrouillés, dossiers rangés, transmissions hors des couloirs.</li></ul>"],
["Contester une décision : recours et délais","<ul><li><b>Recours administratif</b> : <b>gracieux</b> (auprès de l'auteur de la décision) ou <b>hiérarchique</b> (auprès de son supérieur).</li><li><b>Recours contentieux</b> : devant le <b>tribunal administratif de la Polynésie française</b>, en règle générale dans un délai de <b>2 mois</b> à compter de la notification.</li><li>Le délai ne court que si la décision mentionne les <b>voies et délais de recours</b>.</li><li>Un recours administratif formé dans le délai le prolonge.</li><li><b>Référé</b> : procédure d'urgence pour suspendre une décision.</li><li>Appel des jugements du tribunal administratif : la <b>cour administrative d'appel de Paris</b>. Contrôle des lois du pays : le <b>Conseil d'État</b>.</li><li>Pour le cadre : une décision bien <b>motivée</b>, fondée sur des faits et notifiée régulièrement résiste au recours. Un rapport factuel est la meilleure protection de tous.</li></ul>"]],
q:[
["Pour une faute de service à l'hôpital public, qui indemnise la victime ?",["L'établissement","Le soignant personnellement","Le cadre","La famille"],"Devant le juge administratif."],
["La responsabilité pénale est…",["personnelle","collective","toujours celle de l'établissement","réservée aux médecins"],"On ne peut pas être condamné pénalement à la place d'un autre."],
["Une même faute peut-elle engager plusieurs responsabilités ?",["Oui : pénale, disciplinaire et administrative à la fois","Non, une seule","Seulement si le patient décède","Seulement pour les médecins"],"Les procédures sont indépendantes."],
["Un effectif insuffisant connu et non signalé peut constituer…",["une faute d'organisation","un simple aléa","une faute du patient","rien de juridique"],"D'où l'importance du signalement écrit."],
["Le glissement de tâches, c'est…",["faire réaliser un acte par quelqu'un qui n'en a pas la compétence légale","déléguer une tâche autorisée","changer d'horaire","faire une formation"],"Interdit, même pour dépanner."],
["Quel article du code pénal réprime la violation du secret professionnel ?",["226-13","40","121-3","L. 4311-1"],"Applicable en Polynésie française."],
["Le secret partagé permet d'échanger…",["ce qui est nécessaire à la prise en charge, au sein de l'équipe de soins","tout le dossier à tous les agents","les informations avec les voisins","les informations avec l'employeur du patient"],"Nécessaire et pas davantage."],
["Un appel : « Je suis son cousin, comment va-t-il ? » Vous…",["ne donnez aucune information médicale sans accord du patient","donnez le diagnostic","donnez le numéro de chambre et le diagnostic","raccrochez sans rien dire"],"On peut proposer de transmettre le message au patient."],
["Une photo de l'équipe où un patient est reconnaissable, publiée sur Facebook :",["une violation du secret et de l'image du patient","une bonne communication","autorisée si le visage est flou","autorisée si l'équipe est d'accord"],"Même une identification indirecte suffit."],
["Le secret peut être levé par la loi notamment pour…",["signaler une maltraitance sur mineur ou personne vulnérable","répondre à un journaliste","informer l'employeur du patient","satisfaire la curiosité d'un collègue"],"Exceptions limitées et prévues par les textes."],
["Le recours gracieux s'adresse…",["à l'auteur de la décision","au supérieur de l'auteur","au tribunal","au syndicat"],"Le recours hiérarchique va au supérieur."],
["Délai de recours contentieux en règle générale :",["2 mois","15 jours","1 an","5 ans"],"À compter de la notification."],
["Le délai de recours ne court que si la décision mentionne…",["les voies et délais de recours","le nom du cadre","l'heure de signature","le numéro de téléphone"],"Sinon, le délai ne peut être opposé."],
["Quelle juridiction juge en appel les décisions du tribunal administratif de la Polynésie française ?",["La cour administrative d'appel de Paris","La cour d'appel de Papeete","Le Conseil constitutionnel","La Cour de cassation"],"Le Conseil d'État contrôle les lois du pays."],
["Le référé sert à…",["obtenir une décision rapide en cas d'urgence","faire appel","sanctionner un agent","annuler un concours après 5 ans"],"Par exemple suspendre une décision."]]},

/* ---------- 4. Manager ---------- */
{f:[
["Animer une réunion d'équipe","<ul><li><b>Avant</b> : un objectif clair, un ordre du jour envoyé à l'avance, une durée fixée, un horaire compatible avec les soins (souvent au chevauchement des équipes).</li><li><b>Pendant</b> : rappeler l'objectif, distribuer la parole, recadrer les digressions, faire respecter le temps, reformuler les décisions.</li><li>Distinguer : réunion d'<b>information</b> (descendante), de <b>consultation</b> (on recueille les avis), de <b>décision</b> (on tranche ensemble), de <b>résolution de problème</b>.</li><li>Rôles possibles : animateur, secrétaire, gardien du temps.</li><li><b>Après</b> : compte rendu court sous 48 h (décisions, qui fait quoi, échéance), affiché ou envoyé à ceux qui étaient absents, en particulier l'équipe de nuit.</li><li>Une réunion sans décision ni suite démotive. Une réunion courte et utile se respecte.</li></ul>"],
["Les entretiens du cadre","<ul><li><b>Recrutement</b> : fiche de poste en main, questions identiques pour tous les candidats, exemples concrets demandés.</li><li><b>Accueil</b> : le premier jour, par le cadre lui-même.</li><li><b>Annuel</b> : bilan, objectifs, formation, projet.</li><li><b>Recadrage</b> : rapide après les faits, en privé, factuel (méthode DESC), avec un engagement et un suivi.</li><li><b>Retour d'absence</b> : accueil et information, pas un interrogatoire.</li><li><b>Fin de stage ou de période d'essai</b> : bilan argumenté, objectifs atteints ou non.</li><li>Structure commune : <b>préparer</b> (faits, documents, objectif), <b>accueillir</b> (lieu calme, temps protégé), annoncer l'<b>objet</b>, <b>écouter</b>, <b>conclure</b> (ce qu'on retient, ce qui suit), <b>tracer</b>.</li><li>Un témoin ou un tiers peut être proposé dans un entretien difficile.</li></ul>"],
["Feedback et communication non violente","<ul><li><b>Feedback positif</b> : précis, sincère, rapide. « Ta transmission sur le patient de la 12 a permis d'éviter une erreur » vaut mieux que « Bon travail ».</li><li><b>Feedback correctif</b> : sur un comportement observable, jamais sur la personne. Il se fait en privé et propose une piste.</li><li><b>Communication non violente</b> (Marshall Rosenberg), méthode <b>OSBD</b> : <b>O</b>bservation des faits sans jugement, <b>S</b>entiment, <b>B</b>esoin, <b>D</b>emande concrète et réalisable.</li><li>Exemple : « Trois fois cette semaine, la relève a commencé à 7 h 15 (O). Je suis inquiet (S) car j'ai besoin que l'équipe de nuit puisse partir à l'heure et que les informations passent (B). Peux-tu arriver à 6 h 55 à partir de demain ? (D) »</li><li>Écouter les émotions sans s'y noyer ; distinguer le fait de l'interprétation.</li><li>Le « sandwich » (positif, négatif, positif) brouille souvent le message : mieux vaut être clair et respectueux.</li></ul>"]],
q:[
["Premier élément de préparation d'une réunion :",["un objectif clair","le café","la liste des absents","un diaporama"],"Puis ordre du jour, durée, horaire."],
["Le meilleur moment pour une réunion d'équipe soignante est souvent…",["au chevauchement des équipes","en pleine distribution des repas","à 3 heures du matin","pendant les visites"],"Pour toucher le plus de monde sans gêner les soins."],
["Une réunion de consultation sert à…",["recueillir les avis avant une décision","annoncer une décision déjà prise","sanctionner","faire un cours"],"La réunion d'information est descendante."],
["Le compte rendu de réunion doit contenir…",["les décisions, les responsables et les échéances","toutes les paroles de chacun","seulement la date","les noms des retardataires"],"Court et utile."],
["À qui faut-il absolument transmettre le compte rendu ?",["aux absents, notamment l'équipe de nuit","à la presse","aux patients","à personne"],"Sinon, deux équipes, deux vérités."],
["En entretien de recrutement, une bonne pratique :",["poser les mêmes questions à tous les candidats","improviser selon la sympathie","parler surtout de soi","éviter la fiche de poste"],"Équité et comparaison possible."],
["L'entretien de retour après absence n'est pas…",["un interrogatoire sur la santé de l'agent","un accueil","une information sur les changements","un moment d'écoute"],"Le diagnostic reste secret."],
["Dernière étape de tout entretien :",["tracer ce qui a été dit et décidé","oublier","en parler à l'équipe","envoyer un SMS"],"La trace protège l'agent et le cadre."],
["Dans un entretien difficile, le cadre peut…",["proposer la présence d'un tiers","enregistrer à l'insu de l'agent","faire venir toute l'équipe","refuser d'écouter"],"Par exemple le cadre supérieur."],
["Un feedback positif efficace est…",["précis, sincère et rapide","général et rare","public et ironique","réservé à l'entretien annuel"],"Il dit exactement ce qui a été bien fait."],
["Un feedback correctif porte sur…",["un comportement observable","la personnalité de l'agent","sa vie privée","son origine"],"Jamais sur la personne."],
["Qui a créé la communication non violente ?",["Marshall Rosenberg","Abraham Maslow","Kurt Lewin","Henry Mintzberg"],"Méthode OSBD."],
["OSBD signifie…",["Observation, Sentiment, Besoin, Demande","Objectif, Stratégie, Budget, Délai","Organisation, Sécurité, Bilan, Décision","Ordre, Sanction, Blâme, Dialogue"],"Quatre étapes."],
["« Tu es toujours en retard » est…",["un jugement, pas une observation","une observation neutre","une demande","un besoin"],"L'observation serait : « trois retards cette semaine »."],
["La méthode du « sandwich » a pour risque…",["de brouiller le message principal","d'être trop claire","d'humilier","d'être illégale"],"Le message négatif se perd entre deux compliments."]]},

/* ---------- 5. Organisation ---------- */
{f:[
["Calculer les indicateurs de l'unité","<ul><li><b>Taux d'occupation</b> = journées réalisées ÷ journées possibles (lits × jours) × 100. Exemple : 30 lits en novembre (30 jours), 810 journées réalisées : 810 ÷ 900 = <b>90 %</b>.</li><li><b>Durée moyenne de séjour (DMS)</b> = journées réalisées ÷ nombre de séjours. Exemple : 810 ÷ 135 séjours = <b>6 jours</b>.</li><li><b>Taux d'absentéisme</b> = heures d'absence ÷ heures théoriques × 100. Exemple : 20 agents × 169 h par mois (39 h × 52 ÷ 12) = 3 380 h ; 270 h d'absence : 270 ÷ 3 380 ≈ <b>8 %</b>.</li><li><b>ETP</b> (équivalent temps plein) : un agent à 80 % compte pour 0,8 ETP.</li><li>Un poste tenu 24 h/24 toute l'année demande <b>plusieurs ETP</b> (souvent 5 à 6 selon le temps de travail annuel, les congés et l'absentéisme).</li><li>Comparer un indicateur à lui-même dans le temps, puis à des unités semblables ; chercher la cause avant d'agir.</li></ul>"],
["Organiser le travail des soignants","<ul><li><b>Soins en série</b> (par tâches) : une personne fait les pansements, une autre les toilettes. Rapide en apparence, mais fragmente la prise en charge et dilue la responsabilité.</li><li><b>Sectorisation</b> (soins intégrés) : un binôme infirmier–aide-soignant prend en charge un groupe de patients du début à la fin du poste. Meilleure connaissance du patient, responsabilité claire.</li><li><b>Postes de 12 h</b> : moins de relèves et plus de jours de repos ; mais fatigue, risque d'erreur en fin de poste, difficultés pour les agents avec des enfants.</li><li><b>Postes de 7 h 30 à 8 h</b> : plus de relèves, moins de fatigue par poste.</li><li><b>Roulement</b> fixe (cycle connu à l'avance) ou variable : la prévisibilité est un facteur majeur de satisfaction.</li><li>Tout changement d'organisation du travail se prépare avec l'équipe et passe par les instances compétentes (comité technique).</li></ul>"],
["Stress et risques psychosociaux : les modèles","<ul><li><b>Karasek</b> : trois dimensions : <b>demande psychologique</b>, <b>latitude décisionnelle</b>, <b>soutien social</b>. La situation la plus à risque (« job strain ») : forte demande et faible latitude ; l'isolement aggrave encore.</li><li><b>Siegrist</b> : déséquilibre entre <b>efforts</b> fournis et <b>récompenses</b> reçues (salaire, estime, perspectives).</li><li><b>Burn-out</b> : épuisement émotionnel, dépersonnalisation (distance, cynisme), perte d'accomplissement (Maslach).</li><li>Prévention <b>primaire</b> : agir sur les causes (organisation, charge, effectifs). <b>Secondaire</b> : aider les agents à faire face (formation, groupes de parole). <b>Tertiaire</b> : prendre en charge ceux qui vont mal (médecine du travail, psychologue, reprise accompagnée).</li><li>Leviers du cadre : donner de la marge de manœuvre, être disponible, reconnaître, réguler la charge, signaler quand les moyens manquent.</li></ul>"]],
q:[
["30 lits, 30 jours, 810 journées réalisées. Taux d'occupation ?",["90 %","81 %","100 %","27 %"],"810 ÷ (30 × 30) = 0,9."],
["810 journées pour 135 séjours. DMS ?",["6 jours","5 jours","8 jours","13,5 jours"],"810 ÷ 135 = 6."],
["Heures mensuelles d'un agent à 39 h par semaine :",["169 h","151,67 h","156 h","180 h"],"39 × 52 ÷ 12 = 169."],
["3 380 heures théoriques, 270 heures d'absence. Taux d'absentéisme ?",["environ 8 %","environ 3 %","environ 12 %","environ 27 %"],"270 ÷ 3 380 ≈ 0,08."],
["Un agent à 80 % représente…",["0,8 ETP","1 ETP","0,5 ETP","8 ETP"],"Équivalent temps plein."],
["Un poste tenu 24 h/24 toute l'année demande…",["plusieurs ETP, souvent 5 à 6","1 ETP","2 ETP","20 ETP"],"Congés, repos et absences compris."],
["La sectorisation consiste à…",["confier un groupe de patients à un binôme pour tout le poste","faire tous les pansements à la suite","changer de service chaque jour","supprimer les relèves"],"On parle aussi de soins intégrés."],
["Principal risque des soins en série :",["une prise en charge fragmentée et une responsabilité diluée","trop de temps auprès du patient","trop de relèves","un coût trop élevé"],"Personne n'a la vue d'ensemble du patient."],
["Avantage des postes de 12 h :",["moins de relèves et plus de jours de repos","moins de fatigue","aucun risque d'erreur","plus de réunions"],"Avec un risque de fatigue en fin de poste."],
["Un changement d'organisation du travail passe par…",["l'équipe et les instances compétentes","la seule décision du cadre","un vote des patients","rien de particulier"],"Le comité technique est consulté."],
["Les trois dimensions du modèle de Karasek :",["demande psychologique, latitude décisionnelle, soutien social","salaire, statut, sécurité","efforts, récompenses, estime","dégel, changement, regel"],"Le modèle de Siegrist parle d'efforts et de récompenses."],
["La situation la plus à risque selon Karasek :",["forte demande et faible latitude","faible demande et forte latitude","forte demande et forte latitude","faible demande et faible latitude"],"Le « job strain »."],
["Le modèle de Siegrist décrit un déséquilibre entre…",["efforts et récompenses","demande et latitude","jour et nuit","théorie et pratique"],"Les récompenses incluent l'estime."],
["La prévention primaire des risques psychosociaux agit sur…",["les causes : organisation, charge, effectifs","les agents déjà malades","la seule formation à la gestion du stress","les sanctions"],"Secondaire : aider à faire face ; tertiaire : réparer."],
["Les trois dimensions du burn-out (Maslach) :",["épuisement émotionnel, dépersonnalisation, perte d'accomplissement","fatigue, faim, soif","colère, peur, tristesse","absence, retard, erreur"],"La dépersonnalisation se manifeste par la distance et le cynisme."]]},

/* ---------- 6. Qualité ---------- */
{f:[
["Hygiène : précautions standard et complémentaires","<ul><li><b>Friction hydroalcoolique</b> : la méthode de référence pour l'hygiène des mains, sur des mains sans bijou, ongles courts, avant-bras dégagés.</li><li><b>5 indications de l'OMS</b> : avant le contact patient ; avant un geste aseptique ; après un risque d'exposition à un liquide biologique ; après le contact patient ; après le contact avec l'environnement du patient.</li><li>Précautions standard : gants si risque de contact avec un liquide biologique, tenue protectrice, masque et lunettes si risque de projection, gestion sûre des déchets et des objets piquants.</li><li><b>Accident d'exposition au sang</b> : ne pas faire saigner, laver à l'eau et au savon, rincer, désinfecter (au moins 5 minutes), puis consulter le <b>médecin référent rapidement</b>, idéalement dans les 4 heures.</li><li>Précautions complémentaires <b>contact</b> (bactéries multirésistantes) ; pour <i>Clostridioides difficile</i>, lavage au savon puis friction, car l'alcool n'agit pas sur les spores.</li><li><b>Gouttelettes</b> (grippe) : masque chirurgical. <b>Air</b> (tuberculose, rougeole) : appareil de protection respiratoire FFP2.</li><li>Le cadre s'appuie sur l'équipe opérationnelle d'hygiène et fait auditer les pratiques.</li></ul>"],
["Le circuit du médicament","<ul><li>Quatre étapes : <b>prescription</b> (écrite, datée, signée, patient identifié) → <b>dispensation</b> (pharmacie : analyse, préparation, délivrance) → <b>administration</b> (infirmier : règle des 5 B, traçabilité en temps réel) → <b>surveillance</b> (effets, efficacité).</li><li>Médicaments <b>à haut risque</b> : anticoagulants, insulines, chlorure de potassium injectable, chimiothérapies, morphiniques. Double vérification recommandée.</li><li><b>Stupéfiants</b> : coffre fermé, accès restreint, registre et traçabilité de chaque mouvement.</li><li>Rangement : armoire organisée, contrôle des <b>péremptions</b>, <b>chaîne du froid</b> surveillée.</li><li><b>Interruptions de tâche</b> pendant la préparation : une cause majeure d'erreurs (chasuble ou zone protégée).</li><li>Toute erreur ou presque-erreur se <b>déclare</b> ; le cadre organise son analyse avec la pharmacie.</li></ul>"],
["Douleur, fin de vie et éthique","<ul><li>Évaluer la douleur, c'est la mesurer : <b>EN</b> (échelle numérique de 0 à 10), <b>EVA</b> (échelle visuelle analogique), <b>EVS</b> (échelle verbale simple) ; <b>Algoplus</b> pour la personne âgée qui ne peut pas communiquer.</li><li>Évaluer, traiter, <b>réévaluer</b>, tracer.</li><li><b>Démarche palliative</b> : soulager, accompagner le patient et ses proches, sans acharnement ni abandon.</li><li><b>Directives anticipées</b> et <b>personne de confiance</b> : recueillir la volonté du patient avant qu'il ne puisse plus l'exprimer.</li><li>En France, la loi Claeys-Leonetti (2016) encadre la fin de vie : refus de l'obstination déraisonnable, procédure <b>collégiale</b>. Vérifie les textes applicables au fenua.</li><li>Quatre principes éthiques (Beauchamp et Childress) : <b>autonomie</b>, <b>bienfaisance</b>, <b>non-malfaisance</b>, <b>justice</b>.</li><li>Le cadre organise des temps de parole et de réflexion éthique pour l'équipe après les situations difficiles.</li></ul>"]],
q:[
["La méthode de référence pour l'hygiène des mains :",["la friction hydroalcoolique","le lavage à l'eau seule","le port de gants permanent","l'essuyage"],"Sauf exceptions comme les spores."],
["Combien d'indications d'hygiène des mains selon l'OMS ?",["5","3","7","10"],"Avant et après le contact patient, avant un geste aseptique, après un risque d'exposition, après contact avec l'environnement."],
["Après un accident d'exposition au sang, il ne faut pas…",["faire saigner la plaie","laver à l'eau et au savon","désinfecter","consulter le médecin référent"],"Faire saigner peut aggraver la lésion."],
["Après un AES, la consultation du médecin référent se fait…",["rapidement, idéalement dans les 4 heures","dans la semaine","au prochain entretien annuel","seulement si le patient est connu infecté"],"Un traitement préventif peut être nécessaire."],
["Pour Clostridioides difficile, on se lave les mains…",["au savon puis friction, car l'alcool n'agit pas sur les spores","avec la seule friction","à l'eau seule","on ne se lave pas"],"Précautions complémentaires contact."],
["La tuberculose pulmonaire relève des précautions…",["air, avec un masque FFP2","gouttelettes, avec un masque chirurgical","contact uniquement","standard uniquement"],"La rougeole aussi."],
["Ordre du circuit du médicament :",["prescription, dispensation, administration, surveillance","administration, prescription, dispensation, surveillance","dispensation, prescription, surveillance, administration","surveillance, administration, prescription, dispensation"],"Chaque étape a ses risques."],
["La dispensation est réalisée par…",["la pharmacie","l'infirmier","le médecin","le cadre"],"Analyse, préparation, délivrance."],
["Exemple de médicament à haut risque :",["le chlorure de potassium injectable","le paracétamol oral à dose usuelle","le sérum physiologique pour rincer","une crème hydratante"],"Avec anticoagulants, insulines, chimiothérapies."],
["Les stupéfiants se conservent…",["dans un coffre fermé, avec registre et traçabilité","dans le chariot","dans le vestiaire","dans la chambre du patient"],"Chaque mouvement est tracé."],
["Une cause majeure d'erreur lors de la préparation des médicaments :",["les interruptions de tâche","la lumière naturelle","le port de la blouse","la lecture de l'ordonnance"],"D'où les zones protégées."],
["L'échelle Algoplus sert à évaluer…",["la douleur chez la personne âgée non communicante","la dépendance","la dénutrition","le risque de chute"],"Observation de 5 items."],

["Quand l'équipe ne tient plus","<p>On a longtemps cru que les soignants partaient pour de meilleurs salaires. Les entretiens de départ racontent autre chose. Ceux qui quittent l'hôpital parlent d'abord de plannings modifiés la veille, de congés refusés sans explication, de nuits faites à deux là où il en faudrait trois. Ils parlent ensuite de ce qu'ils ne peuvent plus faire : s'asseoir cinq minutes auprès d'un patient inquiet, transmettre correctement, former l'étudiant qui les suit.</p><p>Le salaire compte, bien sûr. Mais il ne retient personne dans un service où l'on a le sentiment de mal travailler. À l'inverse, certaines unités gardent leurs équipes malgré une charge comparable. On y trouve presque toujours les mêmes ingrédients : un planning prévisible, un encadrement présent, des décisions expliquées, et la possibilité de dire qu'une organisation ne fonctionne pas sans passer pour un râleur.</p><p>Le cadre de proximité ne fixe ni les effectifs ni les grilles de rémunération. Il serait injuste de lui faire porter la fidélisation à lui seul. Il serait tout aussi faux de dire qu'il n'y peut rien : c'est lui qui rend le travail tenable ou non, jour après jour. Entre ce qu'il doit obtenir de sa hiérarchie et ce qu'il doit à son équipe, sa marge est étroite. C'est pourtant là que se joue une grande part de l'attractivité d'un hôpital.</p>"],
["L'hôpital au bout de l'archipel","<p>Dans un territoire d'îles, l'hôpital de référence n'est jamais seulement un hôpital. Il est le dernier recours de patients venus de très loin, qui ont laissé derrière eux leur famille, leur travail, parfois leur langue. Leur séjour ne commence pas aux urgences et ne s'achève pas à la sortie : il commence dans un dispensaire, se poursuit dans un avion, et se termine des semaines plus tard, quand un infirmier isolé reprend le suivi avec les moyens dont il dispose.</p><p>Cette géographie a un coût. Un lit occupé quelques jours de plus faute de vol retour est un lit qui manque à un autre. Une consigne de sortie mal comprise devient une réhospitalisation. Une maladie chronique mal équilibrée, à mille kilomètres de tout spécialiste, finit en évacuation d'urgence.</p><p>On peut y voir une fatalité. On peut aussi y voir une raison d'organiser les soins autrement : préparer la sortie dès l'entrée, parler au soignant de l'île avant le départ du patient, utiliser la télémédecine pour ce qu'elle sait faire, et considérer chaque hospitalisation comme une occasion d'éducation. Aucune de ces idées n'est nouvelle. Ce qui manque le plus souvent n'est pas la technique, mais quelqu'un qui, dans chaque unité, tienne le fil du parcours.</p>"]];

function simu(done,back){const st={sec:70,eq:60,flux:60,hier:60,leg:100,bud:100},fl={},log=[],D=dif(),mult=D===2?1.5:D===1?1.25:1,tmax=D===2?40:D===1?75:0;let i=0;
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const bars=()=>D===2?`<p class="mut">Mode expert : indicateurs masqués jusqu'au bilan.</p>`:Object.keys(IND).map(k=>`<div style="display:flex;gap:8px;align-items:center;font-size:13px"><span style="flex:0 0 150px">${IND[k]}</span><div class="bar" style="flex:1;margin:3px 0"><i style="width:${st[k]}%;background:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}"></i></div></div>`).join("");
  app.innerHTML=hdr("Une semaine de cadre")+`<div class="card fiche"><h2 style="margin-top:0">Tu prends l'unité lundi matin</h2><p>Médecine, 28 lits, 8 infirmières, 10 aides-soignantes. Tu vas vivre une semaine. <b>Chaque décision change la suite</b> : certaines situations n'arrivent que parce que tu as choisi quelque chose avant.</p><ul><li>Six indicateurs : ${Object.values(IND).join(", ").toLowerCase()}.</li><li>Niveau : <b>${DIFF[D]}</b>${tmax?` · ${tmax} secondes par décision, sinon la situation décide pour toi`:""}${D>=1?" · explications seulement au bilan":""}.</li><li>Change le niveau dans Profil.</li></ul><button class="btn" id="go">Commencer lundi</button></div>`;
  bindBack(back);document.getElementById("go").onclick=next;
  function next(){halt();while(i<EV.length&&EV[i].when&&!EV[i].when(fl))i++;if(i>=EV.length)return bilan();const E=EV[i],o=shuf(E.o.map((x,k)=>[x,k]));window.scrollTo(0,0);
    app.innerHTML=hdr(E.j)+`<div class="card">${bars()}</div><div class="card"><h2 style="margin-top:0">${E.t}</h2><p>${E.s}</p>${tmax?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0][0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const opt=j<0?["Aucune décision prise à temps.",{sec:-10,hier:-10,eq:-5},[],"Ne pas décider est une décision : la situation s'est dégradée sans toi."]:o[j][0];
      Object.entries(opt[1]).forEach(([k,v])=>st[k]=clamp(st[k]+(v<0?v*mult:v)));opt[2].forEach(f=>fl[f]=1);
      const best=Math.max(...E.o.map(x=>Object.values(x[1]).reduce((s,v)=>s+v,0)));const mine=Object.values(opt[1]).reduce((s,v)=>s+v,0);
      log.push({j:E.j,t:E.t,c:opt[0],fb:opt[3],ok:mine>=best});i++;
      if(D===0){app.querySelectorAll(".opt").forEach(b=>b.disabled=true);if(j>=0)app.querySelectorAll(".opt")[j].classList.add(mine>=best?"good":"bad");document.getElementById("fb").innerHTML=`<div class="fb">${opt[3]}</div><button class="btn" id="nx">Continuer</button>`;document.getElementById("nx").onclick=next}else next()};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));
    if(tmax)count(tmax,document.getElementById("tmr"),()=>pick(-1))}
  function bilan(){window.scrollTo(0,0);const w={sec:3,leg:2,eq:2,hier:1.5,flux:1.5,bud:1},tot=Object.keys(w).reduce((s,k)=>s+st[k]*w[k],0)/Object.values(w).reduce((s,v)=>s+v,0);
    let sc=Math.round(tot);if(st.sec<40||st.leg<50)sc=Math.min(sc,45);
    const nb=log.filter(x=>x.ok).length,grade=sc>=85?"Cadre confirmé":sc>=70?"Cadre solide":sc>=55?"Cadre en construction":"Unité en difficulté";
    const chains=[];if(fl.teva||fl.nuit)chains.push("Ta décision de lundi 5 h 40 (fatigue d'une infirmière) a provoqué l'erreur d'insuline de mardi.");if(fl.lits2)chains.push("Les deux lits acceptés sans conditions lundi ont conduit à la chute de mercredi.");if(fl.juillet)chains.push("Les quatre congés accordés lundi ont créé le trou de juillet relevé vendredi.");if(fl.flou)chains.push("La décision repoussée sur les congés a fini en arrêt et en conflit.");if(fl.greveKO||fl.abus)chains.push("La gestion du préavis de mardi a déterminé ta journée de grève.");if(fl.epuise||fl.surcharge)chains.push("Les dépannages répétés ont mené à l'épuisement d'une infirmière vendredi.");if(fl.cache)chains.push("Un événement non déclaré : en réalité, cela engage ta responsabilité.");
    app.innerHTML=hdr("Bilan de la semaine")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2><p><b>${grade}</b> · ${nb} meilleures décisions sur ${log.length}</p></div><div class="card">${Object.keys(IND).map(k=>`<p style="display:flex;justify-content:space-between;margin:4px 0"><span>${IND[k]}</span><b style="color:${st[k]<40?"var(--ko)":st[k]<60?"var(--gold)":"var(--ok)"}">${st[k]}</b></p>`).join("")}</div>${chains.length?`<div class="card warn"><h3>L'effet domino</h3><ul class="mut" style="padding-left:18px">${chains.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}<h2>Tes décisions</h2>${log.map(x=>`<details class="card"><summary>${x.ok?"✓":"✗"} <b>${x.j}</b> · ${x.t}</summary><p><b>Ton choix :</b> ${x.c}</p><div class="fb">${x.fb}</div></details>`).join("")}<button class="btn" id="ok">Terminer</button>`;

function dilem(done,back){let i=0,pts=0;const items=shuf(DIL).slice(0,dif()>=1?10:6),hard=dif()>=1;const recap=[];
  (function show(){const C=items[i],o=shuf(C.o);window.scrollTo(0,0);
    app.innerHTML=hdr(`Dilemme ${i+1}/${items.length}`)+`<div class="card"><h2 style="margin-top:0">${C.t}</h2><p>${C.s}</p>${dif()>=2?`<div class="timer" id="tmr"></div>`:""}${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
    bindBack(back);
    const pick=j=>{halt();const x=j<0?["(pas de décision)",0,"La situation évolue sans toi.","Le problème s'aggrave."]:o[j];pts+=x[1];recap.push([C.t,x]);
      if(hard){i++;return i<items.length?show():fin()}
      app.querySelectorAll(".opt").forEach((b,m)=>{b.disabled=true;{const c=o[m][1]===2?"good":o[m][1]===0?"bad":"";if(c)b.classList.add(c)}});
      document.getElementById("fb").innerHTML=`<div class="fb"><b>À court terme :</b> ${x[2]}<br><b>À long terme :</b> ${x[3]}</div>${x[1]<2?`<div class="fb" style="border-color:var(--ok)"><b>Meilleure option :</b> ${C.o.find(y=>y[1]===2)[0]}</div>`:""}<button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<items.length?show():fin()}};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));if(dif()>=2)count(45,document.getElementById("tmr"),()=>pick(-1))})();
  function fin(){const sc=Math.round(pts/(items.length*2)*100);if(!hard)return done(sc);window.scrollTo(0,0);
    app.innerHTML=hdr("Bilan des dilemmes")+`<div class="card" style="text-align:center"><h2>${sc}/100</h2></div>`+recap.map(([t,x])=>`<details class="card"><summary>${x[1]===2?"✓":x[1]===1?"≈":"✗"} <b>${t}</b></summary><p><b>Ton choix :</b> ${x[0]}</p><div class="fb"><b>Court terme :</b> ${x[2]}<br><b>Long terme :</b> ${x[3]}</div></details>`).join("")+`<button class="btn" id="ok">Terminer</button>`;
    bindBack(back);document.getElementById("ok").onclick=()=>done(sc)}}

{t:"Découvrir les ressources humaines",s:"À quoi servent les RH, qui fait quoi, les mots du métier",
f:[
["À quoi servent les RH ?","<ul><li>Une organisation a besoin de <b>personnes</b> pour fonctionner. Les ressources humaines (RH) s'occupent de tout ce qui concerne ces personnes au travail.</li><li>Trois grandes missions : <b>administrer</b> (contrats, paie, absences, registres), <b>développer</b> (recruter, former, évaluer, faire évoluer) et <b>réguler</b> (dialogue social, conflits, santé et sécurité).</li><li>Deux clients à la fois : la <b>direction</b>, qui veut une entreprise qui tourne et respecte la loi, et les <b>salariés</b>, qui veulent être payés juste, traités équitablement et écoutés.</li><li>La fonction RH n'est pas « du côté » de l'un ou de l'autre : elle veille à ce que la <b>règle</b> soit la même pour tous.</li><li>Dans une petite entreprise, c'est souvent le dirigeant, le comptable ou une assistante qui « fait les RH ».</li></ul>"],
["Le cycle de vie du salarié","<ul><li><b>1. Recruter</b> : définir le besoin, chercher, choisir.</li><li><b>2. Embaucher</b> : déclaration, contrat, visite médicale, registre.</li><li><b>3. Intégrer</b> : accueil, période d'essai, formation au poste.</li><li><b>4. Gérer</b> : temps de travail, congés, absences, paie.</li><li><b>5. Développer</b> : entretien annuel, formation, évolution.</li><li><b>6. Encadrer</b> : règlement intérieur, discipline, dialogue social.</li><li><b>7. Se séparer</b> : démission, fin de contrat, licenciement, retraite, documents de fin de contrat.</li><li>Ce parcours est le plan de ce jeu : chaque niveau en couvre une étape.</li></ul>"],
["Les métiers des RH","<ul><li><b>Assistant(e) RH</b> : le poste d'entrée. Dossiers du personnel, contrats, absences, préparation de la paie, courriers.</li><li><b>Gestionnaire de paie</b> : bulletins, cotisations, déclarations.</li><li><b>Chargé(e) de recrutement</b> : annonces, tri, entretiens.</li><li><b>Chargé(e) de formation</b> : plan de formation, organismes, suivi.</li><li><b>Responsable RH</b> (RRH) : pilote l'ensemble dans une entreprise moyenne.</li><li><b>Directeur·rice des RH</b> (DRH) : membre de la direction, définit la politique RH.</li><li>Dans le public : gestionnaire RH, chargé de carrière, au sein d'un service ou de la direction chargée de la fonction publique.</li><li>Qualités attendues : <b>rigueur</b>, <b>discrétion</b>, <b>écoute</b>, sens de l'<b>équité</b>, aisance avec les chiffres et les textes.</li></ul>"],
["Les mots du métier","<ul><li><b>Employeur / salarié</b> : liés par un contrat de travail.</li><li><b>Lien de subordination</b> : l'employeur donne des ordres, contrôle et peut sanctionner. C'est ce qui distingue un salarié d'un indépendant (patenté).</li><li><b>CDI / CDD</b> : contrat à durée indéterminée / déterminée.</li><li><b>Brut / net</b> : salaire avant / après retenues.</li><li><b>Effectif</b> : nombre de salariés ; <b>ETP</b> : équivalent temps plein.</li><li><b>Convention collective</b> : accord négocié pour une branche (commerce, industrie, hôtellerie…) qui complète le code du travail.</li><li><b>Fiche de poste</b> : description des missions d'un emploi.</li><li><b>Turnover</b> : rotation du personnel. <b>Absentéisme</b> : part du temps de travail perdu en absences.</li><li><b>SIRH</b> : logiciel de gestion des RH.</li></ul>"],
["Confidentialité et éthique","<ul><li>Les RH manipulent des informations très personnelles : salaire, santé, situation familiale, sanctions.</li><li><b>Discrétion absolue</b> : on ne commente jamais un dossier dans le couloir, ni avec un ami salarié.</li><li>Le <b>motif médical</b> d'un arrêt ne regarde ni l'employeur ni le chef d'équipe.</li><li>On ne collecte que les données <b>utiles</b>, on les protège, on ne les garde pas indéfiniment (loi Informatique et Libertés, contrôlée par la CNIL).</li><li><b>Non-discrimination</b> : aucune décision fondée sur l'origine, le sexe, la grossesse, l'âge, la religion, l'état de santé, l'activité syndicale…</li><li><b>Conflit d'intérêts</b> : si un proche est concerné par une décision, on le déclare et on se retire.</li><li>Une règle utile : « Pourrais-je expliquer cette décision au salarié concerné, en face ? »</li></ul>"]],

["La fonction RH est d'abord garante…",["de l'application de la même règle pour tous","des intérêts du dirigeant seul","des intérêts des syndicats seuls","de la baisse des salaires"],"Équité et conformité."],

{t:"Le cadre du travail au fenua",s:"Textes, institutions, acteurs, emploi local",
f:[
["Un droit du travail polynésien","<ul><li>La Polynésie française est <b>compétente en droit du travail</b> (statut d'autonomie de 2004). Le code du travail de métropole ne s'applique pas ici.</li><li>Le <b>code du travail de la Polynésie française</b> a été codifié par la loi du pays n° 2011-15 du 4 mai 2011. Ses articles commencent par <b>Lp.</b> (loi du pays) ou <b>A.</b> (arrêté).</li><li>On le consulte en ligne sur <b>Ti'arama</b> (tiarama.gov.pf), l'application de la Direction du travail.</li><li>Différences connues avec la métropole : durée légale de <b>39 heures</b>, pas de CSE mais des délégués du personnel et un comité d'entreprise, un <b>SMIG</b> et non un SMIC, pas d'assurance chômage, pas d'impôt sur le revenu mais une <b>CST</b>.</li><li>Réflexe : une règle lue sur un site métropolitain doit toujours être vérifiée dans le code polynésien.</li></ul>"],
["La hiérarchie des règles","<ul><li>Du plus général au plus précis : <b>Constitution et loi organique</b> → <b>code du travail</b> (lois du pays, puis arrêtés) → <b>convention collective</b> de branche → <b>accord d'entreprise</b> → <b>règlement intérieur</b> et usages → <b>contrat de travail</b>.</li><li><b>Principe de faveur</b> : quand deux règles traitent du même sujet, on applique en général la plus favorable au salarié.</li><li>Un contrat ne peut pas prévoir moins que la convention collective, qui ne peut pas prévoir moins que le code.</li><li>Conventions collectives du fenua : commerce, industrie, bâtiment, hôtellerie, banques, assurances, automobile, gardiennage… et celle des <b>ANFA</b> (agents non fonctionnaires de l'administration).</li><li>Premier geste face à une question : identifier la <b>convention collective</b> applicable à l'entreprise.</li></ul>"],
["Les institutions à connaître","<ul><li><b>Direction du travail</b> : informe employeurs et salariés, publie des fiches pratiques.</li><li><b>Inspection du travail</b> : contrôle l'application du code, conseille, peut dresser des procès-verbaux, autorise le licenciement des salariés protégés.</li><li><b>Tribunal du travail de Papeete</b> : juge les litiges individuels entre employeur et salarié. Appel : chambre sociale de la <b>cour d'appel de Papeete</b>.</li><li><b>CPS</b> (Caisse de prévoyance sociale) : cotisations, maladie, retraite, accidents du travail, prestations familiales ; reçoit la déclaration préalable à l'embauche.</li><li><b>SEFI</b> (Service de l'emploi, de la formation et de l'insertion professionnelles) : offres d'emploi, demandeurs d'emploi, aides à l'emploi, emploi local.</li><li><b>DICP</b> (impôts) : reçoit la CST retenue sur les salaires.</li><li><b>Médecine du travail</b> : services agréés comme le SISTRA.</li></ul>"],
["Les partenaires sociaux","<ul><li><b>Côté salariés</b> : des confédérations syndicales représentatives, par exemple CSTP-FO, A Tia I Mua, CSIP, O Oe To Oe Rima, Otahi.</li><li><b>Côté employeurs</b> : le MEDEF Polynésie française, la CPME, des syndicats professionnels de branche.</li><li>Ils négocient les conventions collectives, siègent dans des instances (CPS, CESEC) et sont consultés sur les projets de loi du pays.</li><li>Le <b>CESEC</b> (Conseil économique, social, environnemental et culturel) rend des avis sur les projets de textes.</li><li>La <b>CCISM</b> (chambre de commerce) informe et forme les entreprises.</li><li>En entreprise : délégués du personnel, comité d'entreprise, délégués syndicaux (voir niveau 8).</li></ul>"],
["La protection de l'emploi local","<ul><li><b>Loi du pays n° 2019-30 du 5 novembre 2019</b> relative à la promotion et à la protection de l'emploi local.</li><li>Principe : pour certains métiers, priorité d'embauche aux personnes justifiant d'une <b>durée de résidence</b> en Polynésie française.</li><li>Trois niveaux de protection : <b>10 ans</b>, <b>5 ans</b> ou <b>3 ans</b> de résidence selon le métier.</li><li>La liste des métiers concernés est le <b>tableau des activités professionnelles protégées</b> (TAPP), mis à jour chaque année en conseil des ministres.</li><li>Pour un métier protégé, l'employeur doit <b>déposer son offre au SEFI</b> ; il ne peut recruter une personne non bénéficiaire que si aucun candidat protégé ne convient (attestation du SEFI) ou en cas d'urgence prévue par le texte.</li><li>La déclaration préalable à l'embauche comporte une rubrique sur ce point. Le non-respect expose à une <b>amende administrative</b>.</li><li>Un dispositif propre existe aussi pour la fonction publique du Pays.</li></ul>"]],

["Que signifie CPS ?",["Caisse de prévoyance sociale","Comité paritaire des salaires","Centre polynésien de sécurité","Caisse des pensions du secteur public"],"Elle gère la protection sociale généralisée."],

{t:"Recruter et intégrer",s:"Du besoin à la fin de la période d'essai",
f:[
["Définir le besoin","<ul><li>Avant de publier une annonce : <b>pourquoi</b> recrute-t-on ? Remplacement, création de poste, surcroît d'activité ?</li><li>Peut-on répondre autrement : réorganisation, formation d'un salarié, temps partiel augmenté ?</li><li>La <b>fiche de poste</b> : intitulé, missions, activités, rattachement hiérarchique, horaires, lieu.</li><li>Le <b>profil</b> : compétences indispensables et compétences souhaitées, à ne pas confondre.</li><li>Le <b>cadre</b> : type de contrat, salaire (au moins le SMIG et le minimum de la convention collective), date de prise de poste.</li><li>Vérifier si le métier est <b>protégé</b> (emploi local) : cela change la procédure.</li></ul>"],
["Chercher et sélectionner sans discriminer","<ul><li><b>Où chercher</b> : candidats internes d'abord, SEFI, annonces, réseaux, écoles, candidatures spontanées.</li><li>L'annonce décrit le poste, pas la personne : pas de « jeune », « homme », « bonne présentation ».</li><li><b>Mêmes critères pour tous</b> : une grille de tri des CV, fondée sur les compétences demandées.</li><li><b>Critères interdits</b> : origine, sexe, grossesse, situation de famille, âge, religion, opinions, activité syndicale, état de santé, apparence.</li><li>Les questions en entretien portent sur l'<b>aptitude à tenir le poste</b>, pas sur la vie privée (projet d'enfant, religion, conjoint).</li><li>On répond à <b>tous</b> les candidats, même par un message court.</li></ul>"],
["Mener un entretien de recrutement","<ul><li><b>Préparer</b> : relire le CV, préparer 8 à 10 questions identiques pour tous, une grille de notation.</li><li><b>Accueillir</b> : présenter l'entreprise, le poste, le déroulement.</li><li><b>Questionner</b> sur des faits : « Racontez-moi une fois où vous avez… » plutôt que « Êtes-vous organisé ? »</li><li>Méthode <b>STAR</b> pour écouter la réponse : Situation, Tâche, Action, Résultat.</li><li>Laisser le candidat <b>poser ses questions</b>.</li><li><b>Conclure</b> : suite du processus et délai de réponse.</li><li><b>Tracer</b> : noter juste après, sur la grille, des faits et non des impressions.</li><li>À deux recruteurs, on limite les biais (premier contact, ressemblance avec soi).</li></ul>"],
["Les formalités d'embauche","<ul><li><b>Déclaration préalable à l'embauche (DPAE)</b> à la <b>CPS</b> : obligatoire <b>avant</b> que le salarié commence, au plus tôt dans les 8 jours qui précèdent. Elle vaut déclaration à la CPS, à la Direction du travail et demande de visite médicale.</li><li><b>Contrat de travail</b> signé avant le début du travail. Un CDD est obligatoirement écrit.</li><li><b>Visite médicale d'embauche</b> : avant la prise de poste ou dans les 30 jours qui suivent.</li><li><b>Registre unique du personnel</b> : inscription dans l'ordre des embauches (nom, nationalité, date de naissance, emploi, dates d'entrée et de sortie).</li><li>Affichages obligatoires : horaires, coordonnées de l'inspection du travail, de la médecine du travail, des secours.</li><li>Faire travailler quelqu'un sans déclaration, c'est du <b>travail clandestin</b>.</li></ul>"],
["Accueillir et réussir la période d'essai","<ul><li>Le premier jour compte : poste de travail prêt, accès, présentation à l'équipe, règlement intérieur, consignes de sécurité.</li><li>Un <b>tuteur</b> et un programme des premières semaines.</li><li>La <b>période d'essai</b> permet à chacun d'évaluer l'autre. Elle doit être <b>écrite</b> dans le contrat.</li><li>Durée en CDI : fixée par la convention collective ; à défaut, <b>1 mois</b> au plus pour les ouvriers et employés, <b>2 mois</b> pour les agents de maîtrise et techniciens, <b>3 mois</b> pour les cadres.</li><li>Pendant l'essai, chacun peut rompre sans procédure de licenciement, mais pas pour un motif discriminatoire.</li><li>Faire un <b>point d'étape</b> à mi-parcours et un <b>bilan</b> avant la fin : on ne découvre pas un problème le dernier jour.</li></ul>"]],
q:[
["Première étape d'un recrutement :",["analyser le besoin","publier l'annonce","convoquer les candidats","rédiger le contrat"],"Parfois, le besoin se règle autrement."],
["Quelle mention est interdite dans une annonce ?",["« jeune femme dynamique »","« CDI à temps plein »","« permis B exigé »","« expérience de 2 ans souhaitée »"],"Le sexe et l'âge sont des critères discriminatoires."],
["En entretien, on peut demander…",["de décrire une situation professionnelle vécue","si la candidate veut des enfants","la religion du candidat","la profession du conjoint"],"Les questions portent sur l'aptitude au poste."],
["La méthode STAR signifie…",["Situation, Tâche, Action, Résultat","Salaire, Temps, Âge, Références","Sélection, Test, Accueil, Recrutement","Sourire, Tenue, Attitude, Regard"],"Pour obtenir des faits précis."],
["Pour comparer équitablement les candidats, on utilise…",["les mêmes questions et une grille","son intuition","la photo du CV","l'avis du premier venu"],"Mêmes critères pour tous."],
["La DPAE se fait…",["avant l'embauche, auprès de la CPS","dans le mois qui suit","auprès du tribunal du travail","seulement pour les CDI"],"Au plus tôt dans les 8 jours qui précèdent."],
["La DPAE peut être envoyée au plus tôt…",["8 jours avant la date prévue d'embauche","6 mois avant","le lendemain de l'embauche","après la période d'essai"],"Et toujours avant le début du travail."],
["La visite médicale d'embauche a lieu…",["avant la prise de poste ou dans les 30 jours","dans l'année","seulement pour les cadres","jamais pour un CDD"],"Selon la fiche de la Direction du travail."],
["Le registre unique du personnel est tenu…",["dans l'ordre des embauches","par ordre alphabétique","par salaire","par service"],"Avec les dates d'entrée et de sortie."],
["Faire travailler un salarié non déclaré constitue…",["du travail clandestin","une période d'essai","un stage","une tolérance pour les petites entreprises"],"Avec des sanctions pénales et administratives."],
["À défaut de convention collective, la période d'essai d'un employé en CDI ne dépasse pas…",["1 mois","6 mois","3 mois","1 an"],"Article A. 1211-9."],
["Et pour un cadre, à défaut de convention collective :",["3 mois","1 mois","6 mois","8 mois"],"2 mois pour les agents de maîtrise et techniciens."],
["La période d'essai doit…",["figurer par écrit dans le contrat","être annoncée oralement","être décidée après l'embauche","durer au moins un an"],"Elle ne se présume pas."],
["Pendant l'essai, l'employeur peut rompre…",["sans procédure de licenciement, mais pas pour un motif discriminatoire","pour n'importe quel motif, même la grossesse","seulement avec l'accord de l'inspection","seulement pour faute grave"],"La liberté de rompre n'autorise pas la discrimination."],
["Quand fait-on le bilan de la période d'essai ?",["à mi-parcours puis avant la fin","le dernier jour seulement","jamais","après un an"],"Pour laisser au salarié le temps de corriger."],
["Les candidats non retenus…",["reçoivent tous une réponse","n'ont pas à être prévenus","sont prévenus s'ils rappellent","reçoivent leur dossier annoté"],"C'est aussi l'image de l'entreprise."],
["On cherche d'abord un candidat…",["en interne","à l'étranger","chez le concurrent","parmi ses amis"],"La mobilité interne motive et coûte moins."],
["Compétences « indispensables » et « souhaitées » :",["on les distingue dans le profil","c'est la même chose","on ne les écrit pas","seules les souhaitées comptent"],"Sinon on élimine de bons candidats."],
["Un CDD doit obligatoirement être…",["écrit","oral","validé par le SEFI","limité à un mois"],"À défaut, il est réputé à durée indéterminée."],
["Avant de recruter sur un métier protégé, on dépose l'offre…",["au SEFI","à la CPS","au tribunal","à la mairie"],"Protection de l'emploi local."]],

{t:"Le contrat de travail",s:"CDI, CDD, clauses, modification, suspension",
f:[
["Les trois éléments du contrat","<ul><li>Un contrat de travail existe dès que trois éléments sont réunis : une <b>prestation de travail</b>, une <b>rémunération</b>, un <b>lien de subordination</b>.</li><li>Peu importe le nom donné : un « prestataire patenté » qui travaille aux horaires imposés, avec le matériel de l'entreprise et sous les ordres d'un chef, peut être <b>requalifié</b> en salarié.</li><li>Le <b>CDI</b> est la forme normale et générale de la relation de travail.</li><li>Un CDI à temps plein peut être conclu sans écrit, mais l'écrit est fortement recommandé : il prouve la fonction, le salaire, la période d'essai.</li><li>Le salarié peut demander la traduction de son contrat dans une langue polynésienne.</li></ul>"],
["Le CDD : quand et comment","<ul><li>Un CDD ne peut pas pourvoir durablement un emploi lié à l'activité <b>normale et permanente</b> de l'entreprise.</li><li>Cas autorisés (art. Lp. 1231-2 à 1231-4) : <b>remplacement</b> d'un salarié absent, <b>surcroît exceptionnel</b> d'activité, <b>tâche occasionnelle</b> précisément définie, emploi <b>saisonnier</b>, activité nouvelle dont la pérennité est incertaine, contrats d'aide à l'emploi, emplois d'usage par nature temporaires…</li><li>Interdit : remplacer un <b>gréviste</b> ; certains travaux dangereux.</li><li>Il est <b>écrit</b>, indique son <b>motif</b>, et doit être <b>signé au plus tard à la fin du premier jour de travail</b>. À défaut : il est réputé CDI.</li><li>On ne peut pas conclure un CDD « pour essayer » quelqu'un.</li></ul>"],
["Le CDD : durée, essai, fin","<ul><li><b>Période d'essai</b> (art. Lp. 1231-10) : un jour par semaine de contrat, dans la limite de <b>2 semaines</b> si le contrat dure 6 mois ou moins, et d'<b>1 mois</b> au-delà.</li><li><b>Durée</b> : <b>1 an</b> au plus pour le contrat initial, <b>2 renouvellements</b>, <b>2 ans</b> au total (art. Lp. 1231-7), sauf cas particuliers.</li><li><b>Fin</b> : le CDD cesse de plein droit à son terme. Avant le terme, il ne peut être rompu que dans des cas limités (accord des parties, faute grave, force majeure…).</li><li><b>Indemnité de fin de contrat</b> : au moins <b>6 %</b> de la rémunération brute totale perçue pendant le contrat (8 % dans le gardiennage et le nettoyage).</li><li><b>Délai de carence</b> (art. Lp. 1231-24) : après un CDD pour surcroît d'activité ou tâche occasionnelle, pas de nouveau CDD sur le même poste avant un délai égal au <b>tiers</b> de la durée du contrat.</li></ul>"],
["Les clauses et la modification du contrat","<ul><li>Mentions utiles : identité des parties, fonction et classification, lieu de travail, durée du travail, rémunération, période d'essai, convention collective applicable.</li><li>Clauses particulières : <b>mobilité</b> (zone définie), <b>non-concurrence</b> (limitée dans le temps et l'espace), <b>confidentialité</b>.</li><li><b>Modifier un élément essentiel</b> (salaire, qualification, durée du travail) : il faut l'<b>accord du salarié</b>, par un <b>avenant</b> écrit.</li><li><b>Changer les conditions de travail</b> (nouvel horaire dans la même plage, nouvelle tâche de même niveau) : cela relève du pouvoir de direction de l'employeur.</li><li>Un salarié qui refuse une modification de son contrat ne commet pas de faute.</li></ul>"],
["La suspension du contrat","<ul><li>Le contrat est <b>suspendu</b> quand le salarié ne travaille pas mais reste salarié : maladie, accident du travail, maternité, congés, grève, mise à pied.</li><li>Pendant la suspension, le salarié garde son emploi ; le salaire est maintenu, remplacé par des indemnités, ou non versé selon les cas.</li><li>Principe (art. Lp. 1212-1 et suivants) : l'employeur ne peut pas rompre un contrat suspendu, sauf exceptions prévues par le code pour chaque cas.</li><li><b>Accident du travail</b> et <b>maternité</b> : protection renforcée.</li><li>À la fin de la suspension, le salarié retrouve son poste ou un poste équivalent.</li><li><b>Temps partiel</b> : contrat écrit précisant la durée et la répartition des heures ; mêmes droits qu'un temps plein, au prorata.</li></ul>"]],
q:[
["Les trois éléments du contrat de travail :",["prestation, rémunération, subordination","écrit, signature, tampon","salaire, prime, congés","horaires, lieu, matériel"],"Leur réunion suffit, quel que soit le nom du contrat."],
["Un « prestataire » qui travaille sous les ordres d'un chef, aux horaires imposés, risque…",["la requalification en salarié","rien","une augmentation","une amende personnelle seulement"],"Le juge regarde la réalité, pas l'étiquette."],
["La forme normale du contrat de travail est…",["le CDI","le CDD","l'intérim","le stage"],"Le CDD est l'exception."],
["Un CDD peut-il pourvoir durablement un poste permanent ?",["Non","Oui, s'il est renouvelé","Oui, avec l'accord du salarié","Oui, dans les petites entreprises"],"Sauf cas listés par le code."],
["Lequel est un motif autorisé de CDD ?",["le remplacement d'un salarié absent","tester un candidat","éviter un CDI","remplacer un gréviste"],"Le remplacement d'un gréviste est interdit."],
["Un CDD doit être signé au plus tard…",["à la fin du premier jour de travail","dans le mois","à la fin du contrat","avant la première paie"],"Sinon il est réputé à durée indéterminée."],
["Un CDD sans écrit est…",["réputé à durée indéterminée","nul","valable un mois","un stage"],"L'écrit et le motif sont obligatoires."],
["Période d'essai d'un CDD de 8 semaines :",["8 jours au plus","1 mois","2 semaines","aucune"],"Un jour par semaine de contrat."],
["Période d'essai maximale d'un CDD de 5 mois :",["2 semaines","5 jours","1 mois","2 mois"],"Plafond de 2 semaines jusqu'à 6 mois."],
["Période d'essai maximale d'un CDD de 10 mois :",["1 mois","2 semaines","3 mois","10 jours"],"Plafond d'un mois au-delà de 6 mois."],
["L'indemnité de fin de CDD est au minimum de…",["6 % de la rémunération brute totale","1 % du salaire de base","un mois de salaire","10 % du net"],"8 % dans certaines conventions collectives."],
["Le délai de carence après un CDD pour surcroît d'activité est égal…",["au tiers de la durée du contrat","à la durée du contrat","à 8 jours","à un an"],"Sur le même poste."],
["Pour baisser le salaire d'un salarié, il faut…",["son accord et un avenant écrit","une note de service","prévenir la CPS","attendre un an"],"Le salaire est un élément essentiel du contrat."],
["Changer l'heure de début de 7 h à 7 h 30 relève en général…",["du pouvoir de direction de l'employeur","d'une modification du contrat","d'une sanction","d'un licenciement"],"C'est un changement des conditions de travail."],
["Un salarié qui refuse une modification de son contrat…",["ne commet pas de faute","peut être sanctionné","est démissionnaire","perd son ancienneté"],"L'employeur doit alors renoncer ou engager une autre procédure."],
["Pendant un arrêt maladie, le contrat est…",["suspendu","rompu","modifié","annulé"],"Le salarié reste salarié."],
["Peut-on en principe licencier un salarié dont le contrat est suspendu ?",["Non, sauf exceptions prévues par le code","Oui, librement","Oui, après 8 jours","Oui, sans procédure"],"Protection renforcée pour l'accident du travail et la maternité."],
["Une clause de non-concurrence doit être…",["limitée dans le temps et dans l'espace","illimitée","orale","identique pour tous"],"Sinon elle est excessive."],
["Un salarié à temps partiel a…",["les mêmes droits qu'un temps plein, au prorata","moins de congés","pas de convention collective","pas de période d'essai"],"Avec un contrat écrit précisant la répartition des heures."],
["On peut conclure un CDD uniquement pour essayer quelqu'un :",["Faux","Vrai","Vrai, pour 3 mois","Vrai, pour les cadres"],"L'essai se fait par la période d'essai d'un CDI."]],

{t:"Temps de travail, congés et absences",s:"39 heures, heures supplémentaires, congés payés, maladie",
f:[
["La durée du travail","<ul><li><b>Durée légale</b> : <b>39 heures</b> par semaine, soit <b>169 heures</b> par mois.</li><li><b>Durées maximales</b> : <b>10 heures</b> par jour, <b>48 heures</b> sur une semaine, 46 heures en moyenne sur une période fixée par le code.</li><li><b>Repos</b> : <b>11 heures</b> consécutives par jour, <b>24 heures</b> consécutives par semaine, en principe le dimanche.</li><li>Le <b>travail effectif</b> est le temps où le salarié est à la disposition de l'employeur et suit ses directives.</li><li>L'employeur doit <b>décompter</b> la durée du travail de chaque salarié (horaires de début et de fin) et afficher l'horaire collectif.</li><li><b>Jour</b> : de 6 h à 20 h. <b>Nuit</b> : de 20 h à 6 h (art. Lp. 3212-16).</li></ul>"],
["Les heures supplémentaires","<ul><li>Toute heure effectuée <b>au-delà de 39 heures</b> dans la semaine, à la demande de l'employeur.</li><li>Le décompte se fait <b>à la semaine</b>, du lundi 0 h au dimanche 24 h.</li><li>Majorations légales (art. Lp. 3332-1) : de la <b>40e à la 47e heure : + 25 %</b> ; au-delà de la 47e : <b>+ 50 %</b>.</li><li>Heures supplémentaires de <b>nuit : + 75 %</b>. Les <b>dimanches et jours non ouvrables</b> : <b>+ 65 %</b> de jour, <b>+ 100 %</b> de nuit.</li><li>Une convention collective peut prévoir d'autres taux : on applique le plus favorable.</li><li>Taux horaire d'un salarié mensualisé : salaire mensuel ÷ 169.</li><li>Une prime forfaitaire ne peut pas remplacer le paiement des heures supplémentaires.</li></ul>"],
["Les congés payés","<ul><li><b>2,5 jours ouvrables par mois</b> de travail, soit <b>30 jours ouvrables</b> par an (5 semaines), à temps plein comme à temps partiel.</li><li><b>Jours ouvrables</b> : du lundi au samedi, sauf dimanches et jours fériés chômés.</li><li>Les dates sont fixées en accord avec l'employeur ; en cas de désaccord, c'est l'employeur qui décide.</li><li><b>Indemnité de congés</b> : on compare deux méthodes et on retient la plus favorable : le <b>dixième</b> de la rémunération brute de la période de référence, ou le <b>maintien du salaire</b>.</li><li>En fin de contrat, les congés non pris donnent lieu à une <b>indemnité compensatrice</b>.</li><li>Des jours supplémentaires peuvent être prévus selon l'ancienneté ou la convention collective.</li></ul>"],
["Jours fériés et congés pour événements familiaux","<ul><li>Jours fériés au fenua : 1er janvier, <b>5 mars</b> (arrivée de l'Évangile), Vendredi saint, lundi de Pâques, <b>1er mai</b>, 8 mai, Ascension, lundi de Pentecôte, <b>29 juin</b> (fête de l'autonomie), 14 juillet, 15 août, 1er novembre, 11 novembre, 25 décembre.</li><li>Le <b>1er mai</b> est le seul jour obligatoirement <b>chômé et payé</b> pour tous. Pour les autres, le régime dépend de la convention collective et des usages.</li><li>Congés pour événements familiaux, selon la fiche de la Direction du travail : <b>mariage</b> du salarié 4 jours, <b>naissance</b> 3 jours, mariage d'un enfant 2 jours, <b>décès</b> du conjoint 4 jours, d'un enfant ou d'un parent 2 jours.</li><li>Ces jours sont payés et ne sont pas déduits des congés annuels.</li></ul>"],
["Maladie, maternité, accident du travail","<ul><li><b>Maladie</b> : le salarié prévient l'employeur et transmet son arrêt dans le délai prévu par la convention collective ou le règlement intérieur (souvent 48 heures). La CPS verse des indemnités journalières sous conditions.</li><li>L'employeur ne connaît pas le diagnostic. Il gère l'<b>absence</b>, pas la maladie.</li><li><b>Maternité</b> : congé de <b>16 semaines</b> (6 avant, 10 après l'accouchement), indemnisé à 100 % ; protection contre le licenciement. Une femme enceinte peut démissionner sans préavis.</li><li><b>Accident du travail</b> : survenu par le fait ou à l'occasion du travail. L'employeur le <b>déclare à la CPS dans les 48 heures</b>, remet les documents de soins et analyse les causes.</li><li>Pendant un arrêt pour accident du travail, la protection de l'emploi est renforcée.</li><li>Au retour d'une longue absence : visite de reprise à la médecine du travail si nécessaire, entretien d'accueil.</li></ul>"]],

{t:"Paie et rémunération",s:"SMIG, bulletin, cotisations CPS, CST, coût employeur",
f:[
["Lire un bulletin de salaire","<ul><li>Le bulletin se lit de haut en bas, en quatre blocs.</li><li><b>1. Le brut</b> : salaire de base + heures supplémentaires + primes + avantages en nature − absences non payées.</li><li><b>2. Les retenues du salarié</b> : cotisations <b>CPS</b> (maladie, retraite) et <b>CST</b>.</li><li><b>3. Le net à payer</b> : brut − retenues, puis éventuels acomptes ou saisies.</li><li><b>4. Les charges de l'employeur</b> : cotisations patronales CPS. <b>Coût total</b> = brut + charges patronales.</li><li>Le bulletin est remis à chaque paie ; le salarié doit le conserver sans limite (retraite).</li><li>Il mentionne l'employeur, le salarié, l'emploi, la période, les heures, la convention collective.</li><li>Il n'y a <b>pas d'impôt sur le revenu</b> en Polynésie française : rien de tel sur le bulletin, seulement la CST.</li></ul>"],
["Le SMIG et les éléments du salaire","<ul><li><b>SMIG</b> : <b>1 024,74 F par heure</b>, soit <b>173 181 F brut par mois</b> pour 169 heures (arrêté n° 580 CM, depuis le 1er mai 2024 ; aucun relèvement publié à l'automne 2026). Aucun salarié ne peut être payé en dessous.</li><li>Il est revalorisé quand l'indice des prix a augmenté d'au moins 2 % depuis la dernière hausse.</li><li>La convention collective fixe souvent des <b>minima par catégorie</b> supérieurs au SMIG.</li><li>Éléments du brut : <b>salaire de base</b>, <b>heures supplémentaires</b>, <b>prime d'ancienneté</b>, primes diverses (rendement, 13e mois), <b>avantages en nature</b> (logement, véhicule, repas).</li><li>Les <b>remboursements de frais</b> ne sont pas du salaire.</li><li><b>Acompte</b> : paiement anticipé d'un travail déjà fait. <b>Avance</b> : prêt sur un travail à venir.</li><li>À travail égal, salaire égal : pas de différence fondée sur le sexe.</li></ul>"],
["Les cotisations CPS (taux 2026)","<ul><li><b>Maladie</b> : <b>4,98 %</b> salarié, <b>9,96 %</b> employeur, sur le brut jusqu'à 5 000 000 F.</li><li><b>Retraite tranche A</b> : <b>7,84 %</b> salarié, <b>15,69 %</b> employeur, sur le brut <b>jusqu'à 269 000 F</b>.</li><li><b>Retraite tranche B</b> : <b>5,81 %</b> salarié, <b>11,62 %</b> employeur, sur la part du brut <b>entre 269 000 et 525 000 F</b>.</li><li><b>Accidents du travail</b> : <b>0,77 %</b>, employeur seul.</li><li><b>Prestations familiales</b> : <b>4,16 %</b>, employeur seul (0 % dans certains secteurs), jusqu'à 750 000 F.</li><li>D'autres contributions patronales peuvent s'ajouter (formation, fonds exceptionnels).</li><li>Attention au piège : la tranche B ne s'applique qu'à la part <b>au-dessus</b> de 269 000 F. Un salarié ne paie jamais plus de 12,82 % de son brut à la CPS.</li><li>L'employeur retient la part salariale et verse le tout à la CPS chaque mois.</li></ul>"],
["La CST sur les salaires","<ul><li><b>Contribution de solidarité territoriale</b> : retenue par l'employeur sur le brut et reversée à la <b>DICP</b>.</li><li>Barème <b>progressif par tranches</b> du brut mensuel : <b>0,5 %</b> jusqu'à 150 000 F ; <b>3 %</b> de 150 001 à 250 000 F ; <b>5 %</b> de 250 001 à 400 000 F ; <b>9 %</b> de 400 001 à 700 000 F ; puis des taux croissants jusqu'à <b>28 %</b> au-delà de 2 500 000 F.</li><li>Chaque tranche a son taux : on ne multiplie pas tout le salaire par le dernier taux.</li><li>Exemple officiel, pour 554 800 F : 150 000 × 0,5 % = 750 ; 100 000 × 3 % = 3 000 ; 150 000 × 5 % = 7 500 ; 154 800 × 9 % = 13 932. Total : 25 182 F.</li><li>Les non-salariés paient une CST d'un autre type.</li></ul>"],
["Un bulletin complet, pas à pas","<ul><li>Salarié payé <b>300 000 F brut</b>, sans prime.</li><li><b>Maladie</b> : 300 000 × 4,98 % = <b>14 940</b>.</li><li><b>Retraite A</b> : 269 000 × 7,84 % = <b>21 090</b>.</li><li><b>Retraite B</b> : (300 000 − 269 000) = 31 000 × 5,81 % = <b>1 801</b>.</li><li><b>CST</b> : 750 + 3 000 + (50 000 × 5 %) 2 500 = <b>6 250</b>.</li><li><b>Net à payer</b> : 300 000 − 14 940 − 21 090 − 1 801 − 6 250 = <b>255 919 F</b>.</li><li><b>Charges patronales</b> : maladie 29 880 + retraite A 42 206 + retraite B 3 602 + accidents du travail 2 310 + prestations familiales 12 480 = <b>90 478 F</b>.</li><li><b>Coût total</b> : environ <b>390 478 F</b>, hors autres contributions.</li><li>Au SMIG : 173 181 − 22 202 (CPS) − 1 445 (CST) = environ <b>149 534 F net</b>.</li></ul>"]],

{t:"Discipline et fin du contrat",s:"Sanctions, licenciement, démission, documents de fin de contrat",
f:[
["Le pouvoir disciplinaire","<ul><li>L'employeur peut sanctionner un <b>comportement fautif</b> : retards répétés, refus d'exécuter une consigne, vol, violence…</li><li><b>Règlement intérieur</b> : obligatoire dans les établissements d'au moins <b>10 salariés</b> (art. Lp. 1311-1). Il fixe les règles de discipline, d'hygiène et de sécurité, et l'<b>échelle des sanctions</b>.</li><li>Échelle habituelle : avertissement, blâme, mise à pied disciplinaire de quelques jours, licenciement.</li><li>Interdits : les <b>amendes</b> et retenues sur salaire à titre de sanction ; deux sanctions pour la même faute ; toute sanction discriminatoire.</li><li>La sanction doit être <b>proportionnée</b> à la faute.</li><li>L'insuffisance professionnelle (ne pas y arriver malgré ses efforts) n'est pas une faute.</li></ul>"],
["La procédure disciplinaire","<ul><li>Avant de prendre une sanction, l'employeur <b>convoque le salarié à un entretien préalable</b> pour qu'il s'explique (art. Lp. 1322-1 et Lp. 1323-2).</li><li><b>Prescription</b> : aucun fait fautif ne peut donner lieu à des poursuites <b>plus de 2 mois</b> après que l'employeur en a eu connaissance (art. Lp. 1323-1), sauf poursuites pénales.</li><li>La sanction est <b>notifiée par écrit</b> et <b>motivée</b>.</li><li><b>Mise à pied conservatoire</b> : mesure d'attente immédiate en cas de faute grave, le temps de la procédure. Ce n'est pas une sanction.</li><li>Le salarié peut contester : lettre à l'employeur, délégués du personnel, tribunal du travail.</li><li>Réflexes : des <b>faits datés</b>, des <b>preuves loyales</b>, des témoins, et la même sévérité pour tous.</li></ul>"],
["Le licenciement pour motif personnel","<ul><li>Il faut une <b>cause réelle et sérieuse</b> : des faits exacts, précis, vérifiables, assez importants.</li><li><b>1. Convocation</b> à l'entretien préalable : lettre recommandée avec avis de réception, ou remise en main propre contre décharge ou devant témoin. Elle indique l'objet, la date, l'heure, le lieu et la possibilité d'être <b>assisté</b>.</li><li><b>2. Entretien</b> : au moins <b>2 jours francs</b> et au plus 15 jours francs après la convocation. L'employeur expose les motifs, le salarié s'explique.</li><li><b>3. Notification</b> : lettre <b>motivée</b>, au moins <b>1 jour franc</b> et au plus <b>15 jours francs</b> après l'entretien.</li><li><b>4. Préavis</b> : il commence le premier jour ouvrable suivant la lettre.</li><li>La procédure s'applique même en cas de <b>faute grave</b> ou lourde.</li><li>Un licenciement <b>verbal</b> est toujours irrégulier.</li></ul>"],
["Préavis et indemnités","<ul><li><b>Préavis</b> (art. A. 1222-1), à défaut de dispositions plus favorables. Moins de 5 ans d'ancienneté : <b>1 mois</b> pour les ouvriers et employés, <b>2 mois</b> pour les agents de maîtrise et techniciens, <b>3 mois</b> pour les cadres. Plus de 5 ans : <b>2, 3 et 4 mois</b>.</li><li>Pas de préavis en cas de faute grave ou lourde.</li><li>Pendant le préavis : un jour d'absence payé par semaine pour chercher un emploi.</li><li><b>Indemnité de licenciement</b> : due après <b>3 ans</b> d'ancienneté, sauf faute grave ou lourde. Minimum légal : <b>un dixième de mois par année</b> pour un salarié mensualisé. La convention collective prévoit souvent mieux.</li><li><b>Indemnité compensatrice</b> de congés payés, et de préavis s'il n'est pas exécuté à la demande de l'employeur.</li><li>Sans cause réelle et sérieuse : le tribunal peut proposer la réintégration ; à défaut, indemnité d'au moins <b>6 mois de salaire</b> pour un salarié ayant un an d'ancienneté (art. Lp. 1225-4).</li></ul>"],
["Les autres fins de contrat et les documents","<ul><li><b>Licenciement économique</b> : motif non lié à la personne (difficultés, réorganisation). Recherche de <b>reclassement</b> d'abord, consultation des représentants du personnel, <b>critères d'ordre</b> des licenciements, information de l'inspection du travail.</li><li><b>Démission</b> : volonté <b>claire et non équivoque</b> du salarié. Elle ne se présume pas : une absence injustifiée n'est pas une démission. Le salarié doit un préavis.</li><li><b>Fin de CDD</b> à son terme ; <b>départ à la retraite</b> ; rupture pendant l'essai.</li><li>Une <b>transaction</b> règle un litige après la rupture ; elle ne peut pas être l'acte de rupture lui-même.</li><li>Documents à remettre : dernier <b>bulletin de salaire</b>, <b>certificat de travail</b>, <b>reçu pour solde de tout compte</b>.</li><li><b>Salarié protégé</b> (délégué du personnel, membre du comité d'entreprise…) : pas de licenciement sans <b>autorisation de l'inspecteur du travail</b>.</li></ul>"]],
q:[
["Le règlement intérieur est obligatoire à partir de…",["10 salariés","50 salariés","1 salarié","100 salariés"],"Article Lp. 1311-1."],
["Laquelle de ces sanctions est interdite ?",["une amende retenue sur le salaire","un avertissement","une mise à pied disciplinaire","un blâme"],"Les sanctions pécuniaires sont prohibées."],
["Avant toute sanction, l'employeur doit…",["convoquer le salarié à un entretien préalable","afficher la sanction","prévenir la CPS","attendre six mois"],"Pour qu'il puisse s'expliquer."],
["Délai pour engager des poursuites disciplinaires après avoir eu connaissance d'une faute :",["2 mois","15 jours","6 mois","1 an"],"Article Lp. 1323-1."],
["La mise à pied conservatoire est…",["une mesure d'attente, pas une sanction","une sanction du premier degré","un licenciement","un congé payé"],"Elle permet d'écarter le salarié pendant la procédure."],
["Peut-on sanctionner deux fois la même faute ?",["Non","Oui","Oui, si elle est grave","Oui, après un mois"],"Le pouvoir disciplinaire est épuisé par la première sanction."],
["L'insuffisance professionnelle est…",["distincte de la faute disciplinaire","une faute grave","une faute lourde","un motif économique"],"Ne pas y arriver n'est pas désobéir."],
["Un licenciement doit reposer sur…",["une cause réelle et sérieuse","l'intuition du dirigeant","l'avis des collègues","une simple mésentente non établie"],"Des faits exacts, précis, vérifiables."],
["L'entretien préalable au licenciement a lieu au plus tôt…",["2 jours francs après la convocation","le jour même","1 mois après","24 heures après"],"Et au plus tard 15 jours francs après."],
["La lettre de licenciement est envoyée au plus tôt…",["1 jour franc après l'entretien","à la fin de l'entretien","1 mois après","avant l'entretien"],"Et au plus tard 15 jours francs après."],
["La lettre de licenciement doit…",["indiquer les motifs","rester vague","être orale","être affichée"],"L'absence de motif prive le licenciement de cause réelle et sérieuse."],
["En cas de faute grave, la procédure de licenciement…",["reste obligatoire","est supprimée","est facultative","est remplacée par un appel téléphonique"],"Seuls le préavis et l'indemnité de licenciement tombent."],
["Préavis d'un employé ayant 3 ans d'ancienneté :",["1 mois","8 jours","2 mois","3 mois"],"Moins de 5 ans d'ancienneté."],
["Préavis d'un cadre ayant 8 ans d'ancienneté :",["4 mois","1 mois","2 mois","3 mois"],"Plus de 5 ans : 2, 3 et 4 mois selon la catégorie."],
["L'indemnité légale de licenciement est due à partir de…",["3 ans d'ancienneté","1 mois","6 mois","10 ans"],"Sauf faute grave ou lourde."],
["Minimum légal de l'indemnité pour un salarié mensualisé :",["un dixième de mois par année","un mois par année","un demi-mois par année","6 % du brut"],"La convention collective prévoit souvent plus."],
["Une absence injustifiée de trois jours vaut-elle démission ?",["Non, la démission ne se présume pas","Oui, automatiquement","Oui, après mise en demeure orale","Oui, pour un CDD"],"Il faut une volonté claire et non équivoque."],
["Pour licencier un délégué du personnel, il faut…",["l'autorisation de l'inspecteur du travail","l'accord du syndicat","rien de plus","l'accord de la CPS"],"C'est un salarié protégé."],
["Lequel n'est pas un document de fin de contrat ?",["la fiche de poste","le certificat de travail","le reçu pour solde de tout compte","le dernier bulletin de salaire"],"Les trois autres sont remis au départ."],
["Sans cause réelle et sérieuse, un salarié ayant un an d'ancienneté peut obtenir au moins…",["6 mois de salaire","1 mois de salaire","le SMIG","rien"],"Article Lp. 1225-4, à défaut de réintégration."]],

["Tu expliques qu'un licenciement verbal est irrégulier, tu proposes une mise à pied conservatoire écrite et tu lances la procédure : convocation, entretien, lettre motivée. Tu rassembles les preuves.",2,"Même pour un vol, la procédure est obligatoire."],
