["Protéger, alerter, secourir","<ul><li><b>Protéger</b> : toi, la victime, les témoins. Pas de sur-accident.</li><li><b>Bilan rapide</b> : la personne <b>répond-elle</b> ? <b>Respire-t-elle</b> ? Saigne-t-elle abondamment ?</li><li><b>Alerter</b> : <b>15</b> (SAMU), <b>18</b> (pompiers), <b>17</b> (police, gendarmerie), <b>16</b> (secours en mer). Dis : où, quoi, combien de victimes, leur état, les gestes faits. Ne raccroche pas le premier.</li><li><b>Méthode ABCDE</b> pour l'examen : A voies aériennes, B respiration, C circulation, D état neurologique, E exposition (découvrir, température).</li><li>On traite d'abord ce qui tue d'abord.</li></ul><p class='mut'>Ce cours aide à réviser. Il ne remplace ni la formation pratique aux gestes d'urgence ni les protocoles de ton service.</p>"],
["L'arrêt cardiaque de l'adulte","<ul><li><b>Reconnaître</b> : ne répond pas, <b>ne respire pas</b> ou respire anormalement (gasps).</li><li><b>Appeler</b> à l'aide, faire apporter un <b>défibrillateur</b>.</li><li><b>Masser</b> : centre du thorax, <b>100 à 120</b> compressions par minute, <b>5 à 6 cm</b> de profondeur, relâchement complet.</li><li><b>30 compressions pour 2 insufflations</b>. Sans matériel ni formation : massage seul.</li><li><b>Défibrillateur</b> : le mettre en marche dès qu'il arrive et suivre ses consignes.</li><li><b>Relais</b> du masseur toutes les <b>2 minutes</b> ; interruptions les plus courtes possibles.</li><li><b>En équipe médicalisée</b> : adrénaline <b>1 mg</b> toutes les 3 à 5 minutes selon le protocole ; recherche des causes réversibles.</li></ul>"],
["Inconscient qui respire, étouffement","<ul><li><b>Inconscient qui respire</b> : libérer les voies aériennes, <b>position latérale de sécurité</b>, alerter, surveiller la respiration sans arrêt.</li><li><b>Étouffement total</b> (ne peut plus parler ni tousser) : <b>5 claques</b> dans le dos, puis <b>5 compressions abdominales</b> ; alterner.</li><li><b>Nourrisson</b> : 5 claques dans le dos, puis 5 compressions <b>thoraciques</b>.</li><li><b>Étouffement partiel</b> (tousse, parle) : encourager à tousser, ne pas taper.</li><li>Si la victime perd connaissance : massage cardiaque.</li></ul>"],
["Hémorragie et état de choc","<ul><li><b>Hémorragie externe</b> : <b>compression directe</b> immédiate, puis pansement compressif.</li><li><b>Garrot</b> : sur un membre, si la compression ne suffit pas ou est impossible. <b>Noter l'heure</b>. On ne le desserre pas.</li><li>Allonger, couvrir, rassurer, alerter.</li><li><b>Signes de choc</b> : pâleur, sueurs, peau froide, marbrures, pouls rapide, soif, agitation ou somnolence. La baisse de tension est <b>tardive</b>.</li><li><b>Rôle infirmier</b> : deux voies veineuses de bon calibre, oxygène, surveillance rapprochée, préparation du remplissage selon prescription.</li></ul>"]],
q:[
["Numéro du SAMU au fenua ?",["15","16","17","18"],"16 pour les secours en mer, 17 police, 18 pompiers."],
["Une personne ne répond pas et ne respire pas. Premier geste après avoir alerté ?",["Commencer le massage cardiaque","La mettre en position latérale de sécurité","Lui donner à boire","Attendre le médecin"],"Chaque minute sans massage diminue les chances de survie."],
["Fréquence des compressions thoraciques chez l'adulte ?",["100 à 120 par minute","60 par minute","150 à 180 par minute","30 par minute"],"Avec une profondeur de 5 à 6 cm."],
["Rapport compressions / insufflations chez l'adulte ?",["30 / 2","15 / 2","5 / 1","3 / 1"],"3 / 1 concerne le nouveau-né."],
["Le masseur est relayé toutes les…",["2 minutes","10 minutes","30 secondes","Jamais"],"La fatigue diminue la qualité du massage."],
["Des gasps (respiration lente, bruyante, inefficace) signifient…",["un arrêt cardiaque : il faut masser","un sommeil profond","une simple gêne","une crise d'asthme"],"Les gasps ne sont pas une respiration efficace."],
["Victime inconsciente qui respire : on l'installe…",["en position latérale de sécurité","assise","sur le ventre","jambes surélevées, sur le dos"],"Pour protéger les voies aériennes."],
["Adulte qui s'étouffe et ne peut plus parler : on commence par…",["5 claques dans le dos","un massage cardiaque","un verre d'eau","la position latérale de sécurité"],"Puis 5 compressions abdominales si besoin."],
["Hémorragie externe d'un membre : premier geste ?",["Compression directe","Garrot d'emblée dans tous les cas","Surélever et attendre","Nettoyer la plaie"],"Le garrot vient si la compression est inefficace ou impossible."],
["Quand on pose un garrot, il faut…",["noter l'heure de pose","le desserrer toutes les 5 minutes","le cacher sous un drap","le poser sur l'articulation"],"L'heure sera demandée par l'équipe médicale."],
["Dans l'état de choc, la baisse de tension est…",["un signe tardif","le premier signe","toujours absente","sans importance"],"Pouls rapide, pâleur et marbrures apparaissent avant."],
["Dans ABCDE, la lettre C désigne…",["la circulation","la conscience","le cœur uniquement","la chaleur"],"A voies aériennes, B respiration, C circulation, D neurologique, E exposition."]],

{t:"Voie veineuse périphérique et perfusion",s:"Poser un cathéter, le surveiller, calculer un débit.",
f:[
["Préparer la pose","<ul><li><b>Prescription</b> médicale, sauf protocole d'urgence.</li><li><b>Identité</b> du patient vérifiée, <b>information</b> et accord.</li><li><b>Choix du site</b> : membre supérieur, en commençant par le plus <b>distal</b> ; éviter le pli du coude hors urgence.</li><li><b>À éviter</b> : bras paralysé, bras du côté d'un curage ganglionnaire, bras porteur d'une fistule de dialyse, peau lésée, membre inférieur chez l'adulte.</li><li><b>Calibre</b> : le plus petit qui suffit. Repères de couleur : <b>24 G jaune</b>, <b>22 G bleu</b>, <b>20 G rose</b>, <b>18 G vert</b>, <b>16 G gris</b>, <b>14 G orange</b>. Plus le chiffre est petit, plus le cathéter est gros.</li><li>Urgence, remplissage, transfusion : 18 G ou plus gros.</li></ul>"],
["Poser le cathéter","<ol><li><b>Friction</b> hydroalcoolique des mains.</li><li><b>Garrot</b> à environ 10 cm au-dessus du site ; repérer la veine.</li><li><b>Antisepsie</b> avec un antiseptique alcoolique ; laisser <b>sécher</b> ; ne plus palper.</li><li><b>Gants</b>. Tendre la peau, biseau vers le haut, angle de <b>15 à 30°</b>.</li><li>Au <b>reflux</b> de sang : abaisser, avancer le cathéter en retirant le mandrin.</li><li><b>Desserrer le garrot</b>, comprimer en amont, retirer le mandrin et le jeter <b>immédiatement</b> dans le collecteur.</li><li>Connecter, <b>rincer</b> au sérum physiologique, vérifier l'absence de gonflement.</li><li><b>Pansement</b> stérile transparent, date.</li><li><b>Tracer</b> : date, heure, site, calibre, nom.</li></ol><p class='mut'>Deux échecs : passer la main à un collègue.</p>"],
["Surveiller et prévenir les risques","<ul><li><b>Chaque jour</b> et avant chaque injection : regarder et palper le point de ponction.</li><li><b>Veinite</b> : douleur, rougeur, chaleur, cordon dur. <b>Extravasation</b> : gonflement, douleur, peau froide et pâle, débit ralenti.</li><li>Au moindre signe : <b>arrêter</b>, retirer le cathéter, prévenir, tracer.</li><li>Retirer le cathéter dès qu'il n'est <b>plus utile</b>.</li><li><b>Accident d'exposition au sang</b> : ne pas faire saigner ; laver à l'eau et au savon ; antisepsie au moins <b>5 minutes</b> ; avis médical <b>en urgence</b> ; déclaration d'accident du travail.</li><li>On ne <b>recapuchonne</b> jamais une aiguille.</li></ul>"],
["Calculer un débit","<ul><li><b>Perfuseur standard</b> : 1 mL = <b>20 gouttes</b>.</li><li><b>Débit en gouttes par minute</b> = volume (mL) × 20 ÷ durée (minutes).</li><li><b>Raccourci</b> : débit en mL par heure ÷ 3 = gouttes par minute.</li><li>Exemple : 1 000 mL en 8 heures : 1 000 × 20 ÷ 480 = <b>42 gouttes par minute</b>.</li><li><b>Transfuseur</b> : 1 mL = 15 gouttes. <b>Perfuseur pédiatrique</b> : 1 mL = 60 gouttes.</li><li><b>Pousse-seringue</b> : débit en mL par heure = volume ÷ durée en heures.</li><li>Toujours refaire le calcul une seconde fois, et faire vérifier en cas de doute.</li></ul>"]],
q:[
["Couleur d'un cathéter 18 G ?",["Vert","Rose","Bleu","Jaune"],"20 G rose, 22 G bleu, 24 G jaune."],
["Quel cathéter est le plus gros ?",["14 G","18 G","22 G","24 G"],"Plus le chiffre est petit, plus le calibre est gros."],
["Pour un remplissage rapide en urgence, on choisit plutôt…",["un 18 G ou plus gros","un 24 G","un 22 G","une aiguille épicrânienne"],"Le débit dépend du calibre."],
["Où pose-t-on de préférence la première voie veineuse ?",["En distal sur le membre supérieur","Au pli du coude","Au pied","Au cou"],"On garde les veines proximales pour la suite."],
["Sur quel bras ne pose-t-on pas de cathéter ?",["Celui qui porte une fistule de dialyse","Le bras non dominant","Le bras droit","Le bras le plus musclé"],"Ni du côté d'un curage ganglionnaire ou d'une paralysie."],
["Après l'antisepsie, il faut…",["laisser sécher et ne plus palper","essuyer avec une compresse","souffler dessus","palper pour vérifier"],"Le temps de séchage fait partie de l'antisepsie."],
["Angle d'introduction du cathéter ?",["15 à 30°","90°","60°","0°"],"Biseau vers le haut."],
["Que fait-on du mandrin après le retrait ?",["On le jette immédiatement dans le collecteur","On le recapuchonne","On le pose sur le lit","On le garde pour un second essai"],"On ne recapuchonne jamais."],
["Gonflement, douleur et débit ralenti au point de ponction évoquent…",["une extravasation","une allergie","une veine normale","une embolie"],"On arrête et on retire le cathéter."],
["Avec un perfuseur standard, 1 mL correspond à…",["20 gouttes","10 gouttes","60 gouttes","15 gouttes"],"15 pour un transfuseur, 60 pour un perfuseur pédiatrique."],
["500 mL à passer en 4 heures, perfuseur standard : débit ?",["Environ 42 gouttes par minute","Environ 21 gouttes par minute","Environ 83 gouttes par minute","Environ 125 gouttes par minute"],"500 × 20 ÷ 240 = 41,7."],
["Après une piqûre avec une aiguille souillée, l'antisepsie dure au moins…",["5 minutes","30 secondes","1 minute","1 heure"],"Après lavage à l'eau et au savon, sans faire saigner."]],

{t:"Plaies et sutures",s:"Évaluer une plaie, préparer et assister une suture, suivre la cicatrisation.",
f:[
["Évaluer une plaie","<ul><li><b>Quand</b> et <b>comment</b> : heure, mécanisme (coupure, écrasement, morsure), objet en cause.</li><li><b>Où</b> : les plaies de la <b>face</b>, de la <b>main</b>, en regard d'une <b>articulation</b>, du thorax, de l'abdomen et du cou sont à risque.</li><li><b>En aval</b> : sensibilité, mobilité, pouls, coloration. Un déficit signe une atteinte profonde.</li><li><b>Dans la plaie</b> : profondeur, souillure, corps étranger.</li><li><b>Le patient</b> : vaccination antitétanique, diabète, anticoagulants, allergies.</li><li><b>Plaie en mer ou sur le récif</b> : risque infectieux élevé ; lavage abondant et avis médical.</li><li><b>Avis médical rapide</b> : plaie profonde, morsure, déficit en aval, saignement qui ne cède pas, plaie très souillée.</li></ul>"],
["Qui fait quoi","<ul><li>La <b>suture cutanée</b> est un <b>acte médical</b>. La <b>sage-femme</b> suture le périnée.</li><li>L'<b>infirmier</b> : évalue, lave, prépare le matériel, <b>assiste</b>, fait le pansement, surveille, retire les fils <b>sur prescription</b>, éduque le patient.</li><li>Des protocoles de coopération ou une pratique avancée peuvent élargir ce rôle : vérifie le cadre qui s'applique à ton poste avant tout geste.</li><li><b>Préparation</b> : lavage abondant au sérum physiologique, antisepsie, champ stérile, anesthésie locale réalisée par le médecin.</li><li><b>Plateau</b> : porte-aiguille, pince à disséquer, ciseaux, fil, compresses stériles, collecteur à portée de main.</li></ul>"],
["Comprendre les techniques","<ul><li><b>Point simple séparé</b> : le plus courant ; chaque point est indépendant.</li><li><b>Surjet</b> : un seul fil continu ; rapide, sur plaie nette.</li><li><b>Point de Blair-Donati</b> : pour les plaies sous tension ; il affronte bien les berges.</li><li><b>Plan profond</b> : fil <b>résorbable</b>. <b>Peau</b> : fil non résorbable, à retirer.</li><li><b>Taille du fil</b> : plus le chiffre avant le zéro est grand, plus le fil est fin. 5/0 ou 6/0 pour le visage, 3/0 ou 4/0 pour le corps.</li><li><b>Sans fil</b> : colle cutanée ou bandelettes adhésives pour une plaie superficielle, nette, sans tension ; agrafes pour le cuir chevelu.</li><li><b>Principe</b> : berges affrontées, sans tension excessive, pour ne pas étrangler les tissus.</li></ul>"],
["Après la suture","<ul><li><b>Pansement</b> propre et sec ; consignes écrites.</li><li><b>Signes d'infection</b> à expliquer : rougeur qui s'étend, chaleur, douleur qui augmente, écoulement, fièvre.</li><li><b>Ablation des fils</b>, repères habituels : <b>visage 5 jours</b> ; cuir chevelu 7 à 10 jours ; tronc et membres <b>10 à 14 jours</b> ; zones de tension et articulations 14 jours ou plus. La prescription fait foi.</li><li><b>Délai de suture</b> : classiquement dans les <b>6 heures</b> ; davantage pour le visage et le cuir chevelu, sur décision médicale.</li><li><b>Morsures</b> : souvent laissées ouvertes, sauf au visage ; avis médical.</li><li><b>Tétanos</b> : vérifier et tracer le statut vaccinal.</li></ul>"]],
q:[
["La suture d'une plaie cutanée est…",["un acte médical","un acte du rôle propre infirmier","un acte de l'aide-soignant","un geste libre"],"L'infirmier prépare, assiste et surveille."],
["Quelle professionnelle suture le périnée après l'accouchement ?",["La sage-femme","L'aide-soignante","L'auxiliaire de puériculture","La secrétaire médicale"],"Pour les lésions simples."],
["Avant de fermer une plaie, le premier soin est…",["un lavage abondant","la pose d'un pansement sec","une pommade antibiotique","l'application de glace"],"Au sérum physiologique, puis antisepsie."],
["Perte de sensibilité en aval d'une plaie de la main : cela évoque…",["une atteinte nerveuse, avis médical","une plaie banale","un simple hématome","une allergie"],"Tout déficit en aval signe une lésion profonde."],
["Quel fil utilise-t-on pour un plan profond ?",["Un fil résorbable","Un fil d'acier","Un fil de pêche","Aucun"],"Il n'aura pas à être retiré."],
["Entre un fil 3/0 et un fil 6/0, lequel est le plus fin ?",["Le 6/0","Le 3/0","Ils sont identiques","Cela dépend de la couleur"],"Le 6/0 sert par exemple au visage."],
["Le point le plus courant pour la peau ?",["Le point simple séparé","Le nœud de chaise","Le point de croix","Le point arrière"],"Chaque point est indépendant."],
["Pour une plaie superficielle, nette et sans tension, on peut utiliser…",["de la colle cutanée ou des bandelettes","un garrot","des agrafes sur le visage","rien du tout"],"Sur décision médicale."],
["Repère habituel pour l'ablation des fils du visage ?",["5 jours","15 jours","21 jours","1 jour"],"Pour limiter les marques."],
["Repère habituel pour le tronc et les membres ?",["10 à 14 jours","2 jours","5 jours","1 mois"],"Plus long sur les articulations."],
["Les morsures sont souvent…",["laissées ouvertes, sauf au visage","suturées serré tout de suite","collées","ignorées"],"Le risque infectieux est élevé."],
["Devant toute plaie, on vérifie…",["la vaccination antitétanique","le groupe sanguin","la vue","la glycémie de la famille"],"Et on le trace."]],

{t:"Médicaments, calculs de doses et sécurité",s:"Administrer sans erreur, transfuser en sécurité, prévenir les infections.",
f:[
["La règle des 5 B","<ul><li>Le <b>Bon patient</b> : identité vérifiée à chaque fois (nom, prénom, date de naissance, bracelet).</li><li>Le <b>Bon médicament</b> : lire l'étiquette trois fois.</li><li>La <b>Bonne dose</b>.</li><li>La <b>Bonne voie</b>.</li><li>Le <b>Bon moment</b>.</li><li>S'y ajoutent : vérifier les <b>allergies</b>, la date de péremption, et <b>tracer</b> aussitôt.</li><li>Prescription <b>orale</b> : seulement en urgence, répétée à voix haute, et régularisée par écrit.</li><li>Un doute : on <b>n'administre pas</b>, on demande.</li><li>Une erreur : on la <b>signale</b> tout de suite. Se taire est la seule faute impardonnable.</li></ul>"],
["Calculer une dose","<ul><li><b>Formule</b> : volume à prélever = dose prescrite × volume du flacon ÷ dose du flacon.</li><li>Exemple : 600 mg prescrits, flacon de 1 g dans 10 mL : 600 × 10 ÷ 1 000 = <b>6 mL</b>.</li><li><b>Dose au poids</b> : dose = mg par kg × poids. 15 mg/kg pour 20 kg = 300 mg.</li><li><b>Unités</b> : 1 g = 1 000 mg ; 1 mg = 1 000 microgrammes. Une erreur de virgule multiplie par 10.</li><li><b>Pourcentage</b> : une solution à 10 % contient 10 g pour 100 mL.</li><li>Vérifier que le résultat est <b>plausible</b>, et faire un double contrôle pour les médicaments à risque.</li></ul>"],
["Transfuser en sécurité","<ul><li><b>Avant</b> : prescription, information du patient, constantes de départ.</li><li><b>À réception</b> : conformité du produit, délai, aspect.</li><li><b>Contrôle ultime au lit du patient</b>, en deux temps : concordance entre l'<b>identité</b>, le produit et les documents ; puis contrôle de <b>compatibilité ABO</b>.</li><li>Ce contrôle se fait <b>au lit</b>, par celui qui pose, sans interruption.</li><li><b>Surveillance</b> rapprochée les <b>15 premières minutes</b>, puis régulière.</li><li><b>Réaction</b> (frissons, fièvre, douleur lombaire, malaise, gêne respiratoire) : <b>arrêter</b>, garder la voie veineuse, appeler le médecin, conserver la poche.</li><li>Tracer.</li></ul>"],
["Hygiène et précautions standard","<ul><li><b>Friction hydroalcoolique</b> : le geste le plus efficace contre les infections liées aux soins.</li><li><b>5 moments</b> : avant de toucher le patient ; avant un geste aseptique ; après un risque d'exposition à un liquide biologique ; après avoir touché le patient ; après avoir touché son environnement.</li><li><b>Gants</b> : seulement en cas de contact avec un liquide biologique, une muqueuse ou une peau lésée ; une paire, un soin.</li><li><b>Tablier, masque, lunettes</b> s'il y a un risque de projection.</li><li><b>Piquants et tranchants</b> : collecteur à portée de main, jamais rempli au-delà de la limite.</li><li>Les précautions complémentaires (contact, gouttelettes, air) s'ajoutent sur prescription.</li></ul>"]],

function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};
      if(tmax)count(tmax,document.getElementById("tmr"),()=>fin(0,`Temps écoulé. La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`))}
    else{const pool=shuf(Q.it.map((t,k)=>[t,k]));let pick=[];
      const draw=()=>{z.innerHTML=`<p class="mut">Touche les étapes dans l'ordre. Touche une étape déjà placée pour l'enlever.</p><div id="chosen">${pick.map((p,n)=>`<button class="opt" data-p="${n}" style="border-color:var(--lag)"><b>${n+1}.</b> ${p[0]}</button>`).join("")}</div>${pick.length<pool.length?`<p class="mut" style="margin-top:10px">À placer :</p>`:""}<div>${pool.filter(p=>!pick.includes(p)).map(p=>`<button class="opt" data-k="${p[1]}">${p[0]}</button>`).join("")}</div>${pick.length===pool.length?`<button class="btn" id="val">Valider l'ordre</button>`:""}`;
        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});
        z.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
        const v=document.getElementById("val");if(v)v.onclick=()=>{const good=pick.filter((p,n)=>p[1]===n).length,sc=good/pool.length;
          z.innerHTML=`<p class="mut">Ordre correct :</p>`+Q.it.map((t,n)=>`<div class="opt ${pick[n][1]===n?"good":"bad"}"><b>${n+1}.</b> ${t}</div>`).join("");fin(sc===1?1:Math.round(sc*100)/100,sc===1?"Exact.":`${good} étape(s) bien placée(s) sur ${pool.length}.`)}};
      draw();if(tmax)count(tmax*1.5,document.getElementById("tmr"),()=>{z.innerHTML=Q.it.map((t,n)=>`<div class="opt"><b>${n+1}.</b> ${t}</div>`).join("");fin(0,"Temps écoulé.")})}})()}

const NS=L.length*5,KEY="fenua-ide-v1",DAYN=["J1","J2","J3","J4","J5"];

function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rng=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
const today=()=>new Date().toISOString().slice(0,10);
function mix(n,l){ // révision : erreurs d'abord, puis tirage dans les niveaux déjà vus
  const pool=[];for(let i=0;i<=l;i++)L[i].q.forEach((_,k)=>pool.push(i+"."+k));
  const w=shuf(S.w.filter(k=>pool.includes(k))),rest=shuf(pool.filter(k=>!w.includes(k)));
  return w.concat(rest).slice(0,n).map(k=>k.split(".").map(Number));}
function plan(l,d){const Q=a=>a.map(k=>[l,k]),m=SIMMAP[l],sn=m==="dil"?"Dilemmes de soignant":"Atelier : "+AT[+m.slice(2)].t;
  return [
  [{k:"lire",f:[0,1],m:12},{k:"quiz",q:()=>Q(rng(0,6)),m:10},{k:"sim",m:15,n:sn}],
  [{k:"lire",f:[2,3],m:12},{k:"quiz",q:()=>Q(rng(6,12)),m:10},{k:"cas",c:[0],m:8}],
  [{k:"oral",o:[0],m:10},{k:"cas",c:[1],m:8},{k:"quiz",q:()=>mix(8,l),m:10,n:"Révision"}],
  [{k:"oral",o:[1],m:10},{k:"lire",f:[0,1,2,3],m:12,n:"Relecture des fiches"},{k:"quiz",q:()=>mix(10,l),m:12,n:"Révision ciblée"}],
  [{k:"quiz",q:()=>shuf(Q(rng(0,12))),m:15,n:"Épreuve du niveau"},{k:"ecrit",m:30}]][d];}
const LBL={sim:["🧩","Simulation"],lire:["📖","Fiches à lire"],quiz:["✅","Quiz"],cas:["🧭","Mise en situation"],oral:["🎙️","Devant le jury"],ecrit:["✍️","Cas écrit"]};
const sk=(l,d,i)=>l+"."+d+"."+i;
const dayDone=(l,d)=>plan(l,d).every((_,i)=>sk(l,d,i) in S.s);
function curDay(){for(let n=0;n<NS;n++){const l=Math.floor(n/5),d=n%5;if(!dayDone(l,d))return n}return NS}
function streak(){let n=0,dt=new Date();const has=x=>S.days.includes(x.toISOString().slice(0,10));
  if(!has(dt))dt.setDate(dt.getDate()-1);while(has(dt)){n++;dt.setDate(dt.getDate()-1)}return n}
const RANKS=[[0, "Étudiant"], [150, "Soignant débutant"], [400, "Soignant"], [800, "Soignant confirmé"], [1300, "Référent"], [1900, "Référent urgences"], [2600, "Expert"]];
function rank(){let r=RANKS[0],nx=null;for(const x of RANKS){if(S.xp>=x[0])r=x;else{nx=x;break}}return{r,nx}}
function gain(key,score){const first=!(key in S.s);const xp=first?10+Math.round(score/5):5;
  if(key)S.s[key]=Math.max(S.s[key]||0,score);S.xp+=xp;if(!S.days.includes(today()))S.days.push(today());save();return xp}
const TTS=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);
let AU=null,AUSRC=null,AUBLOB={};
function hush(){try{if(TTS)speechSynthesis.cancel()}catch(e){}try{if(AU){AU.pause();AU=null}}catch(e){}}
function prefetch(src){AUSRC=src;if(!src||AUBLOB[src])return;try{fetch(src).then(r=>r.ok?r.blob():null).then(b=>{if(b)AUBLOB[src]=URL.createObjectURL(b)}).catch(()=>{})}catch(e){}}
function toast(t){let d=document.getElementById("tst");if(!d){d=document.createElement("div");d.id="tst";d.style.cssText="position:fixed;left:12px;right:12px;bottom:80px;background:#14323a;color:#fff;padding:12px 14px;border-radius:12px;font-size:14.5px;z-index:9";document.body.appendChild(d)}d.textContent=t;d.style.display="block";clearTimeout(d._t);d._t=setTimeout(()=>d.style.display="none",6000)}
function playFile(btn){const src=AUBLOB[AUSRC]||AUSRC;try{const a=new Audio(src);AU=a;a.onended=a.onerror=()=>{if(AU===a){AU=null;btn.textContent="🔊 Écouter"}};const pr=a.play();btn.textContent="⏹ Arrêter";if(pr&&pr.catch)pr.catch(()=>{AU=null;btn.textContent="🔊 Écouter";toast("Lecture impossible ici. Ouvre le jeu dans Chrome pour l'écouter.")})}catch(e){toast("Lecture impossible ici.")}}
function halt(){if(tm){clearInterval(tm);tm=null}hush()}
function readOut(btn){
  if(AU||(TTS&&speechSynthesis.speaking)){hush();btn.textContent="🔊 Écouter";return}
  if(!TTS)return toast("La lecture audio utilise la voix du téléphone : ouvre le jeu dans Chrome ou installe l'application (Profil).")
  try{
  const box=document.createElement("div");app.querySelectorAll(".card").forEach(c=>box.appendChild(c.cloneNode(true)));
  box.querySelectorAll("textarea,.timer,.btn,.tag,.av,input").forEach(x=>x.remove());
  box.querySelectorAll("li,p,h2,h3,.opt,.fb,label,b").forEach(x=>x.append(". "));
  const txt=box.textContent.replace(/[✓✗≈«»]/g," ").replace(/\s+/g," ").trim();if(!txt)return;
  const parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];let n=0;
  parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
    u.onend=u.onerror=()=>{if(++n>=parts.length)btn.textContent="🔊 Écouter"};speechSynthesis.speak(u)});
  btn.textContent="⏹ Arrêter"}catch(e){}}
function hdr(title,back){return `<div class="top"><button class="back" id="bk">←</button><b>${title}</b><button class="au" id="au">🔊 Écouter</button></div>`}
function bindBack(fn){const b=document.getElementById("bk");if(b)b.onclick=()=>{halt();fn()};const a=document.getElementById("au");if(a)a.onclick=()=>readOut(a)}
function setNav(v){const it=[["home","🏝️","Accueil"],["parcours","🗺️","Parcours"],["fiches","📚","Fiches"],["exam","⏱️","Examens"],["profil","👤","Profil"]];
  nav.innerHTML=it.map(x=>`<button class="${x[0]===v?"on":""}" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v,a,b){halt();AUSRC=null;window.scrollTo(0,0);setNav(v);({home,parcours,fiches,conseil,profil,day,exam})[v](a,b);try{if(v!=="day")location.hash=v}catch(e){}}

  app.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:44px">${score>=80?"🌺":score>=50?"🌿":"🌱"}</div><h2>${score}%</h2><p>+${xp} points</p><p class="mut">${score>=80?"Très solide.":score>=50?"C'est en bonne voie, les erreurs reviendront en révision.":"À retravailler : relis les fiches puis recommence."}</p><button class="btn" id="ok">Continuer</button></div>`;

function quiz(items,title,done,back){AUSRC=null;let i=0,ok=0;if(!items.length)return done(100);(function show(){const [l,k]=items[i],Q=L[l].q[k],o=shuf(Q[1].map((t,j)=>[t,j===0]));hush();window.scrollTo(0,0);
  app.innerHTML=hdr(`${title} · ${i+1}/${items.length}`)+`<div class="card"><span class="tag">Niveau ${l+1}</span><p class="q">${Q[0]}</p>${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
  bindBack(back);const bs=app.querySelectorAll(".opt");
    if(dif()>0){const tb=document.createElement("div");tb.className="timer";tb.style.fontSize="22px";app.querySelector(".card").prepend(tb);count(dif()===2?25:45,tb,()=>{const k2=l+"."+k;if(!S.w.includes(k2))S.w.push(k2);save();bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});document.getElementById("fb").innerHTML=`<div class="fb"><b>Temps écoulé.</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})}
    bs.forEach((b,j)=>b.onclick=()=>{halt();const good=o[j][1],key=l+"."+k;bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});
    if(good){ok++;S.w=S.w.filter(z=>z!==key)}else{b.classList.add("bad");if(!S.w.includes(key))S.w.push(key)}save();
    document.getElementById("fb").innerHTML=`<div class="fb"><b>${good?"Exact.":"Pas tout à fait."}</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;
    document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})})()}
function cas(l,cs,done,back){AUSRC=null;let i=0,pts=0;(function show(){const C=L[l].c[cs[i]],o=shuf(C.o);hush();window.scrollTo(0,0);
  app.innerHTML=hdr(`Situation ${i+1}/${cs.length}`)+`<div class="card"><h2 style="margin-top:0">${C.t}</h2><p>${C.s}</p><p class="mut">Que fais-tu ?</p>${o.map((x,j)=>`<button class="opt" data-j="${j}">${x[0]}</button>`).join("")}<div id="fb"></div></div>`;
  bindBack(back);const bs=app.querySelectorAll(".opt");bs.forEach((b,j)=>b.onclick=()=>{pts+=o[j][1];bs.forEach((x,m)=>{x.disabled=true;{const c=o[m][1]===2?"good":o[m][1]===0?"bad":"";if(c)x.classList.add(c)};x.innerHTML+=`<br><small>${["✗","≈","✓"][o[m][1]]} ${o[m][2]}</small>`});b.style.outline="3px solid var(--gold)";
    document.getElementById("fb").innerHTML=`<button class="btn" id="nx">${i<cs.length-1?"Situation suivante":"Terminer"}</button>`;
    document.getElementById("nx").onclick=()=>{i++;i<cs.length?show():done(Math.round(pts/(cs.length*2)*100))}})})()}
function timerBox(sec){return `<div class="timer" id="tmr">${fmt(sec)}</div><div class="row"><button class="btn sec" id="tgo" style="margin:0">Démarrer le chrono</button></div>`}
const fmt=s=>(s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60))+":"+String(s%60).padStart(2,"0");
function bindTimer(sec){let left=sec;const el=document.getElementById("tmr"),b=document.getElementById("tgo");b.onclick=()=>{if(tm){halt();b.textContent="Reprendre";return}b.textContent="Pause";tm=setInterval(()=>{left--;el.textContent=fmt(Math.max(0,left));if(left<=0){halt();el.textContent="Temps écoulé";b.disabled=true}},1000)}}
function oral(list,done,back){AUSRC=null;let i=0,tot=0;(function show(){const [l,k]=list[i],O=L[l].o[k],j=J[O[0]];halt();window.scrollTo(0,0);

    document.getElementById("nx").onclick=()=>{tot+=app.querySelectorAll("input:checked").length/O[2].length;i++;i<list.length?show():done(Math.round(tot/list.length*100))}}})()}

function fiches(){app.innerHTML=`<h1>Fiches</h1><p class="mut">Tout le cours, à relire quand tu veux.</p><button class="btn sec" id="rep">📌 Aide-mémoire : les repères à connaître</button>`+L.map((x,l)=>`<div class="card"><h3>${l+1}. ${x.t}</h3>${x.f.map((f,i)=>`<button class="opt" data-l="${l}" data-i="${i}">${f[0]}</button>`).join("")}</div>`).join("");

function say(t){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.97;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
function count(sec,el,onEnd){let left=sec;el.textContent=fmt(left);if(tm)clearInterval(tm);tm=setInterval(()=>{left--;el.textContent=fmt(Math.max(0,left));if(left<=0){clearInterval(tm);tm=null;onEnd()}},1000)}

function exam(){app.innerHTML=`<h1>Conditions réelles</h1><p class="mut">Chrono sans pause, aucune correction avant la fin.</p>

  <div class="card warn"><h3>Ce que le jeu ne remplace pas</h3><p class="mut">Aucun écran ne remplace le geste. Entraîne-toi sur mannequin et avec un collègue expérimenté.</p></div>`;
  const pool=()=>{const p=X.slice();L.forEach(x=>x.o.forEach(o=>p.push(o)));return p};
  document.getElementById("e1").onclick=()=>examOral({t:"Oral soins",expo:5,total:20,pool});

function examOral(o){AUSRC=null;const back=()=>go("exam"),asked=[];
  app.innerHTML=hdr(o.t)+`<div class="card fiche"><h2 style="margin-top:0">Déroulement</h2><ul><li><b>${o.expo} minutes</b> d'exposé : ton parcours et ton projet. À la fin du temps, le jury te coupe.</li><li>Puis des questions jusqu'à <b>${o.total} minutes</b> au total, sans préparation, avec des relances.</li><li>Réponds <b>à voix haute</b>. Tu ne verras les attendus qu'au débriefing.</li><li>Aucune pause. Quitter l'écran annule l'épreuve.</li></ul><label class="ck" style="border:0"><input type="checkbox" id="vx" ${TTS?"checked":"disabled"}><span>Le jury pose ses questions à voix haute${TTS?"":" (indisponible sur cet appareil)"}</span></label><button class="btn" id="st">Entrer dans la salle</button></div>`;
  bindBack(back);document.getElementById("st").onclick=()=>p1(document.getElementById("vx").checked);
  function p1(voice){const line=`Bonjour. Installez-vous. Vous avez ${o.expo} minutes pour vous présenter, nous vous écoutons.`,t0=Date.now();window.scrollTo(0,0);
    app.innerHTML=`<div class="card"><span class="tag">Exposé</span><p class="q">« ${line} »</p><div class="timer" id="tmr"></div><p class="mut">Regarde l'écran comme tu regarderais le jury. Ne lis pas tes notes.</p><button class="btn" id="nx">J'ai terminé mon exposé</button></div>`;
    if(voice)say(line);const nx=cut=>{clearInterval(tm);tm=null;p2(voice,cut,Math.round((Date.now()-t0)/1000))};
    count(o.expo*60,document.getElementById("tmr"),()=>nx(true));document.getElementById("nx").onclick=()=>nx(false)}
  function p2(voice,cut,used){const qs=shuf(o.pool()).slice(0,16);let i=-1,rel=false,over=false;window.scrollTo(0,0);
    const fin=()=>{if(over)return;over=true;clearInterval(tm);tm=null;hush();debrief(cut,used)};
    app.innerHTML=`<div class="card"><span class="tag">Entretien</span><div class="timer" id="tmr"></div><div id="qz"></div><button class="btn" id="nx">J'ai répondu : question suivante</button></div>`;
    count(Math.max(60,o.total*60-used),document.getElementById("tmr"),fin);
    const put=(q,txt,pre)=>{const j=J[q[0]];document.getElementById("qz").innerHTML=`<div class="jur"><div class="av" style="background:${j.c}">${j.n.split(" ").pop()[0]}</div><div><b>${j.n}</b><br><small>${j.r}</small></div></div><p class="q">« ${pre||""}${txt} »</p>`;if(voice)say((pre||"")+txt)};
    const nxt=()=>{if(!rel&&i>=0&&Math.random()<.35){rel=true;put(qs[i],RELANCES[Math.floor(Math.random()*RELANCES.length)])}else{rel=false;i++;if(i>=qs.length)return fin();asked.push(qs[i]);put(qs[i],qs[i][1],i===0&&cut?"Je vous interromps, le temps de l'exposé est écoulé. ":"")}};

["Le suivi de la grossesse normale","<ul><li><b>7 consultations</b> prénatales et <b>3 échographies</b> : vers 12, 22 et 32 semaines d'aménorrhée (SA).</li><li><b>À chaque consultation</b> : tension artérielle, poids, bandelette urinaire, hauteur utérine, bruits du cœur, mouvements du bébé.</li><li><b>Terme</b> : 41 SA. Prématurité : avant 37 SA.</li><li><b>Signes d'alerte</b> à enseigner : saignement, perte de liquide, diminution des mouvements, contractions régulières avant 37 SA, fièvre, maux de tête avec troubles de la vue, œdèmes brutaux.</li><li><b>Au fenua</b> : anticiper le lieu d'accouchement pour les femmes des îles éloignées et organiser le transfert avant le terme.</li></ul><p class='mut'>Ce cours aide à réviser. Les protocoles de ta maternité et les recommandations en vigueur font foi.</p>"],
["Le travail et le partogramme","<ul><li><b>Phase de latence</b> : col qui se modifie lentement. <b>Phase active</b> : à partir de <b>5 à 6 cm</b>.</li><li><b>Partogramme</b> : ouvert en phase active ; dilatation, descente, contractions, rythme cardiaque fœtal, liquide, constantes, traitements, heure de chaque événement.</li><li><b>Rythme cardiaque fœtal normal</b> : <b>110 à 160</b> battements par minute, variabilité présente, accélérations, pas de ralentissements.</li><li><b>Anomalies</b> : bradycardie prolongée, ralentissements tardifs répétés, variabilité absente : appel de l'obstétricien.</li><li>La sage-femme soutient, hydrate, propose les positions et le soulagement de la douleur.</li></ul>"],
["Naissance et délivrance","<ul><li><b>Dégagement</b> : contrôler la sortie de la tête, vérifier un éventuel circulaire du cordon.</li><li><b>Délivrance dirigée</b> : injection d'<b>ocytocine</b> au dégagement de l'épaule ou juste après la naissance, selon le protocole. Elle réduit les hémorragies.</li><li><b>Délivrance</b> dans les <b>30 minutes</b>. Au-delà : appel de l'obstétricien.</li><li><b>Examen du placenta</b> : complet ou non, membranes, cordon.</li><li><b>Surveillance de 2 heures</b> en salle de naissance : saignement, <b>globe utérin</b>, pouls, tension, toutes les 15 minutes.</li><li>Les pertes se <b>mesurent</b> avec un sac de recueil : l'œil sous-estime toujours.</li></ul>"],
["Hypertension et pré-éclampsie","<ul><li><b>Hypertension</b> : à partir de <b>140/90</b> mmHg.</li><li><b>Pré-éclampsie</b> : hypertension après 20 SA avec protéinurie.</li><li><b>Sévère</b> : à partir de <b>160/110</b>, ou signes de gravité.</li><li><b>Signes de gravité</b> : maux de tête, troubles de la vue, bourdonnements d'oreille, douleur en barre au creux de l'estomac, réflexes vifs, urines rares.</li><li><b>Complications</b> : éclampsie, HELLP, hématome rétroplacentaire, souffrance fœtale.</li><li>Conduite : appel du médecin, bilan, surveillance rapprochée, transfert vers une maternité adaptée. Le seul traitement est la naissance.</li></ul>"]],
q:[
["Combien d'échographies sont prévues pour une grossesse normale ?",["3","1","5","7"],"Vers 12, 22 et 32 SA."],
["Le terme est fixé à…",["41 SA","37 SA","39 SA","43 SA"],"On parle de prématurité avant 37 SA."],
["Rythme cardiaque fœtal normal ?",["110 à 160 battements par minute","60 à 100","160 à 200","80 à 120"],"Avec variabilité et accélérations."],
["La phase active du travail commence vers…",["5 à 6 cm","1 cm","3 cm","10 cm"],"Avant, c'est la phase de latence."],
["À quoi sert le partogramme ?",["À suivre heure par heure le travail et repérer une anomalie","À calculer la paie","À remplacer le dossier médical","À rien d'obligatoire"],"C'est aussi une pièce du dossier."],
["La délivrance dirigée consiste à injecter…",["de l'ocytocine autour de la naissance","un antibiotique","de l'adrénaline","du glucose"],"Elle diminue le risque d'hémorragie."],
["Sans délivrance au bout de combien de temps appelle-t-on l'obstétricien ?",["30 minutes","5 minutes","2 heures","12 heures"],"Pour une délivrance artificielle."],
["Durée de la surveillance en salle de naissance après l'accouchement ?",["2 heures","15 minutes","24 heures","30 minutes"],"Saignement, globe utérin, constantes."],
["Comment évalue-t-on les pertes sanguines ?",["Avec un sac de recueil gradué","À l'œil","En demandant à la patiente","On ne les évalue pas"],"L'estimation visuelle sous-estime."],
["Seuil d'hypertension pendant la grossesse ?",["140/90 mmHg","120/80","160/110","100/60"],"160/110 définit la forme sévère."],
["Douleur en barre à l'estomac et maux de tête chez une femme hypertendue enceinte : cela évoque…",["une pré-éclampsie sévère","une indigestion","une migraine banale","le début du travail"],"Appel médical immédiat."],

{t:"Les urgences obstétricales",s:"Hémorragie du post-partum, éclampsie, dystocie des épaules, procidence du cordon.",
f:[
["L'hémorragie du post-partum","<ul><li><b>Définition</b> : pertes de <b>500 mL ou plus</b> dans les 24 heures ; <b>sévère</b> à partir de 1 000 mL.</li><li><b>Causes, les 4 T</b> : <b>Tonus</b> (atonie utérine, la plus fréquente), <b>Tissu</b> (rétention placentaire), <b>Traumatisme</b> (déchirure), <b>Thrombine</b> (trouble de la coagulation).</li><li><b>Tout de suite</b> : appeler l'équipe (obstétricien, anesthésiste), <b>noter l'heure</b>, mesurer les pertes.</li><li><b>Gestes</b> : massage utérin, vessie vidée, vérification de la délivrance, révision utérine, examen de la filière sous valves.</li><li><b>Médicaments</b> selon protocole : <b>ocytocine</b> ; si échec dans les <b>30 minutes</b>, <b>sulprostone</b> ; <b>acide tranexamique</b>.</li><li><b>Réanimation</b> : deux voies veineuses, remplissage, oxygène, réchauffement, bilan sanguin.</li><li>Ensuite : ballon de tamponnement, embolisation ou chirurgie.</li></ul>"],
["L'éclampsie","<ul><li><b>Crise convulsive</b> chez une femme enceinte ou accouchée, sur pré-éclampsie.</li><li><b>Pendant la crise</b> : protéger des chocs, ne rien mettre dans la bouche, appeler.</li><li><b>Après</b> : position latérale gauche, voies aériennes libres, oxygène, voie veineuse.</li><li><b>Sulfate de magnésium</b> : traitement de référence. Dose de charge de <b>4 g</b> par voie veineuse lente en 20 minutes, puis <b>1 g par heure</b>, selon protocole.</li><li><b>Surveillance du magnésium</b> : réflexes, fréquence respiratoire, urines, conscience. <b>Antidote</b> : gluconate de calcium.</li><li>Traitement de l'hypertension sévère, puis <b>naissance</b> une fois la mère stabilisée.</li></ul>"],
["La dystocie des épaules","<ul><li><b>Signe</b> : la tête sort puis se rétracte contre le périnée (signe de la tortue) ; les épaules ne suivent pas.</li><li><b>Appeler</b> à l'aide, <b>noter l'heure</b>.</li><li><b>Ne pas</b> tirer sur la tête, <b>ne pas</b> la faire pivoter, <b>ne pas</b> appuyer sur le fond de l'utérus.</li><li><b>1.</b> Manœuvre de <b>McRoberts</b> : cuisses fléchies à fond sur l'abdomen.</li><li><b>2.</b> <b>Pression sus-pubienne</b> par un aide, pour dégager l'épaule antérieure.</li><li><b>3.</b> Si échec : manœuvres internes, <b>Wood inversé</b> ou <b>Jacquemier</b> (dégagement du bras postérieur).</li><li>Après : examen du nouveau-né (clavicule, mobilité du bras), surveillance de l'hémorragie, traçabilité minute par minute.</li></ul>"],
["Procidence du cordon et hématome rétroplacentaire","<ul><li><b>Procidence du cordon</b> : le cordon passe devant la présentation après la rupture des membranes. Le bébé comprime son propre cordon.</li><li><b>Conduite</b> : <b>refouler la présentation</b> avec la main sans toucher le cordon, garder la main en place ; position tête basse ou genoux-poitrine ; appeler ; <b>césarienne en urgence</b>. On ne remet pas le cordon en place.</li><li><b>Hématome rétroplacentaire</b> : douleur abdominale brutale, <b>utérus dur</b> qui ne se relâche pas, saignement noirâtre parfois minime, anomalies du rythme cardiaque fœtal, état de choc.</li><li><b>Conduite</b> : appel immédiat, voies veineuses, bilan de coagulation, naissance en urgence.</li><li>Dans les deux cas, chaque minute compte : on appelle avant de finir l'examen.</li></ul>"]],
q:[
["À partir de quel volume parle-t-on d'hémorragie du post-partum ?",["500 mL","100 mL","250 mL","2 000 mL"],"Sévère à partir de 1 000 mL."],
["Première cause d'hémorragie du post-partum ?",["L'atonie utérine","La déchirure du col","Le trouble de la coagulation","La rupture utérine"],"Le T de Tonus."],
["Les « 4 T » sont…",["Tonus, Tissu, Traumatisme, Thrombine","Tension, Température, Terme, Travail","Temps, Toucher, Tête, Tronc","Tabac, Thé, Tisane, Travail"],"Les quatre familles de causes."],
["Devant une hémorragie du post-partum, un des tout premiers réflexes est de…",["noter l'heure et appeler l'équipe","attendre de voir si cela s'arrête","faire lever la patiente","donner à manger"],"La prise en charge est chronométrée."],
["Si l'ocytocine ne suffit pas, le traitement suivant doit être lancé dans les…",["30 minutes","6 heures","24 heures","3 jours"],"Sulprostone, selon protocole."],
["Traitement de référence de l'éclampsie ?",["Le sulfate de magnésium","L'aspirine","L'ocytocine","Le paracétamol"],"4 g en dose de charge, puis 1 g par heure, selon protocole."],
["Antidote du sulfate de magnésium ?",["Le gluconate de calcium","L'adrénaline","L'insuline","La vitamine K"],"À garder à portée de main."],
["Sous sulfate de magnésium, on surveille notamment…",["les réflexes et la fréquence respiratoire","la vue","la glycémie seulement","le poids"],"Leur disparition signe un surdosage."],
["Première manœuvre devant une dystocie des épaules ?",["McRoberts","Jacquemier","Expression sur le fond utérin","Traction forte sur la tête"],"Avec une pression sus-pubienne."],
["Dans la dystocie des épaules, il ne faut surtout pas…",["appuyer sur le fond de l'utérus","appeler de l'aide","noter l'heure","fléchir les cuisses"],"Cela bloque davantage l'épaule."],
["Devant une procidence du cordon, on…",["refoule la présentation et on prépare une césarienne en urgence","remet le cordon dans l'utérus","attend la dilatation complète","fait pousser"],"Sans comprimer le cordon."],
["Douleur brutale, utérus dur en permanence, saignement noirâtre : on pense à…",["un hématome rétroplacentaire","une cystite","un faux travail","une gastro-entérite"],"Urgence vitale pour la mère et l'enfant."]],

{t:"Le nouveau-né : accueil et réanimation",s:"La première minute, le score d'Apgar, la ventilation, l'allaitement.",
f:[
["Accueillir un nouveau-né qui va bien","<ul><li><b>Sécher</b>, couvrir, bonnet : le froid est le premier danger.</li><li><b>Peau à peau</b> avec la mère, sous surveillance.</li><li><b>Clampage du cordon</b> retardé d'au moins une minute si le bébé va bien.</li><li><b>Score d'Apgar</b> à 1, 5 et 10 minutes : fréquence cardiaque, respiration, tonus, réactivité, coloration ; chaque critère noté de 0 à 2, total sur <b>10</b>.</li><li><b>Température</b> visée : 36,5 à 37,5 °C.</li><li><b>Première tétée</b> dans l'heure.</li><li>Identification, vitamine K et premiers soins selon le protocole.</li></ul>"],
["La réanimation en salle de naissance","<ul><li><b>La première minute</b> est décisive.</li><li><b>1.</b> Sécher, stimuler, garder au chaud, évaluer la <b>respiration</b> et la <b>fréquence cardiaque</b>.</li><li><b>2.</b> Pas de respiration efficace ou fréquence cardiaque <b>inférieure à 100</b> : tête en position neutre, <b>ventilation au masque</b>, à l'air ambiant pour un bébé à terme, <b>40 à 60</b> insufflations par minute.</li><li><b>3.</b> Vérifier que le thorax se soulève. Réévaluer après 30 secondes.</li><li><b>4.</b> Fréquence cardiaque <b>inférieure à 60</b> malgré une ventilation efficace : compressions thoraciques, <b>3 compressions pour 1 insufflation</b>, avec oxygène.</li><li><b>5.</b> Si échec : <b>adrénaline</b>, 10 à 30 microgrammes par kg par voie veineuse, sur décision médicale.</li><li>Appeler de l'aide tôt. La ventilation règle la grande majorité des cas.</li></ul>"],
["Situations particulières","<ul><li><b>Liquide méconial</b> : on n'aspire plus systématiquement. Si le bébé ne respire pas, on commence la ventilation.</li><li><b>Prématuré</b> : sac en plastique sans sécher pour les plus petits, table chauffante, oxygène dosé, équipe renforcée.</li><li><b>Hypothermie</b> : prévenir vaut mieux que réchauffer.</li><li><b>Hypoglycémie</b> : surveiller les bébés à risque (mère diabétique, petit poids, gros poids, prématuré) selon le protocole.</li><li><b>Naissance en site isolé</b> : préparer le matériel de ventilation <b>avant</b> chaque accouchement et le vérifier.</li></ul>"],
["Allaitement et suites de couches","<ul><li><b>Allaitement</b> : mise au sein précoce, à la demande ; bonne prise du sein ; signes que le bébé boit : déglutitions, couches mouillées, reprise du poids.</li><li><b>Suites de couches, chez la mère</b> : globe utérin, lochies, périnée ou cicatrice, mollets, tension, température, seins, mictions.</li><li><b>Moral</b> : le baby blues, vers le 3e jour, est bref. Une tristesse qui dure, un désintérêt, des idées noires : on en parle et on oriente.</li><li><b>Signes d'alerte après la sortie</b> : fièvre, saignement abondant, douleur d'un mollet, essoufflement, maux de tête intenses.</li><li><b>Contraception</b> abordée avant la sortie.</li></ul>"]],

["Quand met-on le bébé au sein pour la première fois ?",["Dans l'heure qui suit la naissance","Le lendemain","À la sortie","Après le premier bain"],"La tétée précoce aide l'allaitement et la délivrance."],
["Le baby blues survient typiquement…",["vers le 3e jour et dure peu","au 3e mois","avant l'accouchement","après un an"],"Une tristesse durable doit faire orienter."],

{t:"Périnée, sutures et exercice en site isolé",s:"Reconnaître les lésions, réparer dans les règles, connaître ses limites.",
f:[
["Les lésions du périnée","<ul><li><b>1er degré</b> : peau et muqueuse.</li><li><b>2e degré</b> : muscles du périnée, sphincter intact.</li><li><b>3e degré</b> : atteinte du <b>sphincter anal</b>.</li><li><b>4e degré</b> : atteinte de la <b>muqueuse rectale</b>.</li><li>Les <b>3e et 4e degrés</b> sont réparés par l'<b>obstétricien</b>, dans de bonnes conditions.</li><li><b>Épisiotomie</b> : jamais systématique ; médio-latérale quand elle est indiquée.</li><li>Tout périnée s'examine <b>complètement</b> : un toucher rectal recherche une lésion du sphincter avant de suturer.</li></ul>"],
["Réparer dans les règles","<ul><li><b>Conditions</b> : bonne lumière, installation confortable, <b>analgésie efficace</b> (péridurale ou anesthésie locale), asepsie.</li><li><b>Explorer</b> avant de réparer : limites de la lésion, sommet de la plaie vaginale.</li><li><b>Fil résorbable</b> à résorption rapide.</li><li><b>Plan par plan</b> : vagin en partant du sommet, muscles, puis peau. Le <b>surjet continu</b> est moins douloureux dans les suites que les points séparés.</li><li><b>À la fin</b> : compter les compresses, vérifier l'absence de saignement, toucher rectal de contrôle.</li><li><b>Tracer</b> : type de lésion, technique, fil, compte des compresses.</li><li>Informer la femme : soins, douleur, signes qui doivent la faire revenir.</li></ul>"],
["Les compétences de la sage-femme","<ul><li>Profession <b>médicale</b> à compétence définie.</li><li><b>Elle assure</b> : le suivi de la grossesse normale, l'accouchement normal, les suites de couches, le suivi du nouveau-né en bonne santé, le suivi gynécologique de prévention et la contraception, les vaccinations prévues par les textes.</li><li><b>Elle réalise</b> : l'épisiotomie et la suture des lésions simples du périnée, la réanimation du nouveau-né en attendant le médecin.</li><li><b>Elle prescrit</b> dans la limite des listes autorisées.</li><li><b>Devant une pathologie</b> : elle la dépiste et <b>adresse au médecin</b>.</li><li><b>En urgence</b> : elle fait les gestes qui sauvent en attendant.</li></ul>"],
["Exercer en site isolé","<ul><li>Au fenua, beaucoup de femmes vivent loin d'une maternité avec bloc.</li><li><b>Anticiper</b> : repérer les grossesses à risque, organiser le <b>départ avant le terme</b>.</li><li><b>En urgence</b> : appeler le <b>15</b> ; le médecin régulateur guide les soins et décide de l'<b>évacuation sanitaire</b>.</li><li><b>Transmettre clairement</b> : qui je suis, où, la patiente, le terme, ce que je constate, les chiffres, ce que j'ai fait, ce que je demande.</li><li><b>Préparer l'évacuation</b> : voie veineuse, dossier, carnet, groupe sanguin, surveillance continue, accompagnant.</li><li><b>Matériel</b> vérifié avant chaque garde ; protocoles affichés.</li><li>Après : reprendre le cas en équipe pour progresser.</li></ul>"]],

["L'épisiotomie doit être…",["réservée aux indications, jamais systématique","faite à toutes les premières naissances","faite à toutes les femmes","interdite"],"La pratique restrictive protège mieux le périnée."],
["Avant de suturer un périnée, on recherche une lésion du sphincter par…",["un toucher rectal","une radiographie","une prise de sang","une échographie cardiaque"],"Une lésion méconnue a des conséquences durables."],
["Quel fil pour réparer le périnée ?",["Un fil résorbable","Un fil d'acier","Un fil non résorbable épais","Des agrafes"],"À résorption rapide."],

{t:"Exercer au fenua : organisation et spécificités",s:"Où l'on accouche, les femmes des îles, l'évasan, le cadre d'exercice local.",
f:[
["La carte de la périnatalité","<ul><li>La <b>santé</b> est une compétence du <b>Pays</b> : les règles locales peuvent différer de celles de la métropole.</li><li><b>À Tahiti</b> : la maternité du <b>CHPF</b> (Taaone), de <b>type 3</b>, référence pour les grossesses à risque et les nouveau-nés fragiles ; deux maternités privées de type 1 à Papeete ; une maison de naissance à Pirae.</li><li><b>Dans les îles</b> : accouchements possibles à <b>Uturoa</b> (Raiatea) et à <b>Taiohae</b> (Nuku Hiva), maternités de niveau 1, pour les grossesses sans risque particulier.</li><li><b>Moorea</b> : centre périnatal de proximité, sans accouchement ; suivi de grossesse et accueil après la naissance.</li><li><b>Suivi</b> : sages-femmes et médecins libéraux, centres de protection maternelle et infantile (PMI), dispensaires, infirmeries et postes de santé.</li><li>Des <b>consultations spécialisées avancées</b> se déplacent dans les îles.</li></ul>"],
["Les femmes des îles","<ul><li>Les femmes des îles éloignées viennent à Tahiti <b>3 à 7 semaines avant</b> la date prévue de l'accouchement.</li><li>Elles sont souvent <b>seules</b>, loin de leurs enfants et de leur conjoint, parfois en situation précaire.</li><li><b>Ton rôle</b> : anticiper tôt, expliquer pourquoi, préparer le départ avec la famille, repérer l'isolement, mettre en lien avec les associations et les services sociaux.</li><li><b>Avant le départ</b> : dossier complet, résultats, carnet, coordonnées, lieu d'hébergement, accompagnant.</li><li><b>Au retour</b> : transmettre à la structure de l'île pour le suivi de la mère et de l'enfant.</li><li>Une femme qui refuse de partir n'est pas « non compliante » : elle a des raisons. On écoute, on informe, on cherche une solution.</li></ul>"],
["L'évacuation sanitaire","<ul><li><b>Évasan</b> : transfert d'un patient vers un lieu de soins adapté, le plus souvent Tahiti.</li><li><b>Programmée</b> : par vol régulier, pour un suivi ou une situation compatible avec un vol non médicalisé.</li><li><b>Urgente</b> : décidée par le <b>médecin régulateur</b> du <b>15</b>, médicalisée si nécessaire.</li><li>Certaines îles n'ont <b>pas de piste</b> : les moyens militaires (hélicoptère, avion) peuvent être réquisitionnés. Les délais se comptent en <b>heures</b>.</li><li><b>En attendant</b> : appliquer les prescriptions du régulateur, surveiller, tracer avec les heures.</li><li><b>Transmission SAED</b> : <b>S</b>ituation, <b>A</b>ntécédents, <b>É</b>valuation, <b>D</b>emande.</li><li>Dans les postes isolés, les infirmiers ont des compétences élargies par <b>protocoles</b> : travailler ensemble est vital.</li></ul>"],
["Le cadre d'exercice de la sage-femme au fenua","<ul><li><b>Textes</b> : code de déontologie local (délibération n° 97-109 APF modifiée) et lois du pays ; il existe un <b>conseil de l'ordre des sages-femmes de Polynésie française</b>.</li><li><b>Depuis la loi du pays de 2018</b> : consultations de <b>contraception</b> et de <b>suivi gynécologique de prévention</b> chez la femme en bonne santé ; prescription de <b>tous les examens</b> nécessaires à l'exercice ; médicaments nécessaires à l'exercice ; substituts nicotiniques pour l'entourage ; <b>vaccinations</b> dont la liste est fixée par arrêté.</li><li><b>Arrêt de travail</b> pendant une grossesse normale : <b>15 jours</b> au total.</li><li><b>Dispositif intra-utérin</b> : posé par un médecin ou une sage-femme.</li><li><b>Attention</b> : certaines compétences ouvertes en métropole (interruption de grossesse, arrêts plus longs) ne s'appliquent pas automatiquement ici. Vérifie auprès de l'ordre avant de pratiquer.</li></ul>"]],

{t:"Les pathologies fréquentes au fenua",s:"Obésité, diabète, cœur rhumatismal, infections tropicales.",
f:[
["Obésité et grossesse","<ul><li>Au CHPF, environ <b>une femme enceinte sur trois</b> est en situation d'obésité.</li><li><b>Risques</b> : diabète gestationnel, hypertension, pré-éclampsie, phlébite, césarienne, hémorragie, infection ; pour l'enfant : gros poids, dystocie des épaules.</li><li><b>Suivi</b> : poids et tension avec un <b>brassard adapté</b>, dépistage précoce du diabète, échographies parfois difficiles, consultation d'anesthésie tôt.</li><li><b>Conseils</b> sans jugement : prise de poids modérée, activité physique, alimentation locale riche en fibres (taro, fruits, légumes), moins de boissons sucrées.</li><li><b>Accouchement</b> : matériel adapté, voie veineuse de qualité, vigilance sur l'hémorragie.</li><li>Le respect compte : une femme qui se sent jugée ne revient pas.</li></ul>"],
["Diabète et grossesse","<ul><li>Au fenua, le <b>diabète gestationnel</b> touche environ <b>16 %</b> des grossesses, et le diabète de type 2 environ 2 %.</li><li><b>Dépistage</b> chez les femmes à risque : glycémie à jeun au premier trimestre ; puis hyperglycémie provoquée (75 g) entre <b>24 et 28 SA</b>.</li><li><b>Seuils</b> : à jeun <b>0,92 g/L</b> ; à 1 heure 1,80 g/L ; à 2 heures 1,53 g/L. Une seule valeur atteinte suffit. À jeun <b>1,26 g/L</b> ou plus : diabète de type 2.</li><li><b>Objectifs</b> : moins de 0,95 g/L à jeun ; moins de 1,20 g/L deux heures après le repas.</li><li><b>Traitement</b> : alimentation, activité, autosurveillance ; insuline si les objectifs ne sont pas atteints.</li><li><b>Risques</b> : gros bébé, dystocie des épaules, hypoglycémie du nouveau-né.</li><li><b>Après</b> : dépister un diabète de type 2 dans les mois qui suivent, puis régulièrement.</li></ul>"],
["Le cœur rhumatismal","<ul><li>Le <b>rhumatisme articulaire aigu</b> et ses séquelles cardiaques sont <b>fréquents</b> au fenua, notamment chez les femmes jeunes.</li><li>La grossesse augmente le travail du cœur : une atteinte des valves peut se révéler ou s'aggraver.</li><li><b>Interroger</b> : antécédent de rhumatisme, injections régulières de pénicilline, suivi cardiologique.</li><li><b>Signes d'alerte</b> : essoufflement inhabituel, palpitations, gêne à plat dos, œdèmes, souffle à l'auscultation.</li><li><b>Conduite</b> : avis cardiologique, poursuite de la prophylaxie prescrite, accouchement organisé dans une maternité adaptée.</li><li>Une femme des îles porteuse d'une cardiopathie relève d'un suivi à Tahiti.</li></ul>"],
["Infections à connaître","<ul><li><b>Dengue</b> : fièvre, douleurs ; <b>paracétamol</b> seulement, ni aspirine ni anti-inflammatoires ; surveiller les saignements, surtout près du terme.</li><li><b>Zika</b> : risque de malformations cérébrales du fœtus ; protection contre les moustiques.</li><li><b>Leptospirose</b> : fièvre après un contact avec de l'eau douce ou de la boue ; forme grave possible ; avis médical rapide.</li><li><b>Ciguatera</b> : intoxication par un poisson de lagon ; troubles digestifs puis neurologiques ; conseiller d'éviter les poissons à risque pendant la grossesse et l'allaitement.</li><li><b>Syphilis</b> : dépistage en début de grossesse, à répéter selon le risque ; traitement efficace.</li><li><b>Hépatite B</b> : dépistage de toutes les femmes enceintes ; si la mère est porteuse, vaccin et immunoglobulines pour le nouveau-né dans les <b>12 heures</b>.</li></ul>"]],
q:[
["Au CHPF, quelle part des femmes enceintes est en situation d'obésité ?",["Environ une sur trois","Une sur cent","Une sur vingt","Neuf sur dix"],"D'où un suivi adapté."],
["Pour prendre la tension d'une femme obèse, il faut…",["un brassard adapté","le brassard pédiatrique","renoncer","prendre au poignet sans vérifier"],"Un brassard trop petit surestime la tension."],
["Prévalence du diabète gestationnel au fenua ?",["Environ 16 %","1 %","50 %","0,1 %"],"Nettement plus qu'en métropole."],
["L'hyperglycémie provoquée de dépistage se fait entre…",["24 et 28 SA","6 et 8 SA","36 et 38 SA","après l'accouchement"],"Avec 75 g de glucose."],
["Seuil de la glycémie à jeun pour le diabète gestationnel ?",["0,92 g/L","0,70 g/L","1,10 g/L","2 g/L"],"À partir de 1,26 g/L : diabète de type 2."],
["Objectif de glycémie deux heures après un repas ?",["Moins de 1,20 g/L","Moins de 2 g/L","Moins de 0,60 g/L","Aucun objectif"],"Et moins de 0,95 g/L à jeun."],
["Risque pour le bébé d'une mère diabétique à la naissance ?",["L'hypoglycémie","L'hyperthermie","La jaunisse seulement","Aucun"],"À surveiller selon le protocole."],
["Après un diabète gestationnel, il faut…",["dépister un diabète de type 2 dans les mois suivants","ne plus jamais contrôler","interdire une autre grossesse","arrêter l'allaitement"],"Le risque de diabète ultérieur est élevé."],
["Essoufflement inhabituel chez une femme enceinte suivie pour un rhumatisme articulaire aigu : conduite ?",["Avis cardiologique rapide","La rassurer : c'est la grossesse","Lui conseiller du sport","Attendre l'accouchement"],"Une atteinte des valves peut se décompenser."],
["Fièvre de dengue chez une femme enceinte : quel antalgique ?",["Le paracétamol","L'aspirine","L'ibuprofène","Aucun, jamais"],"Aspirine et anti-inflammatoires augmentent le risque de saignement."],
["La ciguatera est due à…",["la consommation de certains poissons de lagon","une piqûre de moustique","l'eau du robinet","un virus respiratoire"],"À éviter pendant la grossesse et l'allaitement."],
["Mère porteuse de l'hépatite B : le nouveau-né reçoit vaccin et immunoglobulines dans les…",["12 heures","7 jours","2 mois","6 mois"],"Sans cela, la plupart des enfants deviennent porteurs chroniques."]],

{t:"Suivi gynécologique, contraception et post-partum",s:"La consultation de prévention, les méthodes, la visite postnatale.",
f:[
["La consultation de prévention","<ul><li><b>Pour qui</b> : la femme en <b>bonne santé</b>, tout au long de sa vie. Une pathologie : on adresse au médecin.</li><li><b>Interrogatoire</b> : antécédents, cycles, traitements, tabac, vie affective et sexuelle, violences.</li><li><b>Examen</b> adapté au motif, avec le consentement à chaque étape ; jamais systématique chez une jeune femme sans plainte.</li><li><b>Dépistage du cancer du col</b> : prélèvement régulier selon le programme en vigueur.</li><li><b>Seins</b> : examen clinique et information sur le dépistage.</li><li><b>Vaccination</b> : mise à jour, notamment contre les papillomavirus chez les jeunes.</li><li><b>Dépistage des infections sexuellement transmissibles</b> selon le risque.</li></ul>"],
["Les méthodes de contraception","<ul><li><b>Longue durée</b>, très efficaces : <b>implant</b>, <b>dispositif intra-utérin</b> au cuivre ou hormonal.</li><li><b>Pilules</b> : œstroprogestative ou progestative seule ; efficacité liée à la régularité.</li><li><b>Injection</b> trimestrielle, patch, anneau.</li><li><b>Préservatifs</b> : seule protection contre les infections sexuellement transmissibles.</li><li><b>Contraception d'urgence</b> : lévonorgestrel jusqu'à <b>72 heures</b> ; ulipristal jusqu'à <b>120 heures</b> ; dispositif au cuivre jusqu'à <b>5 jours</b>.</li><li><b>Choisir</b> : la meilleure méthode est celle que la femme choisit après une information claire.</li><li>On recherche les contre-indications : tabac après 35 ans, antécédent de phlébite, migraine avec aura, hypertension pour les œstroprogestatifs.</li></ul>"],
["Après la naissance","<ul><li><b>Retour de la fertilité</b> : une ovulation est possible dès la 4e semaine si la femme n'allaite pas.</li><li><b>Progestatifs seuls</b> (pilule, implant) : possibles tôt après l'accouchement, même en cas d'allaitement.</li><li><b>Œstroprogestatifs</b> : pas avant <b>6 semaines</b> ; pas pendant les 6 premiers mois d'allaitement.</li><li><b>Dispositif intra-utérin</b> : à partir de <b>4 semaines</b>.</li><li><b>Allaitement exclusif</b> : protège seulement si le bébé a moins de 6 mois, tète jour et nuit, et que les règles ne sont pas revenues.</li><li><b>Visite postnatale</b> : 6 à 8 semaines après la naissance : périnée, cicatrice, moral, sexualité, contraception, rééducation.</li><li><b>Rééducation du périnée</b> : sur prescription, après la visite postnatale.</li></ul>"],
["Repérer la détresse et les violences","<ul><li><b>Dépression du post-partum</b> : tristesse durable, perte d'intérêt, culpabilité, troubles du sommeil, idées noires. Elle se <b>dépiste</b> par des questions simples et se soigne.</li><li><b>Violences</b> : poser la question <b>à toutes</b> les femmes, seule à seule : « Vous sentez-vous en sécurité chez vous ? »</li><li>La grossesse est une période à risque d'apparition ou d'aggravation des violences.</li><li><b>Si elle parle</b> : croire, ne pas juger, dire que la loi l'interdit, évaluer le danger, proposer un certificat, orienter vers les services et associations.</li><li><b>Si elle ne veut rien faire</b> : respecter, laisser la porte ouverte, tracer avec ses mots à elle.</li><li>En cas de danger immédiat : <b>17</b>.</li></ul>"]],
q:[
["La sage-femme assure le suivi gynécologique de prévention chez…",["la femme en bonne santé","toute femme, même malade","les hommes","les enfants"],"Une pathologie fait adresser au médecin."],
["Un examen gynécologique se fait…",["avec le consentement de la femme, à chaque étape","systématiquement à chaque visite","sans explication","sans elle"],"Elle peut refuser à tout moment."],
["Quelle méthode protège des infections sexuellement transmissibles ?",["Le préservatif","La pilule","L'implant","Le dispositif intra-utérin"],"C'est la seule."],
["Parmi ces méthodes, laquelle est de longue durée ?",["L'implant","La pilule","Le préservatif","Le patch"],"Avec le dispositif intra-utérin."],
["Le lévonorgestrel en contraception d'urgence se prend jusqu'à…",["72 heures","12 heures","10 jours","1 mois"],"Le plus tôt possible."],
["L'ulipristal se prend jusqu'à…",["120 heures","24 heures","72 heures","15 jours"],"Soit 5 jours."],
["Le dispositif au cuivre en contraception d'urgence se pose jusqu'à…",["5 jours","12 heures","1 mois","3 mois"],"C'est la méthode d'urgence la plus efficace."],
["Après un accouchement, les œstroprogestatifs ne sont pas donnés avant…",["6 semaines","3 jours","1 an","2 ans"],"À cause du risque de phlébite ; 6 mois en cas d'allaitement."],
["Quelle contraception est possible tôt chez une femme qui allaite ?",["Un progestatif seul","Une pilule œstroprogestative","Aucune","Le patch"],"Pilule progestative ou implant."],
["Sans allaitement, une ovulation est possible dès…",["la 4e semaine","le 6e mois","la 1re année","jamais avant les règles"],"La contraception s'aborde avant la sortie."],
["Quand a lieu la visite postnatale ?",["6 à 8 semaines après la naissance","Le lendemain","À 1 an","Jamais"],"Périnée, moral, contraception, rééducation."],
["Pour repérer des violences, on pose la question…",["à toutes les femmes, seule à seule","seulement en cas de bleus","devant le conjoint","jamais"],"Le repérage systématique libère la parole."]],

{t:"Se remettre à niveau",s:"Ce qui a changé ces dernières années et comment reprendre en sécurité.",
f:[
["Ce qui a changé en salle de naissance","<ul><li><b>Phase active</b> : elle débute à <b>5 ou 6 cm</b> ; on ne parle plus de stagnation trop tôt.</li><li><b>Accouchement normal</b> : moins d'interventions systématiques, mobilité, positions choisies, boire, soutien continu.</li><li><b>Épisiotomie</b> : pratique <b>restrictive</b> ; pas de bénéfice à la faire d'office.</li><li><b>Hémorragie</b> : délivrance dirigée pour toutes, sac de recueil, acide tranexamique dans la prise en charge.</li><li><b>Nouveau-né</b> : clampage retardé du cordon, peau à peau, plus d'aspiration systématique, priorité à la <b>ventilation</b>.</li><li><b>Peau à peau</b> possible aussi après une césarienne.</li><li><b>Consentement</b> : chaque geste s'explique et se propose.</li></ul>"],
["Ce qui a changé pour la profession","<ul><li><b>En métropole</b>, ces dernières années : vaccinations élargies, interruption de grossesse par les sages-femmes sous conditions, arrêts de travail plus longs, études portées à <b>six ans</b>.</li><li><b>Au fenua</b>, le cadre est <b>local</b> : loi du pays de 2018 pour le suivi gynécologique, les prescriptions et les vaccinations.</li><li>Ne transpose jamais une règle métropolitaine sans vérifier : contacte le <b>conseil de l'ordre des sages-femmes de Polynésie française</b>.</li><li><b>Inscription à l'ordre</b> : obligatoire pour exercer.</li><li>Les recommandations cliniques, elles, sont les mêmes : elles viennent des sociétés savantes et s'appliquent à ta pratique.</li></ul>"],
["Reprendre après une interruption","<ul><li><b>Faire le point</b> : ce que tu maîtrisais, ce qui a changé, ce qui te fait peur.</li><li><b>Remise à niveau</b> : formation continue, stage en doublure dans une maternité, lecture des protocoles du service.</li><li><b>Gestes d'urgence</b> : l'attestation de formation se <b>renouvelle</b> régulièrement ; refais-la avant de reprendre.</li><li><b>Simulation</b> : hémorragie, dystocie des épaules, réanimation du nouveau-né. Les gestes rares s'oublient vite.</li><li><b>Demander</b> : une sage-femme qui pose des questions est plus sûre qu'une sage-femme qui devine.</li><li><b>Débuter</b> par des situations simples, avec une collègue référente.</li></ul>"],
["Les outils de la sécurité","<ul><li><b>Check-lists</b> : matériel de réanimation, chariot d'urgence, avant une suture.</li><li><b>Transmissions SAED</b> : Situation, Antécédents, Évaluation, Demande.</li><li><b>Heures notées</b> pour chaque événement d'une urgence.</li><li><b>Parler fort et clair</b> en urgence : annoncer ce qu'on fait, répéter les prescriptions orales.</li><li><b>Débriefer</b> après chaque situation difficile, sans chercher de coupable.</li><li><b>Déclarer</b> les événements indésirables : c'est ainsi qu'un service progresse.</li><li><b>Prendre soin de soi</b> : fatigue et isolement sont des facteurs d'erreur.</li></ul>"]],
q:[
["La phase active du travail débute désormais à…",["5 ou 6 cm","2 cm","3 cm","9 cm"],"On évite ainsi des interventions trop précoces."],
["L'épisiotomie systématique est…",["abandonnée au profit d'une pratique restrictive","obligatoire au premier enfant","recommandée pour toutes","interdite dans tous les cas"],"Elle garde des indications."],
["La délivrance dirigée est proposée…",["à toutes les femmes","seulement en cas d'antécédent","jamais","seulement en césarienne"],"Elle prévient l'hémorragie."],
["Pour un nouveau-né qui va bien, le cordon est clampé…",["après au moins une minute","immédiatement","après une heure","jamais"],"Le clampage retardé est bénéfique."],
["Le geste prioritaire de la réanimation du nouveau-né est…",["la ventilation","l'aspiration","le massage","l'injection"],"Elle règle la majorité des cas."],
["Une compétence nouvelle en métropole s'applique au fenua…",["seulement si un texte local le prévoit","automatiquement","jamais","sur décision de la maternité"],"On vérifie auprès de l'ordre local."],
["Pour exercer, la sage-femme doit être…",["inscrite à l'ordre","syndiquée","propriétaire d'un cabinet","âgée de 30 ans"],"Condition légale d'exercice."],
["Avant de reprendre après plusieurs années, il est prudent de…",["refaire la formation aux gestes d'urgence","reprendre directement seule de nuit","éviter de poser des questions","ne lire aucun protocole"],"Les gestes rares s'oublient."],
["Pourquoi s'entraîner en simulation ?",["Parce que les urgences rares s'oublient vite","Pour passer le temps","Pour remplacer la pratique réelle","Par obligation administrative seulement"],"On s'y trompe sans conséquence."],
["Dans SAED, le D signifie…",["Demande","Douleur","Dossier","Départ"],"Ce que j'attends de mon interlocuteur."],
["Après une situation difficile, l'équipe…",["débriefe sans chercher de coupable","n'en parle plus","désigne un responsable","attend l'inspection"],"C'est ainsi qu'on progresse."],
["Une prescription orale en urgence doit être…",["répétée à voix haute puis écrite","exécutée en silence","refusée","oubliée après coup"],"La répétition évite les erreurs de dose."]],

      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};

function dilem(done,back){let i=0,pts=0;const items=shuf(DIL).slice(0,dif()>=1?10:6),hard=dif()>=1;const recap=[];

    bindBack(back);
    const pick=j=>{halt();const x=j<0?["(pas de décision)",0,"La situation évolue sans toi.","Le problème s'aggrave."]:o[j];pts+=x[1];recap.push([C.t,x]);
      if(hard){i++;return i<items.length?show():fin()}
      app.querySelectorAll(".opt").forEach((b,m)=>{b.disabled=true;{const c=o[m][1]===2?"good":o[m][1]===0?"bad":"";if(c)b.classList.add(c)}});
      document.getElementById("fb").innerHTML=`<div class="fb"><b>À court terme :</b> ${x[2]}<br><b>À long terme :</b> ${x[3]}</div>${x[1]<2?`<div class="fb" style="border-color:var(--ok)"><b>Meilleure option :</b> ${C.o.find(y=>y[1]===2)[0]}</div>`:""}<button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<items.length?show():fin()}};
    app.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(j));if(dif()>=2)count(45,document.getElementById("tmr"),()=>pick(-1))})();

{t:"Données, comptes et sécurité",s:"Serveur, base de données, authentification, règles d'accès, données personnelles.",
f:[
["Côté client, côté serveur","<ul><li><b>Client</b> : ce qui tourne sur le téléphone de l'utilisateur. Tout y est <b>visible</b> et modifiable par lui.</li><li><b>Serveur</b> : ce qui tourne en ligne, sous ton contrôle.</li><li><b>Base de données</b> : là où les données sont rangées. <b>API</b> : la porte par laquelle l'application les demande.</li><li><b>Services clés en main</b> : Firebase, Supabase. Ils fournissent base de données, comptes utilisateurs et stockage de fichiers sans gérer de serveur.</li><li><b>Règle d'or</b> : ne jamais faire confiance au client. Toute vérification importante se fait côté serveur.</li><li>Vérifie les <b>quotas gratuits</b> et le coût si l'application grandit.</li></ul>"],
["Les comptes utilisateurs","<ul><li><b>Authentification</b> : prouver qui on est (courriel et mot de passe, lien magique, compte Google).</li><li><b>Autorisation</b> : ce qu'on a le droit de faire une fois connecté.</li><li>Ne <b>stocke jamais</b> toi-même les mots de passe : utilise le service d'authentification.</li><li><b>Rôles</b> : client, vendeur, administrateur. Le rôle se vérifie côté serveur.</li><li>Prévoir : mot de passe oublié, déconnexion, suppression du compte.</li><li>Demande le <b>moins</b> possible à l'inscription : chaque champ fait fuir des utilisateurs.</li></ul>"],
["Les règles d'accès","<ul><li>Sans règles, une base en ligne est <b>ouverte à tous</b>.</li><li><b>Firebase</b> : règles de sécurité. <b>Supabase</b> : sécurité au niveau des lignes (RLS), à <b>activer</b> sur chaque table.</li><li>Règle type : « un utilisateur ne lit et ne modifie que <b>ses</b> données ».</li><li><b>Clés</b> : la clé publique peut figurer dans le code client, à condition que les règles soient en place. La clé <b>secrète</b> d'administration ne doit <b>jamais</b> s'y trouver, ni être publiée sur GitHub.</li><li>Une clé secrète publiée par erreur se <b>révoque</b> tout de suite.</li><li><b>Teste</b> tes règles : essaie de lire les données d'un autre compte.</li></ul>"],
["Les données personnelles","<ul><li><b>Donnée personnelle</b> : tout ce qui permet d'identifier quelqu'un (nom, téléphone, position, photo).</li><li>La <b>loi Informatique et Libertés</b> s'applique au fenua ; la <b>CNIL</b> est l'autorité compétente.</li><li><b>Principes</b> : ne collecter que le <b>nécessaire</b> ; dire <b>pourquoi</b> ; obtenir l'accord quand il le faut ; protéger ; ne pas garder indéfiniment.</li><li><b>Droits</b> des personnes : accéder à leurs données, les corriger, les faire supprimer.</li><li><b>Données sensibles</b> (santé, enfants) : précautions renforcées ; demande conseil avant de te lancer.</li><li>Une <b>page de confidentialité</b> claire fait partie de l'application.</li><li>Des <b>sauvegardes</b> régulières de la base.</li></ul>"]],
q:[
["Ce qui tourne sur le téléphone de l'utilisateur s'appelle…",["le client","le serveur","la base","le routeur"],"Tout y est visible par l'utilisateur."],
["La règle d'or de la sécurité web ?",["Ne jamais faire confiance au client","Tout vérifier dans le navigateur","Cacher les boutons","Utiliser des couleurs sombres"],"Les vérifications importantes se font côté serveur."],
["Firebase et Supabase fournissent notamment…",["base de données et comptes utilisateurs","des téléphones","un nom de marque","des clients"],"Sans avoir à gérer un serveur."],
["L'authentification sert à…",["prouver qui on est","décider ce qu'on a le droit de faire","chiffrer les images","accélérer l'application"],"L'autorisation vient ensuite."],
["Où stocke-t-on les mots de passe des utilisateurs ?",["On laisse le service d'authentification s'en charger","Dans un tableur","Dans le code","Dans localStorage"],"On ne les stocke jamais soi-même."],
["Une base en ligne sans règles d'accès est…",["ouverte à tous","protégée par défaut","invisible","illégale à créer"],"N'importe qui peut lire ou effacer."],
["Dans Supabase, la sécurité au niveau des lignes doit être…",["activée sur chaque table","ignorée","réservée aux grandes entreprises","payée à part"],"Sinon la table est accessible avec la clé publique."],
["La clé secrète d'administration…",["ne doit jamais figurer dans le code client ni sur GitHub","peut être publiée","se met dans le manifeste","se partage aux testeurs"],"Elle donne tous les droits."],
["Tu as publié une clé secrète par erreur. Tu…",["la révoques immédiatement","supprimes seulement le fichier","attends de voir","changes le logo"],"L'historique Git la garde : seule la révocation protège."],
["Un numéro de téléphone est…",["une donnée personnelle","une donnée publique sans règle","un secret d'État","sans intérêt"],"Il permet d'identifier quelqu'un."],
["Quel principe guide la collecte de données ?",["Ne collecter que le nécessaire","Tout collecter au cas où","Ne rien dire à l'utilisateur","Garder pour toujours"],"C'est la minimisation."],
["Comment vérifier que tes règles d'accès fonctionnent ?",["En essayant de lire les données d'un autre compte","En leur faisant confiance","En demandant à l'IA si c'est sûr","En changeant de couleur"],"On teste comme le ferait un curieux."]],
