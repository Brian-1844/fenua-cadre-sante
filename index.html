{t:"Dialogue social, santé et sécurité",s:"Représentants du personnel, négociation, grève, prévention",
f:[
["Les représentants du personnel","<ul><li><b>Délégués du personnel</b> : élus dans les entreprises d'au moins <b>11 salariés</b> (art. Lp. 2421-2). Ils présentent les <b>réclamations</b> individuelles et collectives, peuvent saisir l'inspection du travail et sont reçus chaque mois par l'employeur.</li><li><b>Comité d'entreprise</b> : à partir de <b>50 salariés</b> (art. Lp. 2431-1), élu pour deux ans. Il est informé et consulté sur la marche de l'entreprise et gère les activités sociales et culturelles.</li><li><b>CHSCT</b> (comité d'hygiène, de sécurité et des conditions de travail) : à partir de <b>50 salariés</b> (art. Lp. 4611-1). En dessous, les délégués du personnel exercent ses missions.</li><li><b>Délégué syndical</b> : désigné par un syndicat représentatif ; il négocie les accords.</li><li>Il n'y a pas de CSE au fenua.</li><li>L'employeur organise les <b>élections</b> : ne pas le faire est une infraction (délit d'entrave).</li></ul>"],
["Les salariés protégés et les moyens des élus","<ul><li>Les représentants (et les candidats) sont des <b>salariés protégés</b> : pas de licenciement sans <b>autorisation de l'inspecteur du travail</b>.</li><li>But : qu'ils puissent exercer leur mandat sans crainte de représailles.</li><li>Moyens : <b>heures de délégation</b> payées, local, panneau d'affichage, liberté de circulation dans l'entreprise.</li><li><b>Délit d'entrave</b> : empêcher la mise en place ou le fonctionnement des institutions représentatives.</li><li>Pour les RH : tenir le calendrier des réunions, répondre par écrit aux réclamations, transmettre les informations dues, ne jamais traiter un élu moins bien qu'un autre salarié.</li><li>Un élu reste soumis aux règles de l'entreprise : on peut le sanctionner pour une faute sans lien avec son mandat, en respectant la procédure spéciale.</li></ul>"],
["Négocier et gérer un conflit collectif","<ul><li>La <b>négociation collective</b> aboutit à des accords d'entreprise ou des conventions de branche.</li><li><b>Droit de grève</b> : cessation <b>collective et concertée</b> du travail pour des <b>revendications professionnelles</b>. Il est garanti par la Constitution.</li><li>En Polynésie française, la cessation concertée du travail doit être <b>précédée d'un préavis</b> ; le délai et les formes sont fixés par le code (cinq jours francs dans les services publics). Pendant le préavis, les parties <b>négocient</b>.</li><li>La grève <b>suspend</b> le contrat : pas de salaire pour le temps non travaillé, mais pas de sanction ni de licenciement, sauf faute lourde.</li><li>Interdit : remplacer les grévistes par des CDD ou des intérimaires.</li><li>Méthode : écouter les revendications, distinguer ce qui relève de la loi (à régulariser sans discuter) et ce qui se négocie, écrire un <b>protocole de fin de conflit</b>.</li></ul>"],
["Santé et sécurité au travail","<ul><li>L'employeur a une <b>obligation de sécurité</b> : il doit protéger la santé physique et mentale des salariés.</li><li>Principes de prévention : <b>éviter</b> les risques, <b>évaluer</b> ceux qui restent, les combattre à la source, donner la priorité aux protections <b>collectives</b> sur les protections individuelles, former et informer.</li><li><b>Médecine du travail</b> : visite d'embauche, suivi, visites de reprise, avis d'aptitude, conseils d'aménagement de poste.</li><li><b>Accident du travail</b> : soigner, déclarer à la CPS, analyser les causes (arbre des causes), corriger.</li><li>Registre de sécurité, affichage des consignes, équipements de protection fournis <b>gratuitement</b>.</li><li>Un salarié qui signale un danger grave ne peut pas être sanctionné pour cela.</li><li>Le service de prévention des risques professionnels de la CPS conseille les entreprises.</li></ul>"],
["Harcèlement et risques psychosociaux","<ul><li><b>Harcèlement moral</b> : agissements répétés qui dégradent les conditions de travail et portent atteinte à la dignité ou à la santé. <b>Harcèlement sexuel</b> : propos ou comportements à connotation sexuelle imposés.</li><li>L'employeur doit <b>prévenir</b>, <b>faire cesser</b> et <b>sanctionner</b>.</li><li>Quand un signalement arrive : <b>écouter</b> sans juger, <b>protéger</b> la personne, mener une <b>enquête interne impartiale</b> (entendre chacun séparément, témoins, écrits), <b>tracer</b>, décider.</li><li>La personne qui signale de bonne foi est protégée contre les représailles.</li><li><b>Risques psychosociaux</b> : surcharge, manque d'autonomie, conflits, insécurité. Signaux : absences courtes, erreurs, tensions, départs.</li><li>Leviers : organisation du travail, formation des encadrants, médecine du travail, espaces de parole.</li></ul>"]],
q:[
["Des délégués du personnel sont élus à partir de…",["11 salariés","5 salariés","50 salariés","100 salariés"],"Article Lp. 2421-2."],
["Le comité d'entreprise est obligatoire à partir de…",["50 salariés","11 salariés","20 salariés","200 salariés"],"Article Lp. 2431-1."],
["Le CHSCT est constitué à partir de…",["50 salariés","11 salariés","10 salariés","300 salariés"],"Article Lp. 4611-1."],

["Le comité d'entreprise est élu pour…",["2 ans","6 mois","5 ans","10 ans"],"Article Lp. 2432-7."],
["Ne pas organiser les élections obligatoires constitue…",["un délit d'entrave","une simple négligence","un droit de l'employeur","une économie légitime"],"C'est une infraction pénale."],
["Existe-t-il un CSE en Polynésie française ?",["Non","Oui, depuis 2020","Oui, au-delà de 11 salariés","Oui, dans le public"],"Le fenua a gardé délégués du personnel, comité d'entreprise et CHSCT."],
["Le droit de grève suppose…",["une cessation collective et concertée pour des revendications professionnelles","l'accord de l'employeur","une décision individuelle","un motif politique"],"Sinon il ne s'agit pas d'une grève protégée."],
["Pendant la grève, le contrat de travail est…",["suspendu","rompu","modifié","prolongé"],"Pas de salaire pour le temps non travaillé."],
["Peut-on embaucher des CDD pour remplacer des grévistes ?",["Non","Oui","Oui, avec l'accord du SEFI","Oui, pour moins d'une semaine"],"C'est un cas d'interdiction du CDD."],
["Un gréviste peut être licencié pour fait de grève…",["seulement en cas de faute lourde","librement","après trois jours","avec l'accord des collègues"],"La grève est un droit constitutionnel."],
["Premier principe de prévention :",["éviter les risques","fournir des gants","afficher un panneau","sanctionner les imprudents"],"Puis évaluer et combattre à la source."],
["Entre protection collective et protection individuelle, on privilégie…",["la protection collective","la protection individuelle","aucune","la moins chère"],"Un garde-corps protège tout le monde."],
["Les équipements de protection individuelle sont…",["fournis gratuitement par l'employeur","achetés par le salarié","facultatifs","retenus sur le salaire"],"Avec la formation à leur usage."],
["Le harcèlement moral suppose…",["des agissements répétés","un seul désaccord","une remarque justifiée du chef","une mauvaise ambiance générale"],"Qui dégradent les conditions de travail."],
["Face à un signalement de harcèlement, la première chose à faire :",["écouter et protéger la personne","confronter les deux devant l'équipe","attendre une plainte écrite","prévenir toute l'entreprise"],"Puis enquête impartiale."],

["Le délégué du personnel est reçu par l'employeur…",["chaque mois","une fois par an","jamais","à chaque paie"],"Les réponses sont consignées."]],

{t:"Développer les compétences et piloter",s:"Formation, évaluation, gestion des emplois, indicateurs",
f:[
["La formation","<ul><li>Former sert à <b>adapter</b> les salariés à leur poste, à les faire <b>évoluer</b> et à garder l'entreprise à niveau.</li><li>Le <b>plan de formation</b> se construit chaque année : besoins de l'entreprise (projets, obligations, sécurité) + demandes des salariés (entretiens annuels).</li><li>Certaines formations sont <b>obligatoires</b> : sécurité, habilitations, conduite d'engins, gestes de secours.</li><li>Formes : stage, tutorat, formation au poste, e-learning, validation des acquis de l'expérience.</li><li>Acteurs au fenua : organismes de formation, CCISM, SEFI, fonds paritaire de la formation, université.</li><li>Après chaque formation : une <b>évaluation à chaud</b> (satisfaction) et <b>à froid</b> (ce qui a changé au poste, quelques mois après).</li></ul>"],
["L'entretien annuel","<ul><li>Un rendez-vous par an entre le salarié et son responsable : <b>bilan</b> de l'année, <b>objectifs</b> de la suivante, <b>besoins de formation</b>, souhaits d'évolution.</li><li>Il se <b>prépare</b> des deux côtés, avec une trame commune à toute l'entreprise.</li><li>Objectifs <b>SMART</b> : Spécifiques, Mesurables, Atteignables, Réalistes, Temporellement définis.</li><li>On évalue le <b>travail</b>, à partir de faits, pas la personne.</li><li>Un <b>compte rendu</b> signé des deux, dont le salarié garde une copie.</li><li>Rôle des RH : fournir la trame, former les responsables, suivre le calendrier, exploiter les résultats (formation, mobilité, salaires).</li><li>Ce n'est pas le moment d'annoncer une sanction : la discipline suit sa propre procédure.</li></ul>"],
["Gérer les emplois et les compétences","<ul><li>Idée simple : comparer les <b>compétences qu'on a</b> et celles dont on <b>aura besoin</b>, puis réduire l'écart.</li><li>Outils : <b>organigramme</b>, <b>fiches de poste</b>, <b>pyramide des âges</b>, cartographie des compétences.</li><li>Leviers pour réduire l'écart : former, recruter, faire évoluer en interne, réorganiser, transmettre avant les départs en retraite.</li><li><b>Mobilité interne</b> : proposer les postes d'abord aux salariés.</li><li><b>Polyvalence</b> : que personne ne soit seul à savoir faire une tâche critique.</li><li>Au fenua, le vivier local est limité pour certains métiers : anticiper et former vaut mieux que chercher à l'extérieur au dernier moment.</li></ul>"],
["Les indicateurs RH","<ul><li><b>Effectif</b> et <b>ETP</b> : combien de personnes, combien de temps pleins.</li><li><b>Taux d'absentéisme</b> = heures d'absence ÷ heures théoriques × 100. Exemple : 20 salariés × 169 h = 3 380 h ; 270 h d'absence : 8 %.</li><li><b>Turnover</b> = (entrées + départs) ÷ 2 ÷ effectif moyen × 100. Exemple : 6 entrées, 4 départs, 50 salariés : 10 %.</li><li><b>Masse salariale</b> : total des salaires bruts et des charges patronales.</li><li>Ancienneté moyenne, pyramide des âges, part de CDD, heures supplémentaires, accidents du travail, heures de formation.</li><li>Un indicateur se compare à lui-même dans le temps. Il sert à <b>décider</b>, pas à surveiller.</li><li>Le <b>tableau de bord RH</b> mensuel tient sur une page.</li></ul>"],
["Rémunérer et fidéliser","<ul><li>Une politique de rémunération cherche trois équilibres : <b>équité interne</b> (à poste égal, salaire comparable), <b>compétitivité externe</b> (par rapport au marché), <b>maîtrise des coûts</b>.</li><li>La <b>grille de classification</b> de la convention collective donne les minima par niveau.</li><li>Au-delà du salaire : primes, avantages, formation, horaires, ambiance, perspectives.</li><li>Les départs s'expliquent souvent par le management direct, le manque de reconnaissance et l'absence de perspectives, plus que par le salaire seul.</li><li>L'<b>entretien de départ</b> : demander à ceux qui partent pourquoi ils partent.</li><li><b>Marque employeur</b> : ce que l'on dit de l'entreprise comme lieu de travail. Elle se construit par des faits.</li></ul>"]],
q:[
["Le plan de formation se construit à partir…",["des besoins de l'entreprise et des demandes des salariés","des envies du dirigeant","du catalogue le moins cher","des formations de l'an dernier"],"Croisés chaque année."],
["Exemple de formation obligatoire :",["une habilitation de sécurité","un cours de cuisine","un stage de développement personnel","un cours de langue pour le plaisir"],"Sécurité, conduite d'engins, secours."],
["L'évaluation « à froid » d'une formation se fait…",["quelques mois après, sur le poste","à la sortie de la salle","avant la formation","jamais"],"Pour voir ce qui a réellement changé."],
["L'entretien annuel sert à…",["faire le bilan, fixer des objectifs, recueillir les besoins","annoncer les sanctions","négocier le licenciement","contrôler les arrêts maladie"],"La discipline a sa propre procédure."],
["Dans SMART, le « M » signifie…",["Mesurable","Motivant","Mensuel","Managérial"],"Sans mesure, pas d'évaluation."],
["En entretien annuel, on évalue…",["le travail, à partir de faits","la personnalité","la vie privée","l'opinion des collègues"],"Des faits datés."],
["Le compte rendu d'entretien annuel est…",["signé des deux et remis en copie au salarié","gardé secret","oral","envoyé à la CPS"],"Il engage les deux parties."],
["La gestion des emplois et des compétences consiste à…",["comparer les compétences actuelles et les besoins futurs","réduire les effectifs","augmenter les salaires","contrôler les horaires"],"Puis réduire l'écart."],
["La pyramide des âges permet notamment…",["d'anticiper les départs en retraite","de calculer la paie","de fixer les congés","de noter les salariés"],"Et la transmission des savoirs."],
["La polyvalence vise à…",["éviter qu'une seule personne sache faire une tâche critique","supprimer des postes","baisser les salaires","éviter les formations"],"Elle sécurise l'activité."],
["Taux d'absentéisme : 270 h d'absence pour 3 380 h théoriques :",["environ 8 %","environ 2 %","environ 27 %","environ 12 %"],"270 ÷ 3 380."],
["Turnover : 6 entrées, 4 départs, 50 salariés en moyenne :",["10 %","20 %","4 %","6 %"],"(6 + 4) ÷ 2 ÷ 50."],
["La masse salariale comprend…",["les salaires bruts et les charges patronales","seulement les nets","seulement les primes","le chiffre d'affaires"],"C'est le coût total du personnel."],
["Un bon tableau de bord RH…",["tient sur une page et sert à décider","contient tous les bulletins","est annuel seulement","sert à surveiller chaque salarié"],"Peu d'indicateurs, suivis dans le temps."],
["L'équité interne signifie…",["à poste égal, salaire comparable","payer comme le concurrent","payer le moins possible","payer selon l'ancienneté seule"],"La compétitivité externe concerne le marché."],
["Les minima par niveau de qualification figurent…",["dans la grille de la convention collective","dans le règlement intérieur","sur le site de la CPS","dans le registre du personnel"],"Au-dessus du SMIG."],
["Première cause fréquente de départ d'un salarié :",["le management direct et le manque de reconnaissance","la couleur des murs","le logiciel de paie","la distance du parking"],"Le salaire n'explique pas tout."],
["L'entretien de départ sert à…",["comprendre pourquoi les salariés partent","retenir le salarié de force","réclamer le matériel","annoncer une sanction"],"Pour corriger ce qui peut l'être."],
["La mobilité interne consiste à…",["proposer les postes d'abord aux salariés en place","muter d'office","licencier pour recruter","changer de convention collective"],"Elle motive et réduit les coûts de recrutement."],
["La marque employeur se construit surtout…",["par les faits vécus par les salariés","par la publicité","par le logo","par le salaire du dirigeant"],"Ce que les salariés racontent de l'entreprise."]],

{t:"Les RH dans la fonction publique du Pays",s:"Statut, concours, carrière, contractuels, discipline",
f:[
["Un autre monde : le statut","<ul><li>Dans la fonction publique du Pays, l'agent n'a pas un contrat : il est dans une <b>situation statutaire</b>, fixée par des textes.</li><li>Texte de base : <b>délibération n° 95-215 AT du 14 décembre 1995</b>, statut général de la fonction publique de la Polynésie française.</li><li><b>4 catégories</b> : A (conception, encadrement), B (application), C et D (exécution).</li><li>Les fonctionnaires sont regroupés en <b>cadres d'emplois</b>, chacun régi par un <b>statut particulier</b>.</li><li>La <b>DTI</b> (Direction des talents et de l'innovation, ex-DGRH) gère les concours et la carrière.</li><li>Le code du travail ne s'applique pas aux fonctionnaires. Les litiges vont au <b>tribunal administratif</b>.</li><li>Trois autres fonctions publiques coexistent au fenua : celle de l'État, celle des communes, et les agents des établissements publics.</li></ul>"],
["Entrer et faire carrière","<ul><li><b>Conditions générales</b> (art. 4) : nationalité française, droits civiques, casier judiciaire compatible, aptitude physique.</li><li><b>Concours</b> : externe (sur diplôme), interne (pour les agents déjà en poste), sur épreuves ou sur titres. Un dispositif de <b>protection de l'emploi local</b> fondé sur la durée de résidence s'applique aussi.</li><li>Réussite → <b>liste d'aptitude</b> → nomination comme <b>stagiaire</b> → <b>stage</b> d'un an en principe → <b>titularisation</b>.</li><li>Rémunération : <b>traitement</b> calculé à partir d'un <b>indice</b> lié au grade et à l'échelon, plus des indemnités.</li><li><b>Avancement</b> d'échelon (ancienneté et valeur professionnelle) et de grade.</li><li><b>Notation</b> annuelle avec appréciation (art. 76).</li><li><b>Positions</b> : activité, détachement, disponibilité, congé parental.</li></ul>"],
["Droits, obligations et temps de travail","<ul><li><b>Obligations</b> : se consacrer à ses fonctions (art. 11), <b>secret</b> et <b>discrétion</b> professionnels (art. 12-13), <b>obéissance hiérarchique</b> sauf ordre manifestement illégal et de nature à compromettre gravement un intérêt public (art. 14), neutralité, probité.</li><li><b>Droits</b> : rémunération après service fait, congés, formation, <b>protection</b> par le Pays (art. 10), droit syndical, droit de grève dans le cadre des textes, avec préavis de cinq jours francs.</li><li><b>Durée du travail</b> : <b>39 heures</b> par semaine (art. 64 bis).</li><li><b>Instances</b> : <b>CAP</b> (commission administrative paritaire, une par cadre d'emplois) pour les situations individuelles ; <b>CTP</b> (comité technique paritaire) pour l'organisation des services et les conditions de travail.</li><li>Une décision défavorable doit être écrite, motivée et indiquer les voies de recours.</li></ul>"],
["Les agents non fonctionnaires","<ul><li><b>ANT</b> (agents non titulaires) : contrat de <b>droit public</b>, régi par la délibération n° 2004-15 APF du 22 janvier 2004. Recrutés pour un besoin saisonnier, un surcroît d'activité, un besoin occasionnel, ou faute de fonctionnaire disponible, pour des <b>durées limitées</b> selon le motif.</li><li><b>ANFA</b> (agents non fonctionnaires de l'administration) : <b>droit privé</b>, convention collective propre, donc <b>code du travail</b> et tribunal du travail.</li><li>Dans un même bureau, trois agents peuvent relever de trois régimes : fonctionnaire, ANT, ANFA.</li><li>Conséquence pour le gestionnaire RH : avant toute décision (congé, heures, discipline, fin de contrat), <b>identifier le statut</b> de l'agent.</li><li>Pour un ANT ou un ANFA, l'<b>entretien préalable</b> est obligatoire avant toute sanction.</li></ul>"],
["La discipline dans la fonction publique","<ul><li><b>4 groupes</b> de sanctions (art. 85). 1er : <b>avertissement</b>, <b>blâme</b>. 2e : radiation du tableau d'avancement, abaissement d'échelon, <b>exclusion temporaire de 15 jours au plus</b>, déplacement d'office. 3e : rétrogradation, exclusion de 6 mois à 2 ans. 4e : <b>révocation</b>.</li><li>Le pouvoir disciplinaire appartient au <b>Président de la Polynésie française</b> ; les chefs de service ont délégation pour le 1er groupe.</li><li>Au-delà du 1er groupe : avis de la <b>CAP</b> siégeant en <b>conseil de discipline</b>.</li><li><b>Droits de la défense</b> : griefs écrits, communication du dossier, assistance d'un défenseur.</li><li><b>Suspension</b> en cas de faute grave : 4 mois au plus, traitement maintenu. Ce n'est pas une sanction.</li><li>Interdits : sanction déguisée, deux sanctions pour une même faute.</li><li>Rôle du gestionnaire RH : sécuriser la procédure, les délais et les écrits.</li></ul>"]],
q:[
["Le fonctionnaire du Pays est lié à l'administration par…",["un statut","un contrat de travail","une convention collective","un mandat"],"Sa situation est fixée par des textes."],
["Texte de base de la fonction publique du Pays :",["la délibération n° 95-215 AT du 14 décembre 1995","la loi du pays n° 2011-15","la loi du pays n° 2019-30","le décret du 18 août 1995"],"Le statut général."],

["Les ANT relèvent…",["du droit public, par contrat à durée limitée","du code du travail","du statut des fonctionnaires","d'aucun texte"],"Délibération n° 2004-15 APF."],
["Les ANFA relèvent…",["du droit privé et d'une convention collective","du statut général","du droit public","du code de la santé"],"Donc du code du travail."],
["Combien de groupes de sanctions disciplinaires ?",["4","2","3","5"],"Article 85."],
["Sanctions du 1er groupe :",["avertissement et blâme","blâme et révocation","exclusion et rétrogradation","mutation et amende"],"Seul le blâme figure au dossier."],
["Exclusion temporaire du 2e groupe : durée maximale",["15 jours","3 jours","2 mois","2 ans"],"6 mois à 2 ans pour le 3e groupe."],
["Qui détient le pouvoir disciplinaire ?",["Le Président de la Polynésie française","Le chef de bureau","Le syndicat","Le tribunal du travail"],"Délégation aux chefs de service pour le 1er groupe."],
["La suspension d'un fonctionnaire pour faute grave…",["dure 4 mois au plus, traitement maintenu","est une sanction","prive de traitement","dure 2 ans"],"Mesure conservatoire."],
["Le litige d'un fonctionnaire contre une sanction relève…",["du tribunal administratif","du tribunal du travail","de l'inspection du travail","de la CPS"],"Le tribunal du travail juge les salariés de droit privé."],
["Avant toute décision RH dans l'administration, on vérifie d'abord…",["le statut de l'agent","son ancienneté","son âge","son bureau"],"Fonctionnaire, ANT ou ANFA : les règles diffèrent."]],

function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};
      if(tmax)count(tmax,document.getElementById("tmr"),()=>fin(0,`Temps écoulé. La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`))}
    else{const pool=shuf(Q.it.map((t,k)=>[t,k]));let pick=[];
      const draw=()=>{z.innerHTML=`<p class="mut">Touche les étapes dans l'ordre. Touche une étape déjà placée pour l'enlever.</p><div id="chosen">${pick.map((p,n)=>`<button class="opt" data-p="${n}" style="border-color:var(--lag)"><b>${n+1}.</b> ${p[0]}</button>`).join("")}</div>${pick.length<pool.length?`<p class="mut" style="margin-top:10px">À placer :</p>`:""}<div>${pool.filter(p=>!pick.includes(p)).map(p=>`<button class="opt" data-k="${p[1]}">${p[0]}</button>`).join("")}</div>${pick.length===pool.length?`<button class="btn" id="val">Valider l'ordre</button>`:""}`;
        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});
        z.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
        const v=document.getElementById("val");if(v)v.onclick=()=>{const good=pick.filter((p,n)=>p[1]===n).length,sc=good/pool.length;
          z.innerHTML=`<p class="mut">Ordre correct :</p>`+Q.it.map((t,n)=>`<div class="opt ${pick[n][1]===n?"good":"bad"}"><b>${n+1}.</b> ${t}</div>`).join("");fin(sc===1?1:Math.round(sc*100)/100,sc===1?"Exact.":`${good} étape(s) bien placée(s) sur ${pool.length}.`)}};
      draw();if(tmax)count(tmax*1.5,document.getElementById("tmr"),()=>{z.innerHTML=Q.it.map((t,n)=>`<div class="opt"><b>${n+1}.</b> ${t}</div>`).join("");fin(0,"Temps écoulé.")})}})()}

L.push(
{t:"La CPS et la protection sociale en détail",s:"Régimes, maladie, maternité, accident du travail, retraite : ce que les RH doivent savoir expliquer.",
f:[
["Trois régimes, une caisse","<ul><li>La <b>Caisse de prévoyance sociale (CPS)</b> gère toute la protection sociale du fenua.</li><li><b>RGS</b> : régime général des <b>salariés</b>. <b>RNS</b> : régime des <b>non-salariés</b> (patentés). <b>RSPF</b> : régime de <b>solidarité</b>, pour les résidents sans autre couverture.</li><li>Tout salarié doit être <b>déclaré à la CPS</b> par son employeur.</li><li><b>Ouverture des droits maladie</b> : avoir travaillé <b>80 heures dans le mois</b>, ou avoir perçu au moins le <b>SMIG mensuel</b>.</li><li>Il n'existe <b>pas d'assurance chômage</b> en Polynésie française.</li><li><b>Après la fin du contrat</b> : les droits aux soins sont maintenus <b>90 jours</b> ; <b>180 jours</b> après un licenciement économique attesté par la Direction du travail, si la personne s'inscrit au <b>SEFI</b>.</li></ul><p class='mut'>Sources : Cleiss, SEFI. Vérifie les conditions en vigueur auprès de la CPS.</p>"],
["L'arrêt maladie : qui paie quoi","<ul><li><b>Jours 1 à 3</b> : l'<b>employeur</b> verse 100 % du salaire, dans la limite du plafond. Ces jours restent à sa charge.</li><li><b>Jours 4 à 30</b> : l'employeur <b>avance</b> 100 % du salaire, puis se fait <b>rembourser par la CPS</b>, à condition d'être à jour de ses cotisations.</li><li><b>À partir du 31e jour</b> : la <b>CPS verse directement</b> au salarié <b>75 %</b> du salaire antérieur (80 %, 85 % ou 90 % avec 1, 2 ou 3 enfants à charge).</li><li><b>Longue maladie</b> : indemnités possibles pendant <b>3 ans</b>.</li><li><b>Rôle des RH</b> : recevoir l'arrêt, établir l'attestation de salaire, demander le remboursement, organiser le remplacement, préparer le retour.</li><li>Le motif médical ne regarde pas l'employeur.</li></ul><p class='mut'>Règles décrites par le Cleiss pour 2026 ; une convention collective peut prévoir mieux.</p>"],
["La maternité, règle par règle","<ul><li><b>Congé</b> : <b>16 semaines</b>, dont <b>6 avant</b> et <b>10 après</b> l'accouchement (art. Lp. 1243-2).</li><li><b>Prolongation</b> : jusqu'à <b>21 jours</b> en cas de maladie liée à la grossesse, de prématurité ou de naissances multiples.</li><li><b>Indemnité</b> : 100 % de la moyenne des salaires des <b>3 derniers mois</b> travaillés.</li><li><b>Conditions</b> : être salariée au départ en congé et avoir <b>déclaré la grossesse à la CPS</b>.</li><li><b>Protection</b> : l'employeur ne peut pas rompre le contrat pendant la grossesse, le congé et les <b>4 semaines</b> qui suivent.</li><li><b>Allaitement</b> : <b>1 heure par jour</b>, payée, pendant <b>15 mois</b> (art. Lp. 1243-3).</li><li>Le code ne prévoit <b>pas de congé de paternité</b> ; le père a <b>3 jours</b> pour la naissance. Une convention collective peut prévoir plus.</li></ul>"],
["L'accident du travail, pas à pas","<ul><li><b>Définition</b> : accident survenu par le fait ou à l'occasion du travail. Le <b>trajet</b> domicile-travail est couvert s'il n'a pas été détourné pour un motif personnel.</li><li><b>1.</b> Remettre la <b>feuille d'accident</b> à la victime.</li><li><b>2.</b> Envoyer la <b>déclaration à la CPS dans les 48 heures</b>, avec l'attestation de salaire des 30 jours précédents.</li><li><b>3.</b> Sous <b>72 heures</b>, réclamer le certificat médical si le salarié n'a pas repris.</li><li><b>Paie</b> : le jour de l'accident est payé par l'employeur ; la CPS indemnise dès le <b>lendemain</b>.</li><li><b>Indemnités</b> : 100 % du salaire journalier pendant <b>60 jours</b>, puis <b>80 %</b>. Soins pris en charge à 100 %.</li><li><b>Maladie professionnelle</b> : déclaration dans les <b>15 jours</b> suivant l'arrêt.</li><li>Ensuite : analyser les causes et corriger.</li></ul>"],
["Retraite et prestations familiales","<ul><li><b>Âge légal</b> : <b>62 ans</b> depuis le 1er janvier 2023.</li><li><b>Durée</b> : au moins <b>5 ans</b> de cotisations pour une pension ; <b>38 ans</b> (456 mois) pour le <b>taux plein de 70 %</b>.</li><li><b>Départ anticipé</b> : dès <b>57 ans</b> avec 33 ans d'assurance, avec abattement ; <b>55 ans</b> pour travaux pénibles, sous conditions.</li><li><b>Tranche A</b> : jusqu'au plafond. <b>Tranche B</b> : au-delà, par points.</li><li><b>Allocations familiales</b> : <b>12 000 F</b> ou <b>15 000 F</b> par enfant et par mois selon les revenus.</li><li><b>Capital décès</b> : 3 mois de salaire.</li><li><b>Rôle des RH</b> : informer sans calculer à la place de la CPS, fournir les attestations, anticiper les départs.</li></ul>"]],

{t:"Contrats particuliers et emploi aidé",s:"CDD en détail, temps partiel, apprentissage, télétravail, travailleurs handicapés, aides du SEFI.",
f:[
["Le CDD, les durées exactes","<ul><li><b>Durée initiale</b> : <b>1 an</b> au plus (art. Lp. 1231-7).</li><li><b>Renouvellement</b> : <b>2 fois</b> ; la durée du renouvellement peut différer de celle du contrat initial.</li><li><b>Durée totale</b> : <b>2 ans</b> au plus, renouvellements compris.</li><li><b>Exceptions</b> : salarié étranger (durée du titre de séjour) ; salarié recruté hors du fenua (<b>3 ans</b>) ; contrats liés aux aides à l'emploi.</li><li><b>CDD avant CDI</b> : depuis 2019, un CDD de <b>6 mois</b> au plus est possible dans la perspective d'un recrutement en CDI ; il n'est <b>pas renouvelable</b>.</li><li><b>Indemnité de fin de contrat</b> : <b>6 %</b> des salaires bruts ; <b>8 %</b> dans le gardiennage et le nettoyage (art. Lp. 1231-20 et 1231-21).</li><li><b>Carence</b> : un tiers de la durée du contrat avant un nouveau CDD sur le même poste (art. Lp. 1231-24).</li></ul>"],
["Le temps partiel","<ul><li><b>Définition</b> : durée inférieure à <b>39 heures</b> ou à la durée fixée par la convention (art. Lp. 1233-1).</li><li><b>Contrat écrit</b> obligatoire (art. Lp. 1233-3) : durée, répartition, conditions de modification.</li><li><b>Heures complémentaires</b> : au plus <b>un tiers</b> de la durée prévue au contrat (art. Lp. 1233-5).</li><li>Le salarié à temps partiel a les <b>mêmes droits</b> que les autres, au prorata pour la rémunération.</li><li>Sans écrit, le contrat risque d'être considéré comme un temps complet.</li></ul>"],
["L'apprentissage","<ul><li><b>Principe</b> : alternance entre un centre de formation et l'entreprise, pour préparer un diplôme ou un titre.</li><li><b>Public</b> : demandeurs d'emploi de <b>16 à 28 ans</b> inscrits au SEFI ; dérogations d'âge possibles.</li><li><b>Durée</b> : <b>1 à 3 ans</b> selon le diplôme.</li><li><b>Rémunération</b> : au moins <b>70 % du SMIG</b>.</li><li><b>Statut</b> : salarié, 39 heures formation comprise, 2,5 jours de congés par mois, couverture CPS.</li><li><b>Deux premiers mois</b> : chaque partie peut résilier le contrat.</li><li><b>Aides</b> : le Pays soutient financièrement l'employeur. Les montants changent : vois le SEFI.</li><li>Un <b>maître d'apprentissage</b> accompagne l'apprenti.</li></ul>"],
["Le télétravail","<ul><li><b>Définition</b> (art. Lp. 1212-6) : travail qui aurait pu être fait dans les locaux, effectué hors de ces locaux, de façon <b>volontaire</b>, avec les outils numériques.</li><li><b>Cadre</b> : accord d'entreprise ou <b>charte</b> (art. Lp. 1212-7) ; à défaut, un <b>écrit</b> entre l'employeur et le salarié.</li><li>L'accord ou la charte précise : postes éligibles, lieu, <b>plages de contact</b>, conformité du lieu, modalités d'acceptation.</li><li>Le télétravailleur a les <b>mêmes droits</b> que les autres, et un <b>droit à la déconnexion</b>.</li><li><b>Circonstances exceptionnelles</b> (crise sanitaire) : il peut être imposé (art. Lp. 1212-10).</li><li>Le télétravail entre dans l'<b>évaluation des risques</b>.</li></ul>"],
["Handicap, formation, aides à l'emploi","<ul><li><b>Obligation d'emploi</b> : tout employeur d'au moins <b>25 salariés</b> (art. Lp. 5312-4 et suivants ; loi du pays n° 2024-32).</li><li><b>25 à 49 salariés</b> : au moins <b>un</b> travailleur handicapé, pour une durée cumulée d'au moins <b>50 %</b> d'un temps complet.</li><li><b>50 salariés et plus</b> : au moins <b>2 %</b> de l'effectif.</li><li>À défaut : <b>participation financière</b> au fonds d'insertion (FIPTH), ou sous-traitance avec un atelier protégé.</li><li><b>SITH</b> : stage d'insertion de 6 mois renouvelable, pris en charge par le SEFI.</li><li><b>Formation continue</b> : cotisation de <b>0,5 %</b> de la masse salariale brute, collectée par la CPS pour le <b>Fonds paritaire de gestion</b>, qui finance les formations des salariés.</li><li><b>Aides à l'embauche</b> du SEFI : elles changent souvent ; consulte sefi.pf avant de recruter.</li></ul>"]],
q:[
["Durée initiale maximale d'un CDD ?",["1 an","6 mois","18 mois","3 ans"],"Article Lp. 1231-7."],
["Combien de fois un CDD peut-il être renouvelé ?",["2 fois","1 fois","Autant que nécessaire","Jamais"],"Dans la limite de la durée totale."],
["Durée totale maximale d'un CDD, renouvellements compris (cas général) ?",["2 ans","18 mois","3 ans","5 ans"],"Sauf exceptions des articles Lp. 1231-3 et 1231-4."],

["Pour un salarié recruté hors du fenua, le CDD peut durer jusqu'à…",["3 ans","1 an","2 ans","10 ans"],"Exception prévue par le code."],
["Un contrat à temps partiel doit être…",["écrit","oral","validé par la CPS","limité à 3 mois"],"Article Lp. 1233-3."],
["Les heures complémentaires sont limitées à…",["un tiers de la durée prévue au contrat","10 % du contrat","la durée légale","aucune limite"],"Article Lp. 1233-5."],
["Contrat de 21 heures par semaine : heures complémentaires possibles au plus ?",["7 heures","2 heures","18 heures","10 heures"],"Un tiers de 21."],
["Âge habituel pour entrer en apprentissage ?",["16 à 28 ans","14 à 18 ans","18 à 40 ans","Sans limite"],"Des dérogations existent."],
["Durée d'un contrat d'apprentissage ?",["1 à 3 ans","6 mois","5 ans","3 mois"],"Selon le diplôme préparé."],
["Rémunération minimale d'un apprenti ?",["70 % du SMIG","30 % du SMIG","Le SMIG","Rien"],"Montant indiqué par le SEFI."],
["Pendant combien de temps le contrat d'apprentissage peut-il être résilié librement ?",["Les 2 premiers mois","La première semaine","6 mois","Jamais"],"Par l'une ou l'autre partie."],
["Le télétravail repose en principe sur…",["le volontariat","une décision de l'employeur seul","une autorisation de la CPS","l'ancienneté"],"Sauf circonstances exceptionnelles."],
["Sans accord ni charte, le télétravail se formalise…",["par un écrit entre l'employeur et le salarié","oralement","par une note de la CPS","il est interdit"],"Par exemple un avenant."],
["Le télétravailleur a…",["les mêmes droits que les autres salariés","moins de congés","pas de couverture accident","un salaire réduit"],"Et un droit à la déconnexion."],
["L'obligation d'emploi de travailleurs handicapés commence à…",["25 salariés","11 salariés","50 salariés","100 salariés"],"Articles Lp. 5312-4 et suivants."],
["Entreprise de 50 salariés et plus : proportion minimale de travailleurs handicapés ?",["2 % de l'effectif","6 %","10 %","0,5 %"],"Taux fixé par la loi du pays de décembre 2024."],
["La cotisation de formation professionnelle continue est de…",["0,5 % de la masse salariale brute","2 %","5 %","Elle n'existe pas"],"Collectée par la CPS pour le Fonds paritaire de gestion."],
["Qui finance les formations des salariés du privé ?",["Le Fonds paritaire de gestion","La DICP","Le tribunal du travail","L'ISPF"],"Grâce à la cotisation de 0,5 %."]],

{t:"Santé, sécurité et règles fines du quotidien",s:"Médecine du travail, prévention, jeunes travailleurs, harcèlement, paie et ancienneté.",
f:[
["La médecine du travail","<ul><li>L'employeur <b>adhère</b> à un service de santé au travail et en supporte le coût (art. Lp. 4621-7).</li><li><b>Visite d'embauche</b> : avant l'embauche ou dans les <b>30 jours</b> (art. A. 4623-14).</li><li><b>Suivi</b> : au moins <b>tous les 2 ans</b> ; <b>chaque année</b> pour les publics exposés à des risques (art. A. 4623-20).</li><li>Le médecin du travail <b>conseille</b> l'employeur et les salariés ; il est tenu au secret médical.</li><li>Il se prononce sur l'<b>aptitude</b> au poste et peut proposer des <b>aménagements</b>.</li><li><b>Inaptitude</b> : l'employeur cherche d'abord un <b>reclassement</b>. Vérifie la procédure exacte auprès de la Direction du travail avant toute rupture.</li></ul>"],
["Prévenir les risques","<ul><li>L'employeur <b>évalue les risques</b> de son entreprise (art. Lp. 4121-3) et <b>planifie la prévention</b>.</li><li>Les <b>principes de prévention</b> : éviter les risques, évaluer ceux qui restent, les combattre à la source, adapter le travail à l'homme, remplacer ce qui est dangereux, former et informer.</li><li>Le <b>salarié</b> prend soin de sa santé et de celle des autres (art. Lp. 4121-7).</li><li><b>CHSCT</b> à partir de 50 salariés ; en dessous, les délégués du personnel.</li><li><b>Après un accident</b> : analyse des causes, mesures, mise à jour de l'évaluation.</li><li>Les RH tiennent les formations sécurité, les visites médicales et les registres à jour.</li></ul>"],
["Les jeunes travailleurs","<ul><li><b>Jeune travailleur</b> : moins de <b>18 ans</b>.</li><li><b>Âge d'admission</b> au travail : <b>16 ans</b> (art. Lp. 3241-1).</li><li><b>Dès 14 ans</b> : travaux légers pendant la <b>moitié des vacances scolaires</b>, après déclaration à l'inspecteur du travail, qui a <b>8 jours</b> pour s'y opposer (art. Lp. 3241-3).</li><li><b>Repos</b> : 11 heures consécutives entre deux journées.</li><li><b>Travail de nuit</b> (20 h à 6 h) : interdit, sauf dérogation exceptionnelle.</li><li><b>Heures supplémentaires</b> : seulement avec l'autorisation de l'inspecteur.</li><li><b>Jours fériés</b> : travail interdit.</li></ul>"],
["Harcèlement : ce que dit le code","<ul><li>Articles <b>Lp. 1141-1 à 1141-12</b> (loi du pays de 2013).</li><li><b>Harcèlement moral</b> : agissements <b>répétés</b> qui dégradent les conditions de travail et portent atteinte aux droits, à la dignité, à la santé ou à l'avenir professionnel.</li><li><b>Harcèlement sexuel</b> : aucun salarié ne doit en subir.</li><li><b>Protection</b> : nul ne peut être sanctionné pour avoir subi, refusé, relaté ou témoigné. Toute rupture contraire est <b>nulle</b>.</li><li><b>Auteur</b> : passible d'une <b>sanction disciplinaire</b>.</li><li><b>Employeur</b> : il <b>prévient</b>, avec le médecin du travail et le CHSCT ou les délégués ; le règlement intérieur prévoit la procédure de signalement.</li><li><b>Méthode RH</b> : écouter, écrire les faits, protéger, enquêter en entendant chacun, décider, suivre.</li></ul>"],
["Paie, temps et ancienneté : les règles fines","<ul><li><b>Paiement</b> : au plus tard <b>8 jours</b> après la fin du mois de travail.</li><li><b>Espèces</b> : limitées à <b>119 300 F</b> ; au-delà, chèque ou virement.</li><li><b>Livre de paie</b> obligatoire (art. Lp. 3333-1).</li><li><b>Prime d'ancienneté</b> : <b>3 %</b> après 3 ans, puis <b>1 % par an</b>, dans la limite de <b>25 %</b> (art. Lp. 3321-3).</li><li><b>Congés supplémentaires</b> : +2 jours après 20 ans, +4 après 25 ans, +6 après 30 ans (art. Lp. 3231-10).</li><li><b>Semaine</b> : du lundi 0 h au dimanche 24 h ; horaire réparti sur <b>4 à 6 jours</b> ; jamais plus de 6 jours de travail.</li><li>Les heures supplémentaires <b>se paient</b> : elles ne sont pas remplacées par un repos (art. Lp. 3332-6).</li></ul>"]],
q:[
["Qui paie l'adhésion au service de santé au travail ?",["L'employeur","Le salarié","La CPS","Le SEFI"],"Article Lp. 4621-7."],
["Le suivi médical des salariés a lieu au moins…",["tous les 2 ans","tous les 5 ans","tous les mois","une seule fois"],"Chaque année pour les publics à risque."],
["Le médecin du travail est avant tout…",["un conseiller de l'employeur et des salariés, tenu au secret","un contrôleur de la CPS","le représentant du dirigeant","un inspecteur"],"Il ne transmet pas de diagnostic à l'employeur."],
["Face à une inaptitude, l'employeur doit d'abord…",["chercher un reclassement","licencier le jour même","baisser le salaire","demander une démission"],"La rupture ne vient qu'ensuite, dans les règles."],
["L'évaluation des risques est à la charge de…",["l'employeur","chaque salarié","la mairie","le médecin traitant"],"Article Lp. 4121-3."],
["Premier principe de prévention ?",["Éviter les risques","Distribuer des gants","Sanctionner","Afficher des consignes"],"La protection individuelle vient en dernier."],
["En dessous de 50 salariés, qui exerce les missions du CHSCT ?",["Les délégués du personnel","Personne","Le comptable","Le SEFI"],"Article Lp. 2423-7."],
["Âge d'admission au travail ?",["16 ans","14 ans","18 ans","15 ans"],"Article Lp. 3241-1."],
["Un jeune de 14 ans peut faire des travaux légers…",["pendant la moitié de ses vacances scolaires, après déclaration","toute l'année","la nuit","jamais"],"L'inspecteur a 8 jours pour s'y opposer."],
["Le travail de nuit des moins de 18 ans est…",["interdit, sauf dérogation exceptionnelle","libre","payé double","obligatoire en hôtellerie"],"La nuit va de 20 h à 6 h."],
["Un mineur peut-il travailler un jour férié ?",["Non","Oui, s'il est d'accord","Oui, payé double","Oui, le matin"],"Article Lp. 3241-11."],
["Le harcèlement moral suppose des agissements…",["répétés","uniques","écrits","publics"],"Un fait isolé peut être fautif sans être du harcèlement."],
["Un salarié qui témoigne de faits de harcèlement…",["ne peut pas être sanctionné pour cela","doit démissionner","perd son ancienneté","doit payer une caution"],"Toute mesure contraire est nulle."],
["L'auteur d'un harcèlement est passible…",["d'une sanction disciplinaire","d'une prime","d'une mutation choisie","de rien"],"Sans préjudice des suites pénales."],
["La procédure de signalement du harcèlement figure dans…",["le règlement intérieur","le bulletin de paie","le registre du commerce","la DPAE"],"Article Lp. 1141-10."],
["Le salaire doit être payé au plus tard…",["8 jours après la fin du mois","le 30 du mois suivant","le 15 du mois suivant","quand la trésorerie le permet"],"Articles Lp. 3331-3 à 3331-5."],
["Plafond de paiement du salaire en espèces ?",["119 300 F","50 000 F","500 000 F","Aucun"],"Au-delà : chèque ou virement."],

{t:"Ruptures complexes et contentieux",s:"Licenciement économique, salariés protégés, travail clandestin, tribunal du travail.",
f:[
["Le licenciement économique","<ul><li><b>Définition</b> (art. Lp. 1222-11) : motif <b>non lié à la personne</b> du salarié : suppression ou transformation d'emploi, modification substantielle du contrat, à cause de difficultés économiques sérieuses, de mutations technologiques, d'une réorganisation pour sauvegarder la compétitivité ou d'une cessation d'activité.</li><li><b>Avant tout</b> : chercher un <b>reclassement</b> dans l'entreprise.</li><li><b>Un seul salarié</b> sur 2 mois : entretien préalable, puis notification.</li><li><b>Collectif</b>, entreprise de 11 salariés et plus : <b>consultation des représentants du personnel</b>, puis entretien de chaque salarié, puis notification.</li><li>La <b>Direction du travail</b> est informée.</li><li><b>Le salarié</b> demande à la Direction du travail une attestation, s'inscrit au SEFI et garde ses droits aux soins <b>180 jours</b>.</li></ul>"],
["Les salariés protégés","<ul><li><b>Qui</b> (art. Lp. 2511-1) : délégué syndical, délégué du personnel, membre du CHSCT, membre du comité d'entreprise, entre autres.</li><li><b>Règle</b> : leur licenciement n'est possible qu'<b>après autorisation de l'inspecteur du travail</b>.</li><li>L'inspecteur vérifie la procédure, le motif, et l'<b>absence de lien avec le mandat</b>.</li><li>Sa décision peut être contestée devant le <b>tribunal administratif</b>.</li><li>Un licenciement sans autorisation est <b>nul</b>.</li><li>La protection ne donne pas l'impunité : une faute réelle peut être sanctionnée, en suivant la procédure.</li></ul>"],
["Le travail clandestin","<ul><li><b>Exemples</b> : salarié non déclaré à la CPS ; bulletin de paie qui mentionne <b>moins d'heures</b> que les heures faites (art. Lp. 5611-1 et suivants).</li><li><b>Pour le salarié</b> : en cas de rupture, une <b>indemnité forfaitaire de 6 mois de salaire</b> (art. Lp. 5611-12), en plus du reste.</li><li><b>Pour l'employeur</b> : rappel de cotisations, sanctions pénales et administratives.</li><li><b>Donneur d'ordre</b> : pour un contrat d'au moins <b>400 000 F</b>, il vérifie que son cocontractant est en règle (art. Lp. 5611-8), sinon il peut être tenu solidairement.</li><li>Les RH sont la première barrière : DPAE, heures réelles sur le bulletin, vérification des sous-traitants.</li></ul>"],
["Le tribunal du travail","<ul><li><b>Compétence</b> : litiges <b>individuels</b> entre employeur et salarié liés au contrat de travail.</li><li><b>Procédure</b> : <b>orale et gratuite</b> ; les parties comparaissent en principe <b>en personne</b>.</li><li><b>Urgence</b> : le président peut statuer en <b>référé</b>.</li><li><b>Prescription des salaires</b> : <b>5 ans</b> (art. Lp. 3334-1).</li><li><b>Appel</b> : cour d'appel de Papeete.</li><li><b>Agents publics</b> non titulaires de droit public et fonctionnaires : <b>tribunal administratif</b>.</li><li><b>Préparer un dossier</b> : contrat, bulletins, courriers datés, preuves de remise, chronologie. Ce qui n'est pas écrit se prouve mal.</li></ul>"],
["Démission, accord, abandon de poste","<ul><li><b>Démission</b> : volonté <b>claire</b> du salarié ; préavis fixé par le contrat, la convention ou l'accord.</li><li><b>Pendant le préavis</b> : un jour d'absence payé par semaine pour chercher un emploi (art. Lp. 1224-2).</li><li><b>Préavis non exécuté</b> sans accord : indemnité compensatrice due par celui qui ne le respecte pas (art. Lp. 1225-3).</li><li><b>Rupture conventionnelle</b> : ce dispositif métropolitain <b>n'existe pas</b> dans le code polynésien (cour d'appel de Papeete, 2017). Une rupture d'un commun accord n'a donc ni homologation ni délai de rétractation : consentement libre, écrit précis, prudence.</li><li><b>Abandon de poste</b> : ce n'est pas une démission. L'employeur demande au salarié ses intentions, puis engage une procédure de licenciement s'il y a lieu.</li></ul>"]],
q:[
["Un licenciement économique repose sur un motif…",["non lié à la personne du salarié","disciplinaire","médical","choisi par le salarié"],"Article Lp. 1222-11."],

["Licenciement économique collectif dans une entreprise de 11 salariés et plus : première étape ?",["Consulter les représentants du personnel","Envoyer les lettres","Afficher la liste","Prévenir la presse"],"Puis entretiens, puis notifications."],
["Quelle administration est informée d'un licenciement économique ?",["La Direction du travail","La DICP","L'ISPF","La mairie"],"Elle délivre aussi l'attestation au salarié."],

["Pour licencier un délégué du personnel, il faut…",["l'autorisation de l'inspecteur du travail","l'accord du syndicat","un vote des salariés","rien de particulier"],"Article Lp. 2511-1."],
["L'inspecteur du travail vérifie notamment…",["que le licenciement n'a pas de lien avec le mandat","le chiffre d'affaires","le casier du dirigeant","les notes du salarié à l'école"],"C'est le cœur de la protection."],
["Un salarié protégé licencié sans autorisation : le licenciement est…",["nul","valable","suspendu un mois","transformé en démission"],"Avec un droit à réintégration et indemnisation."],
["La décision de l'inspecteur du travail se conteste devant…",["le tribunal administratif","le tribunal du travail","la CPS","le SEFI"],"C'est une décision administrative."],
["Un bulletin de paie qui indique moins d'heures que les heures faites, c'est…",["du travail clandestin","une tolérance","une simple erreur sans conséquence","une prime cachée"],"Jugé ainsi par la cour d'appel de Papeete."],
["En cas de travail clandestin, le salarié dont le contrat est rompu a droit à…",["une indemnité forfaitaire de 6 mois de salaire","1 mois de salaire","rien","un CDD"],"Article Lp. 5611-12."],
["Le donneur d'ordre doit vérifier son cocontractant à partir de…",["400 000 F","50 000 F","5 000 000 F","tout montant"],"Article Lp. 5611-8."],
["La procédure devant le tribunal du travail est…",["orale et gratuite","écrite et payante","réservée aux avocats","secrète"],"Les parties comparaissent en principe en personne."],
["Prescription des salaires ?",["5 ans","1 an","10 ans","30 ans"],"Article Lp. 3334-1."],
["En cas d'urgence, on saisit le président du tribunal du travail…",["en référé","par pétition","par la CPS","par courriel au SEFI"],"Par requête et assignation."],
["Un fonctionnaire conteste une sanction devant…",["le tribunal administratif","le tribunal du travail","le tribunal de commerce","la CAP uniquement"],"Le tribunal du travail juge les contrats de droit privé."],
["Pendant son préavis, le salarié a droit pour chercher un emploi à…",["un jour d'absence payé par semaine","rien","une semaine par mois","deux heures par mois"],"Article Lp. 1224-2."],
["La rupture conventionnelle homologuée, en Polynésie française…",["n'est pas prévue par le code du travail","est obligatoire","se signe à la CPS","dure 15 jours"],"Aucun texte local ne l'organise."],
["Un salarié ne vient plus depuis dix jours. C'est…",["un abandon de poste, pas une démission","une démission automatique","un congé sans solde","une faute lourde d'office"],"L'employeur l'interroge puis engage une procédure s'il y a lieu."],
["Devant un juge, la meilleure preuve est…",["un écrit daté avec preuve de remise","un souvenir","la parole du dirigeant","un message supprimé"],"Convocations, lettres, bulletins, décharges."]],

{t:"Fonction publique : gérer les agents au quotidien",s:"Congés, positions, notation, contractuels, droits récents.",
f:[
["Les congés du fonctionnaire","<ul><li>Les congés sont prévus par les articles 27 et 28 du statut et par la <b>délibération n° 95-220 AT</b>.</li><li><b>Congé annuel</b> : <b>5 fois</b> les obligations hebdomadaires de service. Pour 5 jours par semaine : 25 jours ouvrés.</li><li>L'agent doit prendre au moins <b>10 jours ouvrés</b> de congé par an.</li><li>À temps partiel : congé calculé <b>au prorata</b>.</li><li><b>Congé de maladie</b> : jusqu'à <b>1 an</b> sur une période de 12 mois consécutifs.</li><li>Il existe aussi : longue maladie, longue durée, maternité, charges parentales, formation professionnelle, formation syndicale.</li></ul>"],
["Les positions","<ul><li><b>Activité</b> : l'agent exerce ses fonctions.</li><li><b>Détachement</b> : il travaille hors de son cadre d'emplois et garde ses droits à avancement. <b>Courte durée</b> : 6 mois au plus, non renouvelable. <b>Longue durée</b> : 5 ans au plus, renouvelable.</li><li><b>Disponibilité</b> : il sort temporairement de l'administration et ne perçoit plus de traitement. D'office : 1 an au plus par période.</li><li><b>Congé parental</b>.</li><li>Chaque changement de position se décide par <b>arrêté</b> et se gère avec la DTI.</li></ul>"],
["Notation et carrière","<ul><li>Chaque fonctionnaire reçoit une <b>notation annuelle</b> et une <b>appréciation générale</b>.</li><li>L'<b>entretien</b> avec le supérieur est le moment pour fixer des objectifs et parler formation.</li><li><b>Avancement d'échelon</b> : à l'ancienneté, modulé par la valeur professionnelle.</li><li><b>Avancement de grade</b> : au choix ou par examen, après avis de la <b>CAP</b>.</li><li><b>Catégories</b> A, B, C, D ; <b>cadres d'emplois</b> par filière.</li><li>Une notation non motivée ou jamais expliquée crée du contentieux.</li></ul>"],
["Les contractuels en détail","<ul><li><b>ANT</b> (agents non titulaires) : droit <b>public</b>, délibération n° 2004-15 APF ; recrutement dans les cas prévus aux articles 33 et 34 du statut.</li><li><b>Besoin saisonnier ou surcroît d'activité</b> : 1 an au plus, renouvellements compris.</li><li>Les autres cas ont des durées maximales de plusieurs années fixées par le texte : vérifie le cas exact sur Lexpol.</li><li><b>ANFA</b> : agents de droit <b>privé</b>, régis par leur convention collective ; litiges devant le tribunal du travail.</li><li>ANT et fonctionnaires : litiges devant le <b>tribunal administratif</b>.</li><li>Un contrat public ne se transforme pas en titularisation : il faut le <b>concours</b>.</li></ul>"],
["Les droits récents des agents","<ul><li><b>Télétravail</b> : loi du pays n° 2022-38 du 10 novembre 2022. Autorisation sur <b>demande écrite</b> de l'agent, pour <b>12 mois</b> au plus, renouvelable ; un refus est <b>motivé par écrit</b> après un entretien.</li><li><b>Harcèlement</b> : protection inscrite au statut (articles 5-2 et 5-3).</li><li><b>Handicap</b> : l'obligation d'emploi s'applique aussi au Pays et à ses établissements publics administratifs.</li><li><b>Grève</b> : préavis de 5 jours francs ; pendant le préavis, on négocie.</li><li><b>Jours fériés</b> des agents : fixés par arrêté pris en conseil des ministres.</li></ul>"]],
q:[
["Le congé annuel d'un fonctionnaire du Pays est égal à…",["5 fois ses obligations hebdomadaires de service","30 jours ouvrables","2,5 jours par mois","20 jours"],"Soit 25 jours ouvrés pour 5 jours par semaine."],
["Un agent qui travaille 5 jours par semaine a droit à…",["25 jours ouvrés de congé annuel","30 jours","15 jours","50 jours"],"5 × 5."],
["L'agent doit prendre chaque année au moins…",["10 jours ouvrés de congé","1 jour","25 jours","aucun minimum"],"Règle de la délibération sur les congés."],
["Congé de maladie ordinaire : durée maximale sur 12 mois ?",["1 an","3 mois","6 mois","3 ans"],"Au-delà : avis du comité médical."],
["Le détachement de courte durée dure au plus…",["6 mois, sans renouvellement","1 an","5 ans","1 mois"],"L'agent est ensuite réintégré."],
["Le détachement de longue durée dure au plus…",["5 ans, renouvelable","6 mois","10 ans","1 an"],"L'agent garde ses droits à avancement."],
["En disponibilité, le fonctionnaire…",["ne perçoit plus son traitement","garde son salaire","est radié","est en congé annuel"],"Il sort temporairement de l'administration."],

["Les ANFA sont régis par…",["leur convention collective, en droit privé","le statut général","le code de commerce","aucun texte"],"Leurs litiges vont au tribunal du travail."],
["Litige d'un ANT avec l'administration : quel juge ?",["Le tribunal administratif","Le tribunal du travail","Le tribunal de commerce","La cour d'assises"],"Contrat de droit public."],
["Comment un contractuel devient-il fonctionnaire ?",["En réussissant un concours","Après 2 ans de contrat","Sur lettre du chef de service","Automatiquement à 40 ans"],"L'ancienneté ne titularise pas."],
["Le télétravail d'un agent public s'obtient…",["sur demande écrite de l'agent","sur ordre oral","par tirage au sort","par ancienneté seulement"],"Loi du pays n° 2022-38."],
["L'autorisation de télétravail d'un agent est accordée pour…",["12 mois au plus, renouvelable","toute la carrière","1 semaine","5 ans"],"Elle est ensuite réexaminée."],
["Un refus de télétravail dans l'administration doit être…",["motivé par écrit, après un entretien","oral","affiché","validé par la CPS"],"L'agent connaît les raisons."],
["La protection contre le harcèlement figure…",["dans le statut général, articles 5-2 et 5-3","seulement dans le code pénal","dans aucun texte","dans la convention du commerce"],"Pour le privé : articles Lp. 1141-1 et suivants."],
["L'obligation d'emploi de travailleurs handicapés concerne-t-elle l'administration du Pays ?",["Oui","Non","Seulement les communes","Seulement l'État"],"Elle a été étendue au Pays et à ses établissements publics administratifs."],
["Les jours fériés des agents du Pays sont fixés par…",["arrêté pris en conseil des ministres","chaque chef de service","la CPS","les syndicats"],"Aligné sur la liste du code du travail."]],

{t:"Les bases : choisir, produire, échanger",s:"Rareté, agents, marché, prix.",
f:[
["Rareté, choix et coût d'opportunité","<ul><li>L'économie étudie comment on utilise des ressources <b>limitées</b> pour répondre à des besoins nombreux.</li><li><b>Choisir, c'est renoncer</b> : le <b>coût d'opportunité</b> est ce à quoi on renonce en faisant un choix.</li><li>Exemple : une heure passée à pêcher est une heure qui n'est pas passée à réparer le bateau.</li><li><b>Biens</b> (objets) et <b>services</b> (prestations).</li><li><b>Facteurs de production</b> : travail, capital (machines, bâtiments), ressources naturelles, savoir-faire.</li><li><b>Productivité</b> : ce qu'on produit par heure de travail ou par unité de capital.</li></ul>"],
["Les acteurs et le circuit","<ul><li><b>Ménages</b> : travaillent, consomment, épargnent.</li><li><b>Entreprises</b> : produisent, embauchent, investissent.</li><li><b>Administrations</b> : prélèvent des impôts et cotisations, fournissent des services, redistribuent.</li><li><b>Banques</b> : collectent l'épargne et accordent des crédits.</li><li><b>Reste du monde</b> : importations et exportations.</li><li><b>Circuit</b> : les dépenses des uns sont les revenus des autres. Un salaire versé devient un achat, donc un chiffre d'affaires, donc un autre salaire.</li><li><b>Revenu</b> = consommation + épargne.</li></ul>"],
["L'offre, la demande, le prix","<ul><li><b>Demande</b> : quand le prix monte, on achète en général moins.</li><li><b>Offre</b> : quand le prix monte, les vendeurs proposent en général plus.</li><li><b>Prix d'équilibre</b> : celui où la quantité offerte égale la quantité demandée.</li><li>Trop peu de produit pour la demande : <b>pénurie</b>, le prix monte. Trop de produit : <b>excédent</b>, le prix baisse.</li><li><b>Élasticité</b> : sensibilité de la demande au prix. Produit indispensable (riz, carburant) : demande peu élastique.</li><li>Élasticité = variation de la quantité en % ÷ variation du prix en %.</li></ul>"],
["Concurrence, monopole, régulation","<ul><li><b>Concurrence</b> : plusieurs vendeurs ; elle pousse les prix vers le bas et la qualité vers le haut.</li><li><b>Monopole</b> : un seul vendeur ; il peut fixer un prix élevé. <b>Oligopole</b> : quelques vendeurs.</li><li>Dans une <b>petite économie insulaire</b>, les marchés sont étroits : peu d'entreprises peuvent être rentables, la concurrence est limitée.</li><li><b>Régulation</b> : une autorité surveille les ententes et les abus de position dominante.</li><li><b>Défaillances du marché</b> : pollution, biens collectifs (routes, phares), information inégale. L'intervention publique peut les corriger.</li><li>Le <b>contrôle des prix</b> protège à court terme, mais peut décourager l'offre.</li></ul>"]],
q:[
["Le coût d'opportunité, c'est…",["ce à quoi on renonce en faisant un choix","le prix payé en caisse","une taxe","le coût du transport"],"Choisir, c'est renoncer."],
["Lequel est un service ?",["Une coupe de cheveux","Un sac de riz","Un moteur","Une planche de surf"],"Une prestation, pas un objet."],
["Revenu d'un ménage = consommation + …",["épargne","impôts seulement","dette","exportations"],"Ce qui n'est pas consommé est épargné."],
["Quand le prix d'un produit augmente, la demande en général…",["diminue","augmente","ne change jamais","double"],"Loi de la demande."],
["Le prix d'équilibre est celui où…",["quantité offerte = quantité demandée","le vendeur gagne le plus","l'État décide","le produit est gratuit"],"Ni pénurie ni excédent."],
["Une pénurie fait en général…",["monter le prix","baisser le prix","disparaître la demande","baisser les salaires"],"Trop peu de produit pour trop d'acheteurs."],
["La demande de carburant est dite…",["peu élastique","très élastique","nulle","infinie"],"On en a besoin même si le prix monte."],
["Le prix monte de 10 %, la quantité demandée baisse de 5 %. Élasticité (en valeur absolue) ?",["0,5","2","5","50"],"5 ÷ 10."],
["Un seul vendeur sur un marché, c'est…",["un monopole","un oligopole","une concurrence parfaite","un troc"],"Quelques vendeurs : oligopole."],
["Dans une petite économie insulaire, la concurrence est souvent…",["limitée, car le marché est étroit","très forte","interdite","sans effet"],"Peu d'entreprises peuvent être rentables."],
["Un phare ou une route est un exemple de…",["bien collectif","bien de luxe","monopole privé","exportation"],"Le marché seul le fournit mal."],
["La productivité mesure…",["ce qu'on produit par heure de travail","le nombre de salariés","le prix de vente","le bénéfice"],"Elle est la source durable des hausses de revenu."]],

{t:"Mesurer l'économie",s:"PIB, croissance, inflation, emploi, commerce extérieur.",
f:[
["Le PIB et la croissance","<ul><li><b>PIB</b> (produit intérieur brut) : valeur de tout ce qui est produit sur un territoire en un an.</li><li><b>Valeur ajoutée</b> d'une entreprise = production − consommations intermédiaires. Le PIB est la somme des valeurs ajoutées.</li><li><b>Croissance</b> = (PIB de l'année − PIB de l'année précédente) ÷ PIB de l'année précédente × 100.</li><li><b>PIB par habitant</b> = PIB ÷ population : un niveau de vie moyen, qui ne dit rien des inégalités.</li><li><b>Limites</b> : le PIB ne compte ni le travail domestique, ni l'entraide, ni l'autoconsommation (pêche, fa'a'apu), ni l'état de l'environnement.</li></ul>"],
["L'inflation et le pouvoir d'achat","<ul><li><b>Inflation</b> : hausse générale et durable des prix.</li><li><b>Indice des prix à la consommation</b> : il suit le prix d'un panier de biens et services. Au fenua, il est calculé par l'<b>ISPF</b>.</li><li><b>Pouvoir d'achat</b> : ce qu'un revenu permet d'acheter.</li><li><b>Évolution réelle</b> ≈ évolution du revenu − inflation. Salaire +2 %, prix +3 % : pouvoir d'achat −1 %.</li><li><b>Qui y perd</b> : les revenus fixes, les épargnants. <b>Qui y gagne</b> : ceux qui remboursent une dette à taux fixe.</li><li><b>Déflation</b> : baisse générale des prix ; elle freine les achats et l'investissement.</li></ul>"],
["L'emploi et le chômage","<ul><li><b>Population active</b> = personnes en emploi + chômeurs.</li><li><b>Chômeur</b> (définition internationale) : sans emploi, disponible, en recherche active.</li><li><b>Taux de chômage</b> = chômeurs ÷ population active × 100.</li><li><b>Taux d'emploi</b> = personnes en emploi ÷ population en âge de travailler × 100.</li><li>Au fenua, beaucoup de personnes sans emploi <b>ne cherchent pas</b> activement faute d'offres sur leur île : elles ne sont pas comptées comme chômeuses. Le taux d'emploi décrit mieux la situation.</li><li>Il n'existe <b>pas d'assurance chômage</b> en Polynésie française.</li></ul>"],
["Les échanges avec l'extérieur","<ul><li><b>Importations</b> : achats à l'extérieur. <b>Exportations</b> : ventes à l'extérieur.</li><li><b>Balance commerciale</b> = exportations − importations de biens.</li><li><b>Taux de couverture</b> = exportations ÷ importations × 100.</li><li>Le fenua importe l'essentiel de ce qu'il consomme : la balance des biens est très <b>déficitaire</b>.</li><li>Ce déficit est compensé par les <b>services</b> (tourisme) et par les <b>transferts</b> de l'État.</li><li><b>Taux de change</b> : prix d'une monnaie dans une autre. Une monnaie forte rend les importations moins chères et les exportations plus difficiles.</li></ul>"]],

{t:"Monnaie, banques et finances publiques",s:"À quoi sert la monnaie, comment naît le crédit, comment se construit un budget.",
f:[
["La monnaie","<ul><li><b>Trois fonctions</b> : payer, compter (unité de mesure), mettre en réserve.</li><li><b>Formes</b> : pièces et billets ; surtout <b>monnaie scripturale</b> (soldes des comptes bancaires).</li><li>Au fenua : le <b>franc Pacifique</b> (XPF), émis par l'<b>IEOM</b>.</li><li><b>Parité fixe</b> avec l'euro : <b>1 000 F = 8,38 €</b>, soit 1 € = 119,33 F.</li><li>La parité fixe apporte de la stabilité ; en contrepartie, le fenua ne peut pas dévaluer pour vendre moins cher.</li><li>La monnaie repose sur la <b>confiance</b>.</li></ul>"],
["Les banques et le crédit","<ul><li>Une banque collecte des <b>dépôts</b> et accorde des <b>crédits</b>.</li><li>Quand elle prête, elle crédite le compte de l'emprunteur : elle <b>crée de la monnaie</b>. Le remboursement la détruit.</li><li><b>Taux d'intérêt</b> : prix du crédit. Intérêt simple sur un an = capital × taux.</li><li>La <b>banque centrale</b> fixe des taux directeurs : taux bas, crédit facile ; taux hauts, crédit freiné et inflation contenue.</li><li>La banque évalue : <b>capacité de remboursement</b>, apport, garanties, stabilité des revenus.</li><li><b>Taux d'endettement</b> = mensualités ÷ revenus × 100.</li></ul>"],
["Le budget public","<ul><li><b>Recettes</b> : impôts, taxes, dotations. <b>Dépenses</b> : fonctionnement (salaires, services) et investissement (routes, écoles).</li><li><b>Déficit</b> : dépenses supérieures aux recettes. Il se finance par l'<b>emprunt</b>, donc par la <b>dette</b>.</li><li><b>Impôts directs</b> : payés selon le revenu ou le bénéfice. <b>Impôts indirects</b> : compris dans les prix (TVA, droits à l'importation).</li><li>Au fenua : <b>pas d'impôt sur le revenu</b> des personnes ; une <b>contribution de solidarité</b> (CST) sur les revenus ; une fiscalité largement <b>indirecte</b>.</li><li>Un impôt indirect pèse proportionnellement plus sur les petits revenus, qui consomment tout ce qu'ils gagnent.</li></ul>"],
["Les politiques économiques","<ul><li><b>Politique budgétaire</b> : dépenser plus ou baisser les impôts pour soutenir l'activité ; l'inverse pour réduire le déficit.</li><li><b>Politique monétaire</b> : agir sur les taux d'intérêt.</li><li><b>Effet multiplicateur</b> : une dépense publique devient un revenu, qui est en partie redépensé.</li><li>Dans une économie très ouverte comme le fenua, une grande part de la dépense part en <b>importations</b> : l'effet est plus faible.</li><li><b>Redistribution</b> : prestations, services publics, aides.</li><li>Toute politique a un <b>coût</b> et des <b>gagnants et perdants</b> : c'est un choix collectif.</li></ul>"]],

{t:"L'économie du fenua et l'entreprise",s:"Forces, contraintes, institutions, et les calculs de base d'une activité.",
f:[
["Les moteurs de l'économie polynésienne","<ul><li><b>Services</b> : l'essentiel de l'activité (commerce, administration, tourisme).</li><li><b>Tourisme</b> : première ressource propre du fenua.</li><li><b>Perle</b> de culture, <b>pêche</b>, <b>coprah</b>, vanille, monoï : exportations emblématiques, de poids modeste en valeur.</li><li><b>Transferts de l'État</b> : salaires des fonctionnaires d'État, dotations, pensions ; une part majeure des ressources.</li><li><b>Secteur public</b> important dans l'emploi.</li><li><b>Économie non marchande</b> : pêche, agriculture vivrière, entraide familiale.</li></ul>"],
["Les contraintes d'une économie insulaire","<ul><li><b>Éloignement</b> : coût du fret, délais, stocks importants.</li><li><b>Dispersion</b> : 118 îles sur une surface grande comme l'Europe ; transport inter-îles coûteux.</li><li><b>Petit marché</b> : peu d'économies d'échelle, concurrence limitée.</li><li><b>Dépendance</b> : énergie, alimentation et biens d'équipement importés.</li><li><b>Vulnérabilité</b> : crises mondiales, cyclones, montée des eaux.</li><li><b>Coût de la vie</b> élevé.</li><li><b>Atouts</b> : zone maritime immense, culture, environnement, jeunesse.</li></ul>"],
["Qui fait quoi","<ul><li><b>ISPF</b> : statistiques (prix, emploi, population, comptes économiques).</li><li><b>IEOM</b> : monnaie, suivi des banques, études de conjoncture.</li><li><b>CCISM</b> : chambre de commerce, d'industrie, des services et des métiers ; formalités et accompagnement des entreprises.</li><li><b>CESEC</b> : assemblée consultative de la société civile.</li><li><b>DICP</b> : impôts. <b>CPS</b> : protection sociale. <b>SEFI</b> : emploi.</li><li><b>Patente</b> : contribution due pour exercer une activité indépendante.</li><li><b>Sources fiables</b> : publications de l'ISPF et de l'IEOM avant les réseaux sociaux.</li></ul>"],

function atelier(n,done,back){const A=AT[n],D=dif(),tmax=D===2?60:D===1?120:0;let i=0,pts=0;AUSRC=null;
  const fmtn=v=>String(v).replace(".",",").replace(/\B(?=(\d{3})+(?!\d))/g," ");
  (function show(){halt();const Q=A.it[i];window.scrollTo(0,0);
    app.innerHTML=hdr(`Atelier · ${i+1}/${A.it.length}`)+`<div class="card"><span class="tag">${A.t}</span><p class="q">${Q.q}</p>${tmax?`<div class="timer" id="tmr" style="font-size:22px"></div>`:""}<div id="zone"></div><div id="fb"></div></div>`;
    bindBack(back);const z=document.getElementById("zone"),fb=document.getElementById("fb");
    const fin=(sc,msg)=>{halt();pts+=sc;z.querySelectorAll("button,input").forEach(x=>x.disabled=true);
      fb.innerHTML=`<div class="fb" style="border-color:${sc===1?"var(--ok)":sc>0?"var(--gold)":"var(--ko)"}"><b>${msg}</b> ${Q.x}</div><button class="btn" id="nx">${i<A.it.length-1?"Suivant":"Terminer"}</button>`;
      document.getElementById("nx").onclick=()=>{i++;i<A.it.length?show():done(Math.round(pts/A.it.length*100))}};
    if(Q.k==="num"){z.innerHTML=`<div class="row"><input id="ans" type="text" inputmode="decimal" placeholder="Ta réponse" style="flex:2;padding:13px;border-radius:11px;border:1.5px solid var(--line);font:inherit;background:var(--bg);color:var(--ink)"><span style="flex:0 0 auto;font-weight:700">${Q.u}</span></div><button class="btn" id="val">Valider</button>`;
      const check=()=>{const raw=document.getElementById("ans").value.replace(/\s/g,"").replace(",",".");const v=parseFloat(raw);if(isNaN(v))return toast("Entre un nombre.");const ok=Math.abs(v-Q.a)<=Q.tol+1e-9;fin(ok?1:0,ok?"Exact.":`La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`)};
      document.getElementById("val").onclick=check;document.getElementById("ans").onkeydown=e=>{if(e.key==="Enter")check()};
      if(tmax)count(tmax,document.getElementById("tmr"),()=>fin(0,`Temps écoulé. La bonne réponse : ${fmtn(Q.a)} ${Q.u}.`))}
    else{const pool=shuf(Q.it.map((t,k)=>[t,k]));let pick=[];
      const draw=()=>{z.innerHTML=`<p class="mut">Touche les étapes dans l'ordre. Touche une étape déjà placée pour l'enlever.</p><div id="chosen">${pick.map((p,n)=>`<button class="opt" data-p="${n}" style="border-color:var(--lag)"><b>${n+1}.</b> ${p[0]}</button>`).join("")}</div>${pick.length<pool.length?`<p class="mut" style="margin-top:10px">À placer :</p>`:""}<div>${pool.filter(p=>!pick.includes(p)).map(p=>`<button class="opt" data-k="${p[1]}">${p[0]}</button>`).join("")}</div>${pick.length===pool.length?`<button class="btn" id="val">Valider l'ordre</button>`:""}`;
        z.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{pick.push(pool.find(p=>p[1]===+b.dataset.k));draw()});
        z.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{pick.splice(+b.dataset.p,1);draw()});
        const v=document.getElementById("val");if(v)v.onclick=()=>{const good=pick.filter((p,n)=>p[1]===n).length,sc=good/pool.length;
          z.innerHTML=`<p class="mut">Ordre correct :</p>`+Q.it.map((t,n)=>`<div class="opt ${pick[n][1]===n?"good":"bad"}"><b>${n+1}.</b> ${t}</div>`).join("");fin(sc===1?1:Math.round(sc*100)/100,sc===1?"Exact.":`${good} étape(s) bien placée(s) sur ${pool.length}.`)}};
      draw();if(tmax)count(tmax*1.5,document.getElementById("tmr"),()=>{z.innerHTML=Q.it.map((t,n)=>`<div class="opt"><b>${n+1}.</b> ${t}</div>`).join("");fin(0,"Temps écoulé.")})}})()}

  const w=shuf(S.w.filter(k=>pool.includes(k))),rest=shuf(pool.filter(k=>!w.includes(k)));

function readOut(btn){
  if(AU||(TTS&&speechSynthesis.speaking)){hush();btn.textContent="🔊 Écouter";return}
  if(!TTS)return toast("La lecture audio utilise la voix du téléphone : ouvre le jeu dans Chrome ou installe l'application (Profil).")
  try{
  const box=document.createElement("div");app.querySelectorAll(".card").forEach(c=>box.appendChild(c.cloneNode(true)));
  box.querySelectorAll("textarea,.timer,.btn,.tag,.av,input").forEach(x=>x.remove());
  box.querySelectorAll("li,p,h2,h3,.opt,.fb,label,b").forEach(x=>x.append(". "));
  const txt=box.textContent.replace(/[✓✗≈«»]/g," ").replace(/\s+/g," ").trim();if(!txt)return;
  const parts=txt.match(/[^.!?]+[.!?]*/g)||[txt];let n=0;
  parts.forEach(t=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.95;
    const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;
    u.onend=u.onerror=()=>{if(++n>=parts.length)btn.textContent="🔊 Écouter"};speechSynthesis.speak(u)});
  btn.textContent="⏹ Arrêter"}catch(e){}}
function hdr(title,back){return `<div class="top"><button class="back" id="bk">←</button><b>${title}</b><button class="au" id="au">🔊 Écouter</button></div>`}
function bindBack(fn){const b=document.getElementById("bk");if(b)b.onclick=()=>{halt();fn()};const a=document.getElementById("au");if(a)a.onclick=()=>readOut(a)}
function setNav(v){const it=[["home","🏝️","Accueil"],["parcours","🗺️","Parcours"],["fiches","📚","Fiches"],["exam","⏱️","Examens"],["profil","👤","Profil"]];
  nav.innerHTML=it.map(x=>`<button class="${x[0]===v?"on":""}" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v,a,b){halt();AUSRC=null;window.scrollTo(0,0);setNav(v);({home,parcours,fiches,conseil,profil,day,exam})[v](a,b);try{if(v!=="day")location.hash=v}catch(e){}}

  bindBack(back);const bs=app.querySelectorAll(".opt");
    if(dif()>0){const tb=document.createElement("div");tb.className="timer";tb.style.fontSize="22px";app.querySelector(".card").prepend(tb);count(dif()===2?25:45,tb,()=>{const k2=l+"."+k;if(!S.w.includes(k2))S.w.push(k2);save();bs.forEach((x,m)=>{x.disabled=true;if(o[m][1])x.classList.add("good")});document.getElementById("fb").innerHTML=`<div class="fb"><b>Temps écoulé.</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;document.getElementById("nx").onclick=()=>{i++;i<items.length?show():done(Math.round(ok/items.length*100))}})}

    document.getElementById("fb").innerHTML=`<div class="fb"><b>${good?"Exact.":"Pas tout à fait."}</b> ${Q[2]}</div><button class="btn" id="nx">${i<items.length-1?"Suivant":"Terminer"}</button>`;

function cas(l,cs,done,back){AUSRC=null;let i=0,pts=0;(function show(){const C=L[l].c[cs[i]],o=shuf(C.o);hush();window.scrollTo(0,0);

function timerBox(sec){return `<div class="timer" id="tmr">${fmt(sec)}</div><div class="row"><button class="btn sec" id="tgo" style="margin:0">Démarrer le chrono</button></div>`}
const fmt=s=>(s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60))+":"+String(s%60).padStart(2,"0");

function say(t){if(!TTS)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.rate=.97;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}

function examOral(o){AUSRC=null;const back=()=>go("exam"),asked=[];
  app.innerHTML=hdr(o.t)+`<div class="card fiche"><h2 style="margin-top:0">Déroulement</h2><ul><li><b>${o.expo} minutes</b> d'exposé : ton parcours et ton projet. À la fin du temps, le jury te coupe.</li><li>Puis des questions jusqu'à <b>${o.total} minutes</b> au total, sans préparation, avec des relances.</li><li>Réponds <b>à voix haute</b>. Tu ne verras les attendus qu'au débriefing.</li><li>Aucune pause. Quitter l'écran annule l'épreuve.</li></ul><label class="ck" style="border:0"><input type="checkbox" id="vx" ${TTS?"checked":"disabled"}><span>Le jury pose ses questions à voix haute${TTS?"":" (indisponible sur cet appareil)"}</span></label><button class="btn" id="st">Entrer dans la salle</button></div>`;

    bindBack(back);document.getElementById("ok").onclick=()=>{let n=0;app.querySelectorAll("select").forEach(x=>n+=+x.value);note20(o.t,n,back)}}}
